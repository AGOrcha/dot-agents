schema_version: 1
plan_id: config-v2-coherence
tasks:
    - id: c0-governance-interface
      title: Governance/editability interface (policy-backend-agnostic)
      status: completed
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/editability.go
        - internal/config/editability_test.go
      verification_required: true
      notes: |-
        Per §7A.6 + the §8 governance open decision. Define the policy-backend-AGNOSTIC governance interface that
        answers "can principal P write source S?" — the seam org/team policy backends plug into (adapter-contract
        pattern). Ship the interface + a default impl: local always writable (personal); team/org return "governed"
        via a pluggable backend (none wired yet -> deny-or-prompt default); project derives (team/org-owned -> that
        governance, else personal/local-writable). First task of the plan; downstream routing (ch) consumes it.
      app_type: go-cli
    - id: ca-units-lock-schema
      title: 'Lock schema: collapse config/packages into one units section + inputs_digest'
      status: completed
      depends_on:
        - config-v2-migration/p1b-resolver-extends-tier1
        - config-v2-migration/p1d-resolver-offline-read-seam
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/agentslock/lockfile.go
        - internal/agentslock/lockfile_test.go
        - internal/config/lock_units.go
        - internal/config/lock_units_test.go
      verification_required: true
      notes: |-
        Per spec config-distribution-model §7A.2/§7A.3 (authoritative over §7). Replace the per-section
        config+packages lock shape with ONE units map keyed by "source:path@version" -> {kind: layer|artifact,
        digest, fetched_at, last_checked_at}; add top-level inputs_digest. adapters section stays separate
        (graph lifecycle owns it; do not touch). Add a v1->v2 lock migration (old config/packages + resolved_sha
        + ttl_expires_at -> units + digest + last_checked_at) with a round-trip fixture. Keep the shared
        agentslock writer atomic + sibling-preserving. Land-it-once: fold onto PR #205 (p1d) where the read seam
        consumes the lock. Write new units logic in internal/config/lock_units.go, NOT resolver.go.
      app_type: go-cli
    - id: cb-content-hash-staleness
      title: Content-hash driver-event staleness + TTL demotion to review-nudge
      status: completed
      depends_on:
        - ca-units-lock-schema
        - config-v2-migration/p2-lockfile-doctor-status
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/staleness.go
        - internal/config/staleness_test.go
        - internal/config/lockstatus.go
        - internal/config/lockstatus_test.go
      verification_required: true
      notes: |-
        Per §7A.3/§7A.4. Compute inputs_digest over ALL local scopes (user-local + project-local overlay +
        repo-local committed), whole-normalized. Staleness = inputs_digest mismatch OR declared extends/packages
        set changed OR a recorded digest no longer matches — NO clock. Demote cache_ttl: it never auto-invalidates;
        last_checked_at (per source) powers a doctor/explain "last re-checked N ago -> da config sync" nudge.
        Reshape p2's LockDrift to driver-event drift + nudge axis. Land-it-once: fold onto PR #206 (p2).
      app_type: go-cli
    - id: cc-cache-keys-per-source
      title: Per-source cache_keys (uv model) + per-kind staleness defaults
      status: completed
      depends_on:
        - cb-content-hash-staleness
        - config-v2-migration/p5-source-types-http-oci
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/cache_keys.go
        - internal/config/cache_keys_test.go
        - internal/config/agentsrc.go
        - schemas/agentsrc.schema.json
      verification_required: true
      notes: |-
        Per §7A.4. Default content key per source kind: git -> resolved commit; local -> resolved commit PLUS
        working-tree content (catches uncommitted authoring); http -> ETag/Last-Modified else digest; oci -> digest.
        Add Source.cache_keys ({file}/glob, {git:{commit,tags}}, {env}, {dir}) per [[schema-usage]] four-place
        AgentsRC rule + schema. Force escapes: per-unit --refresh and an always-revalidate marker. Land-it-once:
        fold onto PR #209 (p5).
        - (fb:cache-keys-unconsumed) cc was marked completed but cache_keys is inert — EffectiveCacheKey and DefaultCacheKey have zero non-test callers, and the fetcher (http/oci) plus resolver never consult cache keys or per-kind staleness, so setting cache_keys in .agentsrc.json is a silent no-op. Completed is terminal so cc stays completed and the gap is carried forward via follow-up task cl-cache-keys-consume.
      app_type: go-cli
    - id: cd-ensure-resolved-seam
      title: EnsureResolved auto-sync seam + --locked/--frozen/--no-sync/--offline
      status: completed
      depends_on:
        - cb-content-hash-staleness
        - config-v2-migration/p1d-resolver-offline-read-seam
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/ensure_resolved.go
        - internal/config/ensure_resolved_test.go
      verification_required: true
      notes: |-
        Per §7A.5. One seam EnsureResolved(projectPath, opts): cheap inputs_digest + declared-set check ->
        fresh = no-op (no network, no write) -> stale = re-resolve + rewrite lock -> (caller applies outputs half).
        Flags: --locked (assert; non-zero exit if the lock would change), --frozen (use lock as-is, skip check),
        --no-sync (skip outputs apply), --offline (lock/cache only). Builds on p1d ResolveLocked for the read path.
        Land-it-once: fold the seam onto PR #205 alongside ca-units-lock-schema.
      app_type: go-cli
    - id: ce-unified-artifact-sourcing
      title: 'Unified artifact sourcing: git/local valid for artifacts via @version'
      status: completed
      depends_on:
        - config-v2-migration/p5-source-types-http-oci
        - config-v2-migration/p4f-units-lock-7a-wiring
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/fetcher_oci.go
        - internal/config/fetcher.go
        - internal/config/fetcher_git_artifact.go
        - internal/config/fetcher_local_artifact.go
        - internal/config/fetcher_test.go
        - schemas/agentsrc.schema.json
      verification_required: true
      notes: |-
        Per §4 (relaxed) + §7A.1/§7A.2. Relax the tier-constraint: packages/artifacts may reference git/local/http/oci
        via source:path@version; only extends still rejects oci. Kind (layer|artifact) governs merge/trust, not which
        source is permitted. Absorbs the artifact-resolution mechanic of the retired p6 (§15 D3/D8: one units model,
        any source serves any kind, OCI is one source not the definition; no parallel `da packages` command tree).
        SCOPE CORRECTED 2026-06-23 (worker assessment): the schema source enum is ALREADY unified (local/git/http/oci,
        no per-tier exclusion) and extends-rejects-oci is ALREADY correct in resolver.go via SelectFetcher — so the
        original write_scope (agentsrc.go/resolver.go/resolver_test.go) had nothing to change. The real work lives in
        the fetchers: relax SelectPackageFetcher in fetcher_oci.go (today rejects git/local), ADD net-new git + local
        artifact-fetcher implementations of the FetchArtifact interface (only http+oci implement it today), and update
        fetcher_test.go TestSelectPackageFetcherTierConstraint (currently asserts git/local REJECTED) + add accept
        tests. SEQUENCING: collides with PR #96 (cl online cache_keys) on fetcher.go/fetcher_test.go — land #96 first,
        then rebase. Build on p5 (source types) + p4f (units-lock wiring).
      app_type: go-cli
    - id: cf-local-source-autosetup
      title: 'Git-backed local source: auto-bootstrap so local units version by ref'
      status: completed
      depends_on:
        - ca-units-lock-schema
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/local_source.go
        - internal/config/local_source_test.go
      verification_required: true
      notes: |-
        Per §7A.1. The local source is the git-synced ~/.agents repo. On first resolve / init, ensure it is
        git-initialized + resolvable so a local skill/agent/layer carries a real version (the local repo ref) and
        the lock records local:<path>@<ref> -> digest uniformly. One asset dir; remote-materialized units are
        gitignored from the local source so da sync never commits fetched assets (provenance = the unit's source).
      app_type: go-cli
    - id: cg-project-local-overlay
      title: Project-local overlay scope (.agentsrc.local.json, gitignored)
      status: completed
