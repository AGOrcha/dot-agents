summary: 'Fold the v2-coherence design (proposals/config-v2-coherence-scopes-sources-lock.md) into the config-distribution-model substrate: collapse config/packages into one units lock keyed by source:path@version+kind; content-hash driver-event staleness with TTL demoted to a per-source review-nudge; EnsureResolved auto-sync (lock+outputs, exact/prune) with --locked/--frozen/--no-sync; unified source:path@version with a git-backed auto-bootstrapped local source; new project-local overlay scope; --scope/--source CRUD routing + policy-agnostic editability; managed .gitignore auto-fill. Land-it-once: corrected impl pushed onto the in-flight config-v2 PRs (#205/#206/#207/#208/#209) where they map; net-new surfaces are fresh tasks. Intertwined with config-v2-migration via cross-plan deps so eligible spans both plans. CLOSEOUT (2026-06-25): all 13 tasks completed and shipped in 0.4.0; the §15 substrate is wired with production callers (see config-distribution-model §15.8). The follow-up extends-oci-relax (D15) later RELAXED criterion (4) — oci is now valid for extends too (see updated criterion below).'
