success_criteria: (1) .agentsrc.lock carries one units section keyed by source:path@version with kind + digest + last_checked_at and a top-level inputs_digest; config/packages sections removed; adapters untouched. (2) Staleness is content-hash driver events; cache_ttl never auto-invalidates (review-nudge only). (3) EnsureResolved seam re-resolves on local driver events and projects outputs exact/prune; --locked exits non-zero when the lock would change; --frozen/--no-sync/--offline honored. (4) Artifacts resolvable from git/local/http/oci via @version. NOTE — this plan shipped with extends still rejecting oci; the follow-up extends-oci-relax (config-distribution-model §15 D15) subsequently relaxed this so oci is now valid for extends too, via the media-type-guarded ociLayerFetcher in internal/config/fetcher_oci_layer.go, and SelectFetcher returns it for oci, so every source now serves every kind. (5) local source is git-backed + auto-bootstrapped; project-local overlay (.agentsrc.local.json, gitignored) resolves above repo-local committed and feeds inputs_digest. (6) CRUD/sync route via --scope/--source with an editability check; config explain auto-locks and absorbs status's config view. (7) da maintains a managed .gitignore block; .agentsrc.json/.agentsrc.lock stay committed.
verification_strategy: Per-task focused go test ./internal/config/... ./internal/agentslock/... ./commands/...; lockfile round-trip + units-migration fixture (v1 TTL lock -> v2 units lock); content-hash staleness table test (driver event vs no-op); EnsureResolved table test (fresh/stale/--locked/--frozen/--no-sync); exact/prune projection + .gitignore idempotency smoke; cache-keys per-source default + override unit tests; cross-plan eligibility check (da workflow eligible spans config-v2-migration + config-v2-coherence).
