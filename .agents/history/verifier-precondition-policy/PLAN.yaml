summary: 'Rework lpf-e''s hardcoded verifierPreconditions struct into a configurable precondition policy: predicates over the unified event contract, named in a top-level precondition_policies registry, referenced by stage profiles, resolved from the lockfile. Implements the layered-pr-fanout spec 2.3/6.1 amendment + unified-event-contract D2/D3 + stage-profile config. Slice A (evaluator) then Slice B (config/lockfile).'
