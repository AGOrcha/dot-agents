success_criteria: verifierTransition evaluates a resolved PreconditionPolicy (predicates over the event registry) with no hardcoded PROpen/SonarOK fields; precondition_policies is a top-level named registry referenced by stage profiles; policy resolved from the lockfile by app_type; built-in default reproduces the historical PR/go-cli gate; config verify rejects undefined policy refs and unregistered signal kinds; go test ./commands/workflow/... ./internal/config/... green.
verification_strategy: Focused go test on commands/workflow (evaluator + transitions) and internal/config (registry round-trip + schema + lockfile resolution + validation); table-driven predicate tests (each built-in satisfied/unsatisfied with reason); fail-closed tests (unregistered kind, undefined policy ref, empty policy falls back to default); end-to-end resolution app_type -> stage profile -> named policy from a synthetic lock.
