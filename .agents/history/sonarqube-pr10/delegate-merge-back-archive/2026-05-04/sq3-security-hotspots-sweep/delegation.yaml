success_criteria: |-
    Tier: T2 (compound — security review per hotspot).

    Source plan notes: reviewing one hotspot moved
    new_security_hotspots_reviewed from 0.0 to 2.8 — implying ~35-40
    hotspots remain to reach an acceptable threshold (depends on
    SonarCloud's threshold for the failing gate condition).

    Use mcp__sonarqube__search_security_hotspots and
    mcp__sonarqube__show_security_hotspot to triage.
    Use mcp__sonarqube__change_security_hotspot_status to mark each
    as REVIEWED with appropriate disposition (SAFE / FIXED /
    ACKNOWLEDGED) once examined.

    Hard test:
      new_security_hotspots_reviewed moves above the failing
      threshold AND every changed status carries a one-line
      justification visible in SonarCloud.

    Common false positive:
      Mass-marking hotspots as SAFE without genuine review. Defeats
      the purpose. Each hotspot must be inspected; the per-hotspot
      rationale lives in SonarCloud's status-change comment.

    ISP routing:
      mode: direct (orchestrator-driven triage with MCP tools; per-hotspot judgment)
      verifier: smoke (status changes land in SonarCloud); review = decision-quality (rationale per hotspot)
      review: decision-quality + code review for any hotspots that triggered actual code fixes
      anti-scope: do NOT mass-mark without review. Do NOT change rule severity or threshold to paper over the failure.
      bundle-context (if fanout): sq1's hotspot list, SonarCloud project URL
      output contract: new_security_hotspots_reviewed above threshold; per-hotspot rationale visible in SonarCloud
