title: Platform Session Integration
status: archived
summary: |-
    Implement cross-platform session data integration in four tiers: (P0) SessionReader
    foundation + agent block in iter-log (shipped first as the dependency surface for the
    rest); (P1) da session stats command aggregating Claude Code, Codex, and Cursor usage;
    (P2) real token metrics from session JSONL into iter-log session_tokens block; (P3)
    recent session context in orient.
created_at: "2026-05-10T00:00:00Z"
updated_at: "2026-05-12T02:48:30Z"
owner: dot-agents
success_criteria: |-
    da session stats renders token/session/attribution data from all available platforms
    with graceful degradation for absent files. da workflow checkpoint writes a session_tokens
    block with real cache_hit_rate when a session JSONL is linked. da workflow orient includes
    a recent-sessions section for branches with prior Claude Code sessions. All tests pass
    including TestWorkflowIterLogEmbeddedSchemaMatchesCanonical.
verification_strategy: |-
    Focused go test ./commands/... after each task. Manual smoke via da session stats,
    da workflow checkpoint --log-to-iter, and da workflow orient on a branch with prior sessions.
    Schema sync test enforces static/workflow-iter-log.schema.json parity.
