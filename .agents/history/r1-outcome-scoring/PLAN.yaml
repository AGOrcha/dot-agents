title: 'R1: Outcome scoring for agent runs'
status: archived
summary: Compute an explainable quality/success score per session and per iteration from already-captured signals (token/cache telemetry, verifier results, merge-back status, scope adherence, test outcomes). Scores persist alongside telemetry and are CLI-queryable, driven by a documented, versioned rubric.
