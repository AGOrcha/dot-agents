owner: dot-agents
success_criteria: Every iteration and session has a numeric score with a per-signal breakdown; scores persist alongside the existing telemetry and are CLI-queryable; a versioned scoring rubric is documented so changing it is a deliberate, reviewable act.
verification_strategy: Go unit tests for the scorer and rubric versioning; a CLI smoke that scores a known run and prints the signal breakdown; rubric version pinned and asserted.
