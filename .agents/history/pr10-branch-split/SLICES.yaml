        MCP server: JSON-RPC dispatch → tool routing → error handling
        Migrations: EnsureSchema creates 5 tables + 12 indexes (idempotent)
        Impact: BFS with depth/node caps, cycle handling, adjacency maps
      Also covers KG note operations: UpsertKGNote, GetKGNote,
      LinkKGNoteToSymbol, GetNotesLinkedTo (warm layer indexing).
      postgres.go is skipped if no integration DB — document skip reason.
    status: completed
    completed_at: "2026-05-12T19:30:00Z"
    completed_commit: e3477e1
    depends_on: []
