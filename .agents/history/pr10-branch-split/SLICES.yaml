        maintain reweave (fix broken note links, add missing edges)
        maintain mark-stale (notes older than threshold → status=stale)
        maintain compact (archive superseded/archived notes)
      Covers raw source recording in raw/inbox, entity/decision
      extraction from ingested content, source→imported lifecycle,
      lint result classification, and the three maintain subcommands
      as repair operations on detected lint issues.
      Also covers sync → lint (pull then validate) chain and
      note archive/stats subcommands.
      Surfaced and fixed persistReweavedNote body-loss bug (commit de7ebae).
    status: completed
    completed_at: "2026-05-12T15:55:00Z"
    completed_commit: 17d06fd
    depends_on: []
    write_scope:
      - commands/kg/query_lint_maintain_test.go
    verification_focus: |-
      go test ./commands/kg/... passes. Ingest creates source +
      entity + decision notes. Lint detects seeded issues (broken
      links, stale notes). Maintain reweave fixes broken links.
      mark-stale transitions old notes. compact archives them.
    owner: dot-agents

