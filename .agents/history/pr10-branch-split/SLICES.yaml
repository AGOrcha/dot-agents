      - internal/graphstore/mcp_server_test.go
      - internal/graphstore/impact_test.go
      - internal/graphstore/migrations_test.go
      - internal/graphstore/postgres_test.go
    verification_focus: |-
      go test ./internal/graphstore/... passes. SQLite CRUD round-trips
