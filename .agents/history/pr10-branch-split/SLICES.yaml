  - id: pr3b-graphstore-backends
    parent_task_id: pr3b-workflow
    title: "PR3b: graphstore Store interface + SQLite + CRG bridge + MCP server"
    summary: |-
      Test the graphstore layer that backs workflow graph queries:
        SQLite: UpsertNode/Edge → GetNode/GetEdgesBySource/Target →
          SearchNodes → GetStats → GetImpactRadius (BFS traversal)
        CRG bridge: Build → Update → Status → DetectChanges → GetImpactRadius
