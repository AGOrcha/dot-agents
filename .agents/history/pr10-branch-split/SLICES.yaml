        sync init → commit → push/pull → status/log (git ops on ~/.agents/)
        skills new → promote (repo-local → ~/.agents/skills/) → refresh
        agents new → promote → import → remove
        hooks list → show → remove (HOOK.yaml bundle management)
      Covers the agents/cmd.go and hooks/cmd.go subcommand trees,
      sync helpers (ensureGitRepo, runGitCommand), and the
      skills/agents promotion pipeline that moves resources
      from .agents/skills/ to ~/.agents/skills/.
