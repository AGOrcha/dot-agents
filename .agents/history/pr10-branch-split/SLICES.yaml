    completed_at: "2026-05-12T19:00:00Z"
    completed_commit: b188e8b
    depends_on: []
    write_scope:
      - commands/root_test.go
      - commands/sync/init_test.go
      - commands/sync/commit_test.go
      - commands/sync/push_test.go
      - commands/sync/helpers_test.go
      - commands/skills_test.go
      - commands/agents/cmd_test.go
      - commands/hooks/cmd_test.go
