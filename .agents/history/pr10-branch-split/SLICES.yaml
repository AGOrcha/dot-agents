    summary: |-
      Test the resource management and review flows:
        rules/mcp/settings/hooks list → show → remove → refresh
        review list → show <id> → approve/reject
        explain [topic] (overview, structure, platforms, links, manifest)
      Each resource command shares the same three-subcommand pattern
      (list, show, remove) but scans different canonical dirs.
      Review reads ~/.agents/proposals/, applies on approve.
      Also covers session-stats (token usage display) and the
      shared UX helpers (errNoWorkflowProject, resolveProject,
      formatTable, renderAuditSection) used across commands.
    status: completed
    completed_at: "2026-05-12T18:30:00Z"
    completed_commits: [b8fe87f, d5fde31]
    depends_on: []
    write_scope:
      - commands/rules_test.go
      - commands/mcp_test.go
      - commands/settings_test.go
      - commands/review_test.go
      - commands/explain_test.go
      - commands/session_stats_test.go
      - commands/ux_test.go
    verification_focus: |-
      go test ./commands/... passes. Resource list/show/remove
      round-trip verified for rules, mcp, settings. Review
      approve applies proposal. explain renders all topics.
      UX helpers tested for error formatting and table rendering.
    owner: dot-agents

  - id: pr3a-subpkg-wiring-sync
    parent_task_id: pr3a-base-commands
    title: "PR3a: subpackage wiring + sync + skills/agents promotion"
    summary: |-
      Test command registration and the sync/skills/agents flows:
