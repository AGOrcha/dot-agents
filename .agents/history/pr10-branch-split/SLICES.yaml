slices:
  # ── PR3a slices (23.2% → 80%) ──────────────────────────────────────────
  # Organized by user flow, not by file. Each slice tests a complete
  # behavioral chain end-to-end, covering the files involved in that flow.

  - id: pr3a-bootstrap-lifecycle
    parent_task_id: pr3a-base-commands
    title: "PR3a: bootstrap + project lifecycle chain"
    summary: |-
      Test the full project bootstrap and lifecycle flow:
        init → add → refresh → status (verify linkage)
        add → status --audit → remove → status (verify cleanup)
      Covers idempotent re-init (--force), --dry-run for each,
      --name override on add, --clean flag on remove, platform
      CreateLinks/RemoveLinks round-trip, config.json project
      registration/deregistration, and .agentsrc.json creation.
      Also tests doctor repair flow: doctor detects broken links
      then re-runs CreateLinks to fix them.
    status: completed
    completed_at: "2026-05-12T15:55:00Z"
    completed_commit: c8b1943
    depends_on: []
    write_scope:
      - commands/init_test.go
      - commands/add_test.go
      - commands/remove_test.go
      - commands/refresh_test.go
      - commands/status_test.go
      - commands/doctor_test.go
    verification_focus: |-
      go test ./commands/... passes. Round-trip chain verified:
      init creates ~/.agents/, add registers project + creates links,
      status shows project, remove unlinks, status shows removal.
      doctor repairs broken links. Each command respects --dry-run.
    owner: dot-agents

  - id: pr3a-import-install-pipeline
    parent_task_id: pr3a-base-commands
    title: "PR3a: import + install manifest pipeline"
    summary: |-
      Test the config ingestion pipelines:
        import [project] → import plugins → refresh → status
        install (from .agentsrc.json) → CreateLinks → status
      Covers import scope filtering (--scope project|global|all),
      hook normalization (cursor.json/codex.json → HOOK.yaml bundles),
      plugin manifest discovery, git source resolution + caching,
      install --generate (reverse: current state → .agentsrc.json),
      and the mapResourceRelToDest path normalization shared between
      import and refresh.
    status: completed
    completed_at: "2026-05-12T16:35:00Z"
    completed_commit: 13dbb89
    depends_on: []
    write_scope:
      - commands/import_test.go
      - commands/import_plugins_test.go
      - commands/install_test.go
    verification_focus: |-
      go test ./commands/... passes. Import round-trip: platform
      configs imported to ~/.agents/, refresh re-renders them.
      Install from manifest: .agentsrc.json → resolved links.
      import --scope filters correctly. install --generate produces
      valid manifest from current state.
    owner: dot-agents

  - id: pr3a-resource-review-chain
    parent_task_id: pr3a-base-commands
