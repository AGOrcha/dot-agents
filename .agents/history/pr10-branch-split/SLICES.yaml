  # ── PR3c slices (45.8% → 80%) ──────────────────────────────────────────

  - id: pr3c-kg-bootstrap-query
    parent_task_id: pr3c-kg
    title: "PR3c: KG bootstrap → warm → query end-to-end"
    summary: |-
      Test the knowledge graph bootstrap and query chain:
        setup → warm → query (complete KG initialization)
        setup creates KG_HOME dir tree (self/schema, raw/inbox,
        notes/{sources,entities,decisions,...}, ops/...), writes
        config.yaml + index.md + log.md, inits empty warm SQLite.
        warm walks notes/ and indexes into warm SQLite, optionally
        loads CRG code nodes/edges, writes last_warm_sync metadata.
        warm stats queries SQLite for note/link/code counts.
        query dispatches on intent (source_lookup, entity_context,
        decision_lookup, synthesis_lookup, concept_lookup, repo_context,
        related_notes, contradictions, graph_health) via searchNotes
        (filesystem text search scored by title/summary/body match).
      Also covers health (walk notes counting stale/orphan/queue,
      write graph-health.json) and stats/status subcommands.
    status: completed
    completed_at: "2026-05-12T15:12:37Z"
    completed_commit: 09d3e20
    depends_on: []
    write_scope:
      - commands/kg/kg_test.go
    verification_focus: |-
      go test ./commands/kg/... passes. Setup → warm → query
      round-trip verified. Each query intent returns expected results.
      Health computes stale/orphan counts correctly. Warm stats
      reflect indexed note count.
    owner: dot-agents

  - id: pr3c-kg-curation-loop
    parent_task_id: pr3c-kg
    title: "PR3c: ingest → lint → maintain curation cycle"
