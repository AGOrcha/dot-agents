success_criteria: 'Phase 2 of CF deploy infra. Phase 1 (just landed inline 2026-05-28): scoped token agorcha-dev-docs-deploy-20260528 expires 2026-07-27, set as CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID GH secrets on NikashPrakash/dot-agents. Phase 2 deliverable: scheduled workflow that mints a fresh scoped token (same policies as bootstrap), updates the GH secret, then revokes prior dated tokens after a 7-day grace period. Bootstrap mechanism: needs an auth context capable of POST /user/tokens — easiest path is a small ''rotation token'' with User:API Tokens Edit + User:API Tokens Read perms (long-lived, separate GH secret CLOUDFLARE_ROTATION_TOKEN). Alternative: Cloudflare OIDC federation w/ GitHub OIDC eliminates long-lived secrets entirely — research whether CF supports OIDC for token-mint operations yet (was beta as of early 2026). Secret-update mechanism: gh-CLI in workflow uses a fine-grained PAT scoped to Actions:write+Secrets:write on this single repo (GITHUB_TOKEN cannot write secrets). Cron: monthly on the 1st 06:00 UTC + workflow_dispatch. Token naming: ''agorcha-dev-docs-deploy-YYYYMMDD'' so old tokens are auto-discoverable for revocation. Lifecycle: mint new → swap secret → wait 24h grace → revoke tokens matching name prefix AND created >30d ago. Reference policy IDs (cached at /tmp/cf-perms.json from phase 1; should bake into the rotation script as constants): Workers Scripts Write=e086da7e..., Account Settings Read=c1fde68c..., Workers Routes Write=28f4b596..., DNS Write=4755a26e..., Zone Read=c8fed203..., User Details Read=8acbe5bb....'
