success_criteria: 'Every worker in this session has hit ''JGit RepositoryNotFoundException: .git/worktrees/<name>'' and used SKIP=sonar-scanner workaround. Per [[seam-loop-lock-2026-05-19]] this is a known JGit limitation: it can''t resolve the worktree''s gitfile pointer back to the parent .git/ dir for the SCM probe. Possible fixes: (a) replace sonar-scanner CLI in pre-commit with a wrapper that sets SONAR_PROJECT_BASE_DIR to the real parent .git/ when invoked from a worktree; (b) docker-mount the parent .git/ into the scanner container; (c) defer scanner to CI only + skip locally (cheapest but loses pre-push signal). Pick the cheapest correct fix; document the choice in the lesson [[seam-loop-lock-2026-05-19]].'
