success_criteria: From the t3 round-2 re-review — two narrow residuals deliberately deferred (same-user local race, out of the realistic threat model, so low priority). (a) verify-to-link TOCTOU — verifyProjectionInputs re-hashes the CAS tree before ProjectResolvedUnits, but the symlink then references the live (dir-writable) CAS tree and projection never re-hashes, so a same-user process can replace a 0o444 file in the writable dir between verify and link/use. Closing it needs invocation-time verification (re-hash at the link/execution boundary) or truly-immutable storage (read-only bind mount / per-entry read-only dir with a GC-safe teardown). (b) a mid-fetch failure can leave the first already-materialized CAS entry orphaned — add store GC of unreferenced digest entries. The core H7 anchor (offline content-digest, all refs) and install/verify-time tamper detection already shipped in t3.
