success_criteria: Scope is END-TO-END across the da command chain, NOT limited to this plans fetch to materialize to project path — that path is one hot segment inside a larger surface. Flows to baseline and profile — da install (commands/internal/lifecycle/install.go), da refresh (commands/refresh.go), da config sync|explain|verify|lint (commands/config/*.go), da status, the two-pass resolution (pass-1 layers/extends in internal/config/resolver.go LayeredResolver.Resolve/resolveExtends; pass-2 packages in internal/config/ensure_resolved.go EnsureResolved), the shared-target projection in internal/platform/resource_plan.go (RunSharedTargetProjectionExact and the platform builders), and the .agentsrc.lock read-modify-write (WriteConfigLock / writeUnitsLock). Methodology — 1) establish repeatable baselines via Go testing.B benchmarks (new *_bench_test.go files) and/or a scripted timing harness under scripts/perf/ run over realistic fixtures (many layers, many packages/artifacts, cold vs warm CAS cache, N projects); 2) profile the hot flows with pprof cpu and alloc profiles; 3) identify the top bottlenecks with concrete before-and-after numbers; 4) optimize the identified hot paths; 5) leave a regression guard — a committed benchmark suite runnable via go test -bench, plus a documented perf budget (docs/PERF_BUDGET.md) so results cannot silently regress. Done criteria — baselines committed and runnable; top-K bottlenecks profiled with a stated improvement or a justified already-fast verdict per bottleneck; regression guard in place (benchmarks + documented budget); full suite (go test ./internal/config/... ./commands/... ./internal/platform/...) still green. Gating — this is one of the LAST tasks in the plan; it depends on t3-lock-and-wire-pass2 (pass-2 wiring), t5-wire-consumer-and-smoke (real end-to-end consumer), t6-oci-consume and t8-oci-publish (OCI round trip) so it profiles the real end-state chain, not a partial build. write_scope may widen at optimization time once bottlenecks are identified.
