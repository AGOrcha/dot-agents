schema_version: 1
plan_id: package-artifact-install
tasks:
    - id: t1-bundle-fetch
      title: Normalize artifact fetch to a bundle (tree subtree + tarball)
      status: completed
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/fetcher_git_artifact.go
        - internal/config/fetcher_local_artifact.go
        - internal/config/fetcher_oci.go
        - internal/config/fetcher_http.go
        - internal/config/bundle_safety.go
        - internal/config/bundle_safety_test.go
        - internal/config/fetcher_test.go
        - internal/config/fetcher_oci_layer_test.go
      verification_required: true
      notes: Normalize fetch to an in-memory bundle (git subtree walk + tarball untar). H1 — route every bundle through a fail-closed normalizer (canonical relative slash paths only; reject empty/dot/dotdot/absolute/drive/UNC/duplicate/case-collide and all symlink/hardlink/device entries; cap file count + expanded bytes). H8 — content-addressed cache publishes via same-dir temp+rename and re-verifies every cache hit against its digest. Adversarial tree+tar tests are a done-criterion. Keep the media-type envelope; no new kinds.
      app_type: go-cli
    - id: t2-materialize-store
      title: Materialize a fetched bundle into the gitignored sourced-scope store
      status: completed
      depends_on:
        - t1-bundle-fetch
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/materialize.go
        - internal/config/local_source.go
        - internal/links/gitignore.go
        - internal/platform/resource_plan.go
        - internal/platform/resources.go
      verification_required: true
      notes: Materialize into a content-addressed immutable store path (H2) and project it at the reserved _sourced namespace ~/.agents/<family>/_sourced/<source-id>/<name>/ (H3) — never a segment equal to a local scope (global, project name); refuse replacing any path lacking sourced provenance. H4 — the _sourced ignore is permanent, installed+verified BEFORE the tree is exposed, CAS/locked block rewrite, removed only on store deletion. Validate bundle then staging-dir + atomic rename. Reuse RunSharedTargetProjectionExact (D4), no parallel linker.
      app_type: go-cli
    - id: t3-lock-and-wire-pass2
      title: Record kind:artifact lock unit and wire packages pass-2 into install/refresh
      status: completed
      depends_on:
        - t2-materialize-store
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/resolver.go
        - internal/config/ensure_resolved.go
        - internal/config/unit_kinds.go
        - commands/refresh.go
        - commands/internal/lifecycle/install.go
        - commands/config/verify.go
      verification_required: true
      notes: H9 — split pure resolve/lock-update from hydrate-from-lock; hydrate once through the real lifecycle (commands/internal/lifecycle/install.go, commands/refresh.go) BEFORE projection; never write on the frozen/locked-clean no-write contract except the explicit hydrate step. H7 — pass a production artifact-store digest resolver to BOTH EnsureResolved and config verify so post-install store tampering blocks projection. H10 — record the artifact as a kind:artifact units entry with the verified content digest; derive the install path deterministically (do NOT add install_path to LockedUnit). H13 (DRIVES the projection) — pass-2 resolves THIS project's packages into a resolved unit list of {family,name,source-id,digest,cas-path} and calls t2's caller-driven projection mechanism with exactly that set; projection is per-project CAS-direct (repo output links to ~/.agents/cache/artifacts/<family>/<digest>/ for the project's resolved digest), NEVER a global _sourced scan. commands/install.go path was stale (use commands/internal/lifecycle/install.go).
      app_type: go-cli
    - id: t4-author-da-agc
      title: Populate the da-agc source (config layer + skill/agent resource trees)
      status: completed
      depends_on:
        - t1-bundle-fetch
      blocks: []
      owner: dot-agents
      write_scope:
        - (external repo AGOrcha/da-agc; no in-tree files)
      verification_required: true
      notes: Author da-agc as a git source. Add the da-project/base config layer (execution_profile, stage_profiles, rules, skill/agent name arrays) and the tree-layout resource dirs (skill/<name>/, agent/<name>/) for the dot-agents specifics starting with release-docs-refresh and platform-dirs-change-analyst. Plain files, git-tracked in da-agc.
      app_type: docs
    - id: t5-wire-consumer-and-smoke
