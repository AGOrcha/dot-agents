        - t2b-multiplatform-agent-projection
      blocks: []
      owner: dot-agents
      write_scope:
        - .agentsrc.json
        - .agentsrc.lock
        - scripts/verify.sh
        - internal/config/resolver_test.go
        - tests
      verification_required: true
      notes: Declare the da-agc git source plus extends (layer) and packages (artifacts) in dot-agents .agentsrc.json. Prove config-layer parity and that fetched skill/agent trees materialize gitignored + locked + invocable. Extend the git-source-smoke fixture from layer-only to content install (DC2).
      app_type: go-cli
    - id: t6-oci-consume
      title: Consume OCI artifacts (fetch, tag/digest resolve, media-type validate)
      status: completed
      depends_on:
        - t3-lock-and-wire-pass2
        - t1b-fetch-materialization-bounds
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/fetcher_oci.go
        - internal/config/resolver.go
        - internal/config/oci_resolve.go
      verification_required: true
      notes: 'H5 — pinned: addresses the manifest; recompute SHA-256 over the fetched payload and compare to the layer descriptor BEFORE cache/untar; lock the verified content digest; handle manifest-digest not equal blob-digest. H6 — require manifest artifactType == artifact-bundle media type AND the family-specific type; reject empty/missing/mismatch (remove the empty-type tolerance at fetcher_oci.go:423-434). CRITICAL from t3 review — the OCI fetcher returns only Data+Digest and never populates FetchedArtifact.Bundle, so every OCI package fails the pass-2 driver as ''not a directory-shaped bundle''. Run fresh AND cached OCI payloads through UntarBundle/MaybeUntarBundle (t1''s H1 normalizer) to populate Bundle, and add an OCI-to-pass2 integration test. Reuse the t2 materialize path. SemVer ranges deferred.'
      app_type: go-cli
    - id: t7-oci-auth
      title: OCI registry auth (bearer + credential-helper providers)
      status: completed
      depends_on:
        - t6-oci-consume
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/oci_auth.go
        - internal/config/fetcher_oci.go
        - internal/config/audit.go
        - internal/gitremote
      verification_required: true
      notes: H12 — auth config carries secret references only; resolved env/file/helper secrets never enter Source.Auth persistence, locks, cache metadata, errors, audit events (audit.go currently logs raw Err.Error()), logs, generated files, or argv. Helper queries over stdin; tokens in headers only; central error redaction. Providers — bearer + credential-helper only (oauth2/mtls stay owned by external-agent-sources). Sentinel-secret leak tests across lock/stderr/audit.
      app_type: go-cli
    - id: t8-oci-publish
      title: OCI publish producer on the unified surface + round-trip byte-parity smoke
      status: completed
      depends_on:
        - t2-materialize-store
        - t6-oci-consume
        - t7-oci-auth
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/artifact_bundle.go
        - commands/config
        - scripts/verify.sh
        - internal/config/fetcher_oci_test.go
      verification_required: true
      notes: Publish producer on the CANONICAL UNIFIED resource CRUD surface (owner ruling 2026-07-15) — do NOT revive the retired da packages family / commands/packages. Pack a resource tree into a typed +tar+gzip artifact-bundle via the H1 normalizer, push to an OCI registry at namespace/family/name tag, emit the sha256 digest. OCI round-trip smoke — publish to a local test registry then pull via an oci source; assert materialize, H5/H6 media-type+digest validation, and RECURSIVE byte-parity of source vs materialized tree (R8). Depends on t7 for auth reuse.
      app_type: go-cli
    - id: t1b-fetch-materialization-bounds
      title: Bound raw fetch/clone materialization before normalizer caps (go-git in-memory clone + directory enumeration)
      status: completed
      depends_on:
        - t1-bundle-fetch
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/fetcher_git_artifact.go
        - internal/config/fetcher_local_artifact.go
        - internal/config/fetcher.go
      verification_required: true
      notes: From the t1 final cross-harness gate — two DoS residuals live in the clone/enumeration LAYER (raw input materialized before the normalizer bounds apply), distinct from the normalizer hardening. (a) go-git gitCloneShallow downloads+checks out the whole repo into an in-memory storer before the MaxFileBytes gate runs — use a disk or quota-backed storer, or a pre-checkout blob-size check, so an oversized git blob cannot exhaust memory. (b) os.ReadDir(-1) (local) and Billy ReadDir (git) materialize a full directory listing before MaxEntries can stop a flat-entry flood — enumerate in bounded batches, and for git traverse a quota-checked committed tree instead of the all-at-once worktree API. Gate BEFORE t6-oci-consume / t5 production use (first real untrusted-remote consume). BLOCKER host-file-read + pinning + injection are already closed in t1.
      app_type: go-cli
    - id: t2b-multiplatform-agent-projection
      title: Extend CAS-aware sourced-unit projection to the file-shaped platform builders (Codex TOML, OpenCode, Copilot)
      status: completed
      depends_on:
        - t2-materialize-store
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/platform/resource_plan.go
        - internal/platform/codex.go
        - internal/platform/opencode.go
        - internal/platform/copilot.go
      verification_required: true
      notes: PRIMARY — extend CAS-aware sourced-unit projection to the file-shaped platform builders (Codex .toml at resource_plan.go:472, OpenCode/Copilot agent-files at :514/:1060) which still enumerate only local canonical agents, so a sourced agent (platform-dirs-change-analyst from da-agc) is ABSENT on Codex/OpenCode/Copilot. Add CAS-aware render/file intent driven by the caller-supplied resolved-unit set (H13) + exact-prune tests per platform. ALSO harden atomicManagedSymlinkSwap — a documented residual nanosecond TOCTOU remains (a verified managed link swapped for a user file between the identity-verify and the rename); close it with RENAME_NOREPLACE on Linux plus a verify-after-rename fallback on other platforms. ALSO consolidate the sharedDirMirrorRoots type-switch into a first-class Platform method. Gate BEFORE t5.
      app_type: go-cli
    - id: t3b-invocation-time-integrity
      title: Invocation-time integrity + CAS orphan GC (close the verify-to-use TOCTOU; defense-in-depth)
      status: completed
      depends_on:
        - t3-lock-and-wire-pass2
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/materialize.go
        - internal/platform/resource_plan.go
      verification_required: true
      notes: From the t3 round-2 re-review — two narrow residuals deliberately deferred (same-user local race, out of the realistic threat model, so low priority). (a) verify-to-link TOCTOU — verifyProjectionInputs re-hashes the CAS tree before ProjectResolvedUnits, but the symlink then references the live (dir-writable) CAS tree and projection never re-hashes, so a same-user process can replace a 0o444 file in the writable dir between verify and link/use. Closing it needs invocation-time verification (re-hash at the link/execution boundary) or truly-immutable storage (read-only bind mount / per-entry read-only dir with a GC-safe teardown). (b) a mid-fetch failure can leave the first already-materialized CAS entry orphaned — add store GC of unreferenced digest entries. The core H7 anchor (offline content-digest, all refs) and install/verify-time tamper detection already shipped in t3.
      app_type: go-cli
    - id: t9-perf-testing-optimization
      title: Performance testing + optimization across the da command chain
      status: completed
      depends_on:
        - t3-lock-and-wire-pass2
        - t5-wire-consumer-and-smoke
        - t6-oci-consume
        - t8-oci-publish
        - t3b-invocation-time-integrity
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/resolver_bench_test.go
        - internal/config/ensure_resolved_bench_test.go
        - internal/platform/resource_plan_bench_test.go
        - commands/internal/lifecycle/install_bench_test.go
        - commands/refresh_bench_test.go
        - commands/config/sync_bench_test.go
        - scripts/perf/
        - internal/config/resolver.go
        - internal/config/ensure_resolved.go
        - internal/platform/resource_plan.go
        - internal/config/materialize.go
        - internal/config/fetcher_oci.go
        - docs/PERF_BUDGET.md
      verification_required: true
      notes: Scope is END-TO-END across the da command chain, NOT limited to this plans fetch to materialize to project path — that path is one hot segment inside a larger surface. Flows to baseline and profile — da install (commands/internal/lifecycle/install.go), da refresh (commands/refresh.go), da config sync|explain|verify|lint (commands/config/*.go), da status, the two-pass resolution (pass-1 layers/extends in internal/config/resolver.go LayeredResolver.Resolve/resolveExtends; pass-2 packages in internal/config/ensure_resolved.go EnsureResolved), the shared-target projection in internal/platform/resource_plan.go (RunSharedTargetProjectionExact and the platform builders), and the .agentsrc.lock read-modify-write (WriteConfigLock / writeUnitsLock). Methodology — 1) establish repeatable baselines via Go testing.B benchmarks (new *_bench_test.go files) and/or a scripted timing harness under scripts/perf/ run over realistic fixtures (many layers, many packages/artifacts, cold vs warm CAS cache, N projects); 2) profile the hot flows with pprof cpu and alloc profiles; 3) identify the top bottlenecks with concrete before-and-after numbers; 4) optimize the identified hot paths; 5) leave a regression guard — a committed benchmark suite runnable via go test -bench, plus a documented perf budget (docs/PERF_BUDGET.md) so results cannot silently regress. Done criteria — baselines committed and runnable; top-K bottlenecks profiled with a stated improvement or a justified already-fast verdict per bottleneck; regression guard in place (benchmarks + documented budget); full suite (go test ./internal/config/... ./commands/... ./internal/platform/...) still green. Gating — this is one of the LAST tasks in the plan; it depends on t3-lock-and-wire-pass2 (pass-2 wiring), t5-wire-consumer-and-smoke (real end-to-end consumer), t6-oci-consume and t8-oci-publish (OCI round trip) so it profiles the real end-state chain, not a partial build. write_scope may widen at optimization time once bottlenecks are identified.
      app_type: go-cli
    - id: t2c-codex-import-seam
      title: Route unmarked-collision codex renders into the import-to-scope seam (replace t2b hard-refuse)
      status: completed
      depends_on:
        - t2b-multiplatform-agent-projection
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/platform/codex.go
        - commands/import.go
        - commands/refresh.go
        - internal/platform/codex_test.go
        - commands/import_test.go
      verification_required: true
      notes: Owner direction — replace t2b's fail-closed refuse of an unmarked colliding .codex/agents render with the EXISTING import mechanism (commands/import.go), importing to the scope the file physically lives at. Content-aware — an unmarked toml whose bytes match the render we would write is provably our prior output, so mark+adopt silently (write the marked-but-identical render); a content-diverged toml is imported as a user resource at its scope via importCandidate (Origin=codex) + RFC section 6 non-destructive alternate naming + an import-conflict review note at ~/.agents/review-notes/import-conflicts/. Hook via runImportFromRefresh so it runs on refresh. Do NOT touch resource_plan.go (t3b owns integrity there) — keep this to codex.go + import.go + refresh.go so it is parallel-safe. Resolves fold-back obs-codex-toml-marker-upgrade-migration. Ships in 0.5.0.
