title: Convert commands/install.go to per-file installDeps interface
summary: |-
    Migrate install.go from package-var func-seams
    (osMkdirAll/osSymlink/osGetwd/configLoad) to a per-file installDeps
    interface following the established init.go pattern. install_test.go
    and the install-related branches of seams_test.go switch to the
    fakeInstallDeps fault-injection pattern.
write_scope:
    - commands/install.go
    - commands/install_test.go
    - commands/seams.go
    - commands/seams_test.go
success_criteria: |-
    install.go uses interface-DI per docs/TEST_SEAMS.md (installDeps,
    stdInstallDeps, fakeInstallDeps with nil-delegates-to-real); all
    commands tests pass under -race; go build and go vet clean. Legacy
    seams in seams.go remain in place because add.go and review.go still
    consume them — atomic delete is the final commit on the branch.
verification_expectations: |-
    go build ./...
    go test ./commands -race -count=1 -timeout 240s
    go vet ./...
may_mutate_workflow_state: false
