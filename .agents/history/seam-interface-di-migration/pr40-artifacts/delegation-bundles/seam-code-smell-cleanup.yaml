known_gotchas:
  - description: |
      NEVER `cd` to the worktree. Always
      `git -C /Users/nikashp/Documents/dot-agents/.claude/worktrees/seam-di <cmd>`.
      NEVER `git add .` — always explicit paths.
    severity: blocker

  - description: |
      DO NOT rename a parameter to `_` if its signature implements a
      cobra command (`func(cmd *cobra.Command, args []string) error`)
      or satisfies an interface (e.g. cobra.PositionalArgs, or a
      method on stdXxxDeps that has to match the interface). Cobra's
      `cmd` and `args` parameters MUST keep their names even when
      unused — renaming them breaks the signature match. Verify each
      unused-parameter fix with `go build ./...` after every edit.
    severity: high

  - description: |
      The list of confirmed smells from session diagnostics:
        1. install_test.go:1366 — "Loop can be simplified using slices.Contains" (slicescontains)
        2. refresh.go:179 — "unnecessary nil check around range" (S1031)
        3. review_test.go:511 — "interface{} can be replaced by any"
        4-6+. Pick 3-5 safe unused-parameter renames-to-underscore
              from this candidate set, applying the cobra/interface
              rule above:
                - import_plugins.go:225 (sourceRoot)
                - import_plugins.go:467 (platformID)
                - import_plugins.go:533 (manifestPath)
                - add.go:647 (projectPath)
                - doctor.go:625 (agentsHome)
                - doctor.go:740 (agentsHome)
                - status.go:872 (agentsHome)
                - status.go:1071 (name, agentsHome)
                - status.go:1085 (name, agentsHome)
                - status.go:1169 (name, agentsHome)
                - status.go:1197 (name)

      For each candidate, check whether the function is called from
      outside its file or implements an interface. If yes, leave it
      alone (silence the linter with `_ = paramName` only if the
      param is genuinely never used, OR remove it from the signature
      if you can verify no caller breaks — but signature removal is
      out of scope for this cleanup commit).
    severity: high

  - description: |
      DO NOT touch init.go:55 or doctor.go:64 unused params — those
      are cobra cmd/args signatures and renaming them breaks Cobra's
      reflective signature match.
    severity: blocker

