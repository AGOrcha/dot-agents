schema_version: 1
plan_id: binary-rename-da-sweep
tasks:
    - id: t1-decide-shim-or-cutover
      title: Decide compat-shim vs hard-cutover; produce ADR-0006
      status: completed
      depends_on: []
      blocks:
        - t2-ship-shim-or-cutover-binary
        - t3-sweep-priority-docs
        - t4-sweep-plans-specs-research
        - t5-sweep-skills-rules-claude-md
        - t6-ts-port-binary-decision
      owner: dot-agents
      write_scope:
        - docs/adr/0006-da-rename-strategy.md
        - docs/adr/README.md
      verification_required: false
      notes: |-
        Tier: T2 (compound — load-bearing decision affecting downstream
        sweep mechanics).

        User intent to capture: hard cutover. ADR-0006 should treat that
        as the chosen direction unless t1 uncovers a concrete blocker that
        forces reopening the decision.

        Concrete deliverable: docs/adr/0006-da-rename-strategy.md captures:
          * Strategy options (A) compat shim, (B) hard cutover, (C) hybrid
          * Recommendation aligned to user intent: hard cutover
          * Consequences: shim cost (one extra goreleaser builds: block,
            maintenance (deprecation timeline) vs cutover cost (one-shot
            ecosystem break + broader sweep discipline), user-comms requirements
          * Decision: hard cutover unless explicit blocker documented
          * Cross-references: ADR-0001 (ADR conventions), ADR-0007 if t6
            spawns a TS port naming decision

        Index updated: docs/adr/README.md gains ADR-0006 row marked
        accepted at end of this task.

        ISP routing:
          mode: direct (decision; produces an ADR; small cross-reference edit)
          verifier: manual (decision-quality review on the ADR)
          review: decision-quality — does ADR list options, recommendation, consequences, alternatives? Are tradeoffs explicit?
          anti-scope: do NOT modify .goreleaser.yaml or any code in this task. ADR is decision-only. t2 owns implementation.
          bundle-context (if fanout): the existing WIP diff (.goreleaser.yaml, .github/workflows/auto-release.yml, .agentsrc.json), ADR-0001 (format), the rename-analysis prose from this session
          output contract: docs/adr/0006-*.md with populated Context/Decision/Consequences; index updated
      app_type: research
    - id: t2-ship-shim-or-cutover-binary
      title: Ship the binary rename per ADR-0006 (shim or cutover)
      status: completed
      depends_on:
        - t1-decide-shim-or-cutover
      blocks:
        - t6-ts-port-binary-decision
      owner: dot-agents
      write_scope:
        - .goreleaser.yaml
        - .github/workflows/auto-release.yml
        - .github/workflows/test.yml
        - Makefile
        - .agentsrc.json
      verification_required: true
      notes: |-
        Tier: T2 (compound — build config + CI workflow + smoke test).

        Hard-cutover path is the planned default.

        If ADR-0006 chose compat shim despite current user intent:
          * Add a second `builds:` entry in .goreleaser.yaml producing
            `dot-agents` (legacy name) from the SAME `main: ./cmd/dot-agents`.
          * Modify cmd/dot-agents/main.go (or commands/root.go) to detect
            os.Args[0] basename; if "dot-agents", print a one-line stderr
            deprecation notice naming the deprecation window before
            dispatching to the cobra root.
          * The brew formula in .goreleaser.yaml installs both binaries.
          * .github/workflows/auto-release.yml smoke step uses ./bin/da
            for primary verification + ./bin/dot-agents to confirm
            shim still works.

        If ADR-0006 chose hard cutover:
          * Single rename across .goreleaser.yaml + CI workflows + Makefile.
          * Release notes block in the goreleaser config calling out the
            breaking change.
          * No legacy `dot-agents` binary is built, installed, or smoke-tested.

        Resolve the inconsistency the user-WIP currently has in
        .goreleaser.yaml: line 85 still says `bin.install "dot-agents"`
        but the test below uses `da`. For the intended cutover path,
        rename the install line and any downstream smoke/install assumptions.

        Hard test:
          * Build locally: `go build -o ./bin/da ./cmd/dot-agents`.
          * `./bin/da --version` works.
          * .agentsrc.json change validates with the existing schema
            (no new keys; rename only).
          * `tests/test-claude-configs.sh` passes (against `da`).

        Common false positive:
          Build configs renamed but the cobra root still prints
          `dot-agents` in --help text because cobra hardcodes the name
          somewhere. Verify by running `./bin/da --help` and checking
          that "Usage:" line says "da" (cobra usually picks up
          os.Args[0] correctly, but worth confirming with eyeballs).

        ISP routing:
          mode: direct (small focused changes to build/CI files; needs careful local validation)
          verifier: smoke (build + run; smoke test passes; --help text correct)
          review: code review (goreleaser config valid; CI workflow syntactically correct; deprecation message clear)
          anti-scope: do NOT touch any of the doc-sweep targets in this task. Build/release only.
          bundle-context (if fanout): user WIP diff, ADR-0006 (decision), goreleaser docs, current commands/root.go
          output contract: passing CI on this branch with `da` as primary binary; if the decision is revised to shim, ADR-0006 must explain why
      app_type: build-config
    - id: t3-sweep-priority-docs
      title: Sweep README, docs/, ADRs, architecture note
      status: completed
      depends_on:
        - t1-decide-shim-or-cutover
      blocks: []
      owner: dot-agents
      write_scope:
        - README.md
        - docs/
        - .agents/proposals/agent-context-resolution-architecture.md
      verification_required: true
      notes: |-
        Tier: T1 (molecule — scoped text substitution per file).

        Files in scope (~30):
          * README.md (top-level) — first user contact; high-priority
          * docs/*.md (~26 files) — PLATFORM_DIRS_DOCS, RESOURCE_COMMAND_CONTRACT,
            TYPESCRIPT_PORT_BOUNDARY, etc.
          * docs/adr/0001-adopt-architecture-decision-records.md and any
            ADRs created by today's plans (0002, 0003, 0004, 0005)
            once they land
          * .agents/proposals/agent-context-resolution-architecture.md §4
            mapping table + §6.5 audit findings text

        Substitution rule:
          * `dot-agents <command>` → `da <command>` in code blocks, prose,
            and table cells
          * Keep the project-name "dot-agents" (in headings, repo refs,
            "the dot-agents project") unchanged
          * Keep `github.com/NikashPrakash/dot-agents`, `cmd/dot-agents/`,
            `~/.agents/`, `.agents/` unchanged

        For shim path (per t1): add a one-line note near the top of
        README.md and docs/CONTRIBUTING.md that legacy `dot-agents`
        invocations still work but print a deprecation notice.

        Hard test:
          `grep -rE "dot-agents [a-z]" README.md docs/ .agents/proposals/agent-context-resolution-architecture.md`
          returns only intentional compat-shim references.

        Common false positive:
          Sweep touches code blocks but misses prose mentions ("run
          dot-agents kg ..." in a sentence). Run grep with --include='*.md'
          and visually scan results.

        ISP routing:
          mode: fanout-amenable (per-file or per-doc-area substitution; clean isolation; can split docs/ into batches if needed)
          verifier: smoke (final grep returns clean) + manual (random spot-check 3 docs to confirm prose is updated, not just code blocks)
          review: doc review (substitution complete; project-name preserved; shim references explicit if applicable)
          anti-scope: do NOT touch .agents/history/ — that's the historical record. Do NOT change any code in commands/, internal/, ports/typescript/.
          bundle-context (if fanout): ADR-0006 (decision), the substitution rule above, list of project-name-vs-binary-name distinguishing patterns
          output contract: clean grep for dot-agents-as-command outside history dir; commit per area is fine but document the substitution rule in the commit message
      app_type: docs
    - id: t4-sweep-plans-specs-research
      title: Sweep .agents/workflow/{plans,specs}/ + research/ for binary-name references
      status: completed
      depends_on:
        - t1-decide-shim-or-cutover
      blocks: []
      owner: dot-agents
      write_scope:
        - .agents/workflow/plans/
        - .agents/workflow/specs/
        - research/
      verification_required: true
      notes: |-
        Tier: T1 (molecule — text substitution; same rule as t3).

        Files in scope (~63):
          * .agents/workflow/plans/{self-review-iteration-close-wiring,
            typescript-port, others}/{PLAN.yaml, TASKS.yaml, *.plan.md}
          * .agents/workflow/specs/* design documents
          * research/ (13 files reference dot-agents as command examples)

        Same substitution rule as t3. Plan task notes reference
        `da workflow ...` heavily; these need updating so future
        ISP runs read accurate guidance.

        Hard test:
          `grep -rE "dot-agents [a-z]" .agents/workflow/ research/` returns
          only entries inside `.agents/workflow/plans/<archived>/` (none
          today since archived plans live in `.agents/history/`).

        Common false positive:
          `evidence_confidence`, `app_type`, and other YAML structured
          fields don't carry binary-name strings, so substitution should
          be safe. But review prose blocks (notes:, summary:, etc.) and
          markdown bodies carefully.

        ISP routing:
          mode: fanout-amenable (per-plan or per-research-area; safe to parallelize since write scopes don't overlap)
          verifier: smoke (final grep clean)
          review: doc review (sweep complete; YAML still parses)
          anti-scope: do NOT touch .agents/history/. Do NOT change schema_version or any non-prose fields. Do NOT modify open-decision content (just the binary references in prose).
          bundle-context (if fanout): ADR-0006, t3 substitution rule, list of files
          output contract: clean grep + valid YAML (no syntax breakage)
      app_type: docs
    - id: t5-sweep-skills-rules-claude-md
      title: Sweep ~/.agents/{skills,rules}/ + ~/.claude/CLAUDE.md for binary-name references
      status: completed
      depends_on:
        - t1-decide-shim-or-cutover
      blocks: []
      owner: dot-agents
      write_scope:
        - ~/.agents/skills/
        - ~/.agents/rules/
        - ~/.claude/CLAUDE.md
      verification_required: true
      notes: |-
        Tier: T1 (molecule — text substitution + skills promote/refresh).

        Files in scope (~31):
          * ~/.agents/skills/ — 25 files referencing dot-agents commands
            in instructions/*.md
          * ~/.agents/rules/ — 6 files (mostly the dot-agents/ namespace)
          * ~/.claude/CLAUDE.md — 7 occurrences; was already touched
            today during the task-management rewrite

        Same substitution rule as t3.

        After editing, run `dot-agents skills promote` (legacy invocation
        if shim is live; otherwise `da skills promote`) for each modified
        skill to re-distribute, then `da refresh` to update project
        symlinks.

        Hard test:
          * `grep -rE "dot-agents [a-z]" ~/.agents/skills ~/.agents/rules`
            returns only intentional compat-shim references.
          * A fresh `/orchestrator-session-start` session output uses
            `da` consistently in agent-emitted text.

        Common false positive:
          Skill instruction files updated but `~/.agents/skills/dot-agents/`
          (the namespace dir) NOT renamed (correct — namespace is part of
          the dot-agents project name; binary rename does not change it).

        ISP routing:
          mode: direct (involves shell commands beyond text edits — skills promote, refresh)
          verifier: smoke (final grep + `da skills list` shows all expected skills + a session test)
          review: doc + behavior review (sweep complete; skills still load correctly; agent emits `da` not `dot-agents`)
          anti-scope: do NOT rename `~/.agents/skills/dot-agents/` or `~/.agents/rules/dot-agents/` directories — those use the project name, not the binary name.
          bundle-context (if fanout): ADR-0006, t3 substitution rule, list of skill instruction files
          output contract: clean grep + skills functional + a sanity-check session output captured in merge-back
      app_type: skill
    - id: t6-ts-port-binary-decision
      title: Decide TS port binary naming (dot-agents-ts vs da-ts); produce ADR-0007 if non-trivial
      status: completed
      depends_on:
        - t1-decide-shim-or-cutover
        - t2-ship-shim-or-cutover-binary
      blocks: []
      owner: dot-agents
      write_scope:
        - docs/adr/0007-ts-port-binary-naming.md
        - docs/adr/README.md
        - ports/typescript/package.json
        - ports/typescript/README.md
        - docs/TYPESCRIPT_PORT_BOUNDARY.md
      verification_required: true
      notes: |-
        Tier: T2 (compound — decision + implementation + cross-doc updates).

        Decision: rename the TS port binary `dot-agents-ts` to `da-ts`
        for convention parity, OR keep `dot-agents-ts` for project-name
        consistency.

        My recommendation when t6 lands: `da-ts` matches the convention
        established by ADR-0006. Both `da` and `da-ts` then read as
        UV-style abbreviations.

        Concrete deliverable:
          * docs/adr/0007-ts-port-binary-naming.md — Context (TS port
            convention question), Decision (chosen name), Consequences
            (npm package.json `bin` field; PATH; user-facing help text)
          * If decision is `da-ts`:
              ports/typescript/package.json — `bin` field renamed
              ports/typescript/README.md — invocation examples updated
              docs/TYPESCRIPT_PORT_BOUNDARY.md — small note about
                binary-name parity

        Hard test:
          `cd ports/typescript && npm run build && node dist/cli.js --help`
          renders the chosen binary name in help text. `npm link` then
          `<chosen-name> --help` works on PATH.

        Common false positive:
          npm package.json `bin` field updated but README still shows
          `dot-agents-ts` examples, OR vice versa.

        ISP routing:
          mode: direct (decision + small implementation)
          verifier: smoke (TS port builds + binary works under chosen name)
          review: code + doc review
          anti-scope: do NOT redo the Phase 4 boundary decision. ADR-0007 is naming-only; the boundary stays as-is.
          bundle-context (if fanout): ADR-0006 (decision logic), docs/TYPESCRIPT_PORT_BOUNDARY.md, current package.json bin field
          output contract: ADR-0007 + (if rename chosen) updated package.json + README; CI passes
      app_type: typescript
    - id: t7-drop-dot-agents-shim
      title: Drop dot-agents compat shim after deprecation window expires
      status: completed
      depends_on:
        - t2-ship-shim-or-cutover-binary
        - t3-sweep-priority-docs
        - t4-sweep-plans-specs-research
        - t5-sweep-skills-rules-claude-md
      blocks: []
      owner: dot-agents
      write_scope:
        - .goreleaser.yaml
        - .github/workflows/auto-release.yml
        - cmd/dot-agents/main.go
      verification_required: true
      notes: |-
        Tier: T1 (molecule — small reversal of t2's shim).

        GATED on calendar — only run this task when the deprecation
        window decided in ADR-0006 has expired (recommended: 6-12 months
        from t2's release). If hard-cutover was chosen in t1, this task
        is moot and gets closed as not-applicable at plan archive time.

        Deliverable when triggered:
          * Remove the `dot-agents` builds: block from .goreleaser.yaml.
          * Remove the deprecation-notice branch from cmd/dot-agents/main.go
            (or wherever it landed).
          * Update the brew formula to remove the legacy binary install.
          * Bump major version (semantic versioning: removing the
            shim is a breaking change).
          * Release notes call out the removal.

        This task is naturally a candidate for a `/schedule` background
        agent — fire 6 months after t2 lands, evaluate usage telemetry
        (if any) or simply confirm the calendar window has elapsed,
        then execute the diff.

        Hard test:
          After release: `dot-agents --version` returns "command not
          found" on a clean machine; `da --version` works.

        Common false positive:
          Removing the shim while users still depend on it. Mitigate by
          confirming the deprecation window has actually elapsed (read
          the date in ADR-0006), not just by ticking off the dependency
          chain (t2-t5 done).

        ISP routing:
          mode: direct (small surgical revert; needs care because it's a breaking change)
          verifier: smoke (build + clean install + confirm shim removed)
          review: code + release-notes review
          anti-scope: do NOT skip the calendar check. Even if t2-t5 are technically done, the deprecation window must be respected.
          bundle-context (if fanout): ADR-0006 (timeline), t2 commit (what to revert), release notes template
          output contract: shim removed; release notes published; major version bumped
      app_type: build-config
