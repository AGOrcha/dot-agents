# TTRPG campaign — three named queries beyond impact_radius.
#
# These are surfaced via:
#   da graph campaign query <name> --param <key>=<value>
#
# Each one demonstrates a different point on the v1 named-query surface:
#   1. Simple traversal (the easy case)
#   2. Algorithm-hinted path query (the boundary case for v1)
#   3. Multi-hop with negation-via-OPTIONAL-MATCH (the v1 ceiling)
#
# Schema reference: ./schema.yaml
# Contract reference: .agents/proposals/graph-backend-adapter-contract.md §11.3

queries:

  # -----------------------------------------------------------------------
  # 1. characters_present_at
  #
  # The simple-traversal case. "Who was at this event?" is the most-asked
  # question between sessions when the GM is reconstructing what happened.
  # Pure neighborhood lookup — no algorithm hint needed.
  # -----------------------------------------------------------------------
  - name: characters_present_at
    description: |-
      Return all characters (PC and NPC) present at a given event.
      Result rows include alignment so the GM can group friend/foe
      client-side. (The v1 DSL has no ORDER BY clause — see plan §5
      for the deferred grammar-extensions question.)
    params:
      - { name: event_id, type: string, required: true }
    query: |-
      MATCH (c:character)-[:present_at]->(e:event)
      WHERE e.id = $event_id
      RETURN c.id, c.alignment, c.pc_or_npc, c.alive
    # No algorithm_hint — single-hop traversal hits the POS index on
    # present_at directly (declared in schema.yaml impact_radius hints).

  # -----------------------------------------------------------------------
  # 2a. shared_faction
  # 2b. allegiance_path_via_alliance
  #
  # Split into two queries to fit v1 DSL grammar (graph-backend-adapter-
  # contract §5.1 admits only forward-directed `*1..N` patterns; no zero-
  # hop, no reverse, no undirected). The TTRPG dogfood originally wanted
  # a single combined query with `member_of|allied_with*0..3`, but that
  # uses constructs the v1 DSL grammar does not include.
  #
  # The grammar-extension question (zero-hop, reverse, undirected) is
  # tracked in the plan document §5: defer until ≥3 distinct adapters
  # request these constructs as a workaround, OR the v1.5 trigger budget
  # reaches 5 points. Until then, query authors split.
  #
  # Caller invokes both and unions client-side. If 2a returns a row,
  # characters share a faction. If 2b returns rows, allegiance flows
  # through inter-faction alliance.
  #
  # Algorithm hint: bidirectional_bfs collapses k^d to 2·k^(d/2). For
  # 3 allied_with hops at fan-out 50, this is 2 * 50^1.5 ≈ 700 paths
  # instead of 50^3 = 125K paths.
  # -----------------------------------------------------------------------
  - name: shared_faction
    description: |-
      Characters A and B share a faction (zero-hop case of allegiance).
      Returns the shared faction id if both are members of the same
      faction; empty result otherwise.
    params:
      - { name: from_character_id, type: string, required: true }
      - { name: to_character_id,   type: string, required: true }
    query: |-
      MATCH (a:character)-[:member_of]->(f:faction)
      MATCH (b:character)-[:member_of]->(f)
      WHERE a.id = $from_character_id AND b.id = $to_character_id
      RETURN a.id, b.id, f.id

  - name: allegiance_path_via_alliance
    description: |-
      Returns any allegiance path from character A to character B
      routed through inter-faction `allied_with` edges (1..3 hops),
      with the endpoint factions and hop_count for each result row.
      Multiple paths may exist; the result set is not minimized. The
      GM picks the most relevant path client-side. The v1 DSL has no
      shortestPath operator — see plan §5 for the deferred grammar
      question. Use together with `shared_faction` for the complete
      allegiance picture (zero-hop case).
    params:
      - { name: from_character_id, type: string, required: true }
      - { name: to_character_id,   type: string, required: true }
    query: |-
      MATCH (a:character)-[:member_of]->(fa:faction)-[:allied_with*1..3]->(fb:faction)
      MATCH (b:character)-[:member_of]->(fb)
      WHERE a.id = $from_character_id AND b.id = $to_character_id
      RETURN a.id, b.id, fa.id, fb.id, hop_count
    algorithm_hint: bidirectional_bfs
    # The bidirectional_bfs hint controls execution-time fan-out (per
    # graph-backend-adapter-contract §6 it is performance-only, not
    # correctness-bearing). It does not minimize the result set.
    # Note: `allied_with` is logically symmetric (faction A allied with
    # faction B implies B allied with A), but the v1 DSL only admits
    # forward-directed patterns. The bootstrap skill should write
    # `allied_with` edges in both directions for symmetric alliances
    # so this forward-traversal query works correctly.

  # -----------------------------------------------------------------------
  # 3. continuity_check
  #
  # The v1 ceiling case. "Find characters whose stated_location contradicts
  # an event they were present_at" — i.e., consistency violations the GM
  # introduced inadvertently across sessions.
  #
  # Demonstrates ref-join semantics from §11.3.4 of the adapter contract:
  # - `c.stated_location.id` is a depth-1 ref-traversal — compiles to one
  #   LEFT JOIN against the location table.
  # - `e.occurred_at_session.session_number` is a depth-1 ref-traversal —
  #   compiles to one LEFT JOIN against the session_log table.
  # - Use-site analysis: each ref-chain prefix appears once, so no JOIN
  #   deduplication needed. If `c.stated_location.region` were also
  #   referenced, both uses would share the single JOIN.
  #
  # If DMs want variations the adapter author didn't anticipate (e.g.,
  # "characters whose alignment shifted across sessions but no event
  # explains the shift"), that's a wishlist entry — the v1 → v1.5 signal.
  # -----------------------------------------------------------------------
  - name: continuity_check
    description: |-
      Find characters whose stated_location is inconsistent with the
      location of an event they were present_at. Useful for spotting GM
      retcon needs before next session. When `since_session` is omitted,
      checks across all sessions (coalesce to 0).
    params:
      - { name: since_session, type: int, required: false }
    query: |-
      MATCH (c:character)-[:present_at]->(e:event)-[:occurred_in]->(actual:location)
      WHERE c.stated_location.id <> actual.id
        AND e.occurred_at_session.session_number >= coalesce($since_session, 0)
      RETURN c.id, c.stated_location.id, actual.id, e.id
    algorithm_hint: bfs
    # `coalesce` is in the §5.1 allowed function set; this is how
    # genuinely-optional WHERE filters are expressed in v1 (an explicit
    # OPTIONAL WHERE construct is deferred to v1.5+ per §14 Q4).
