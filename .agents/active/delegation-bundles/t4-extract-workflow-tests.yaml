context:
  branch: master   # work happens on a fresh branch off master
  worktree: TBD    # worker creates: git worktree add .claude/worktrees/t4 master then branches t4-extract-workflow-tests
  plan_id: go-test-fixture-extraction
  feature_thread: |
    Cluster D of the test-fixture-extraction plan: pull duplicated test
    setup helpers from commands/workflow/*_test.go into the shared
    internal/testutil package created in earlier task t2. This is the
    only eligible task on the active plan (per `da workflow eligible
