observation: REDESIGNED 2026-07-13 (user steer + research). Do NOT force fail-closed CrossFamily on specialized profiles — CrossFamily==nil stays ALLOWED. Instead a positive contract — (1) any profile without a distinct-family cross gate MUST still carry an adversarial/red-team review TYPE with the same adversarial checklist and guidance so the attack posture is preserved; (2) the BLOCKING cross-family gate is REQUIRED whenever the model registry offers a genuinely distinct opposite family available to THIS user/setup, so requiredness is registry/capability-conditional not absolute (different users have different model options); (3) when no opposite family is available, EMULATE cross-family via a fresh-context adversarial pass (separate session, blind to the build) applying the OPPOSITE family known failure-mode as the enumerated audit hunt-list — GPT-family tends to hallucinate confident-wrong, Claude-family tends to refuse/give-up (research context-rot PART 7). This preserves adversarial value and minimizes the completeness drawback for BOTH pareto and non-pareto profiles when cross-family is impossible. Harness-enforced, not prompt-advisory, and fresh-context-adversarial-over-self-critique is the load-bearing mechanism (research long-horizon-prompting). Anchor research/articles-evaluation-context-engineering-and-foldback-design.md R1. Supersedes the earlier fail-open-only observation.
