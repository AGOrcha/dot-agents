observation: 'Re-anchored from full-loop-orchestration-runtime (owner redirect 2026-07-15) — the cross-operator control plane belongs with kg-as-sot (graph-backend-adapter-contract) plus the workstore backend plus THIS daemon/bg-service (da service run) growing an AUTH PROXY, which could grow into a full SESSION PROXY. Architecture reference — larsencc (Browser Use) ''Secure Scalable Agent Infra'' (research/articles/larsencc-secure-scalable-agent-infra-bedrock-agentcore.md, practitioner, shipped at scale) — the control plane as a credential proxy: the agent sandbox holds NO secret, posts a per-session TOKEN, the control plane swaps it for the real upstream key, meters, and forwards, so the worker never sees a real credential. Three mappings — (1) auth-proxy = the service form of t7-oci-auth''s H12 secret-non-disclosure (secret refs only; resolved secret lives only in a request header) — the daemon holds registry/LLM/source credentials and hands workers session-scoped tokens; (2) ''control plane is the cold-recovery SOT, durable mount is a warm cache'' = the kg-as-sot thesis verbatim (KG/warm store = SOT, hot filesystem = cache) plus the session-handoff-journal cold-recovery model plus the workstore session lifecycle; (3) one credential-holding proxy brokering many isolated per-session tokens is the substrate on which cross-operator shared context plus scoped permissions (Variant H8b) become tractable — the multiplayer control plane. Trigger — da service auth-proxy work begins, OR a second human operator adopts shared da home-config in practice, OR session-handoff-journal impl starts and a second seat wants shared context. Additive, gate-neutral, no wave decision reopened. Sources research/articles/larsencc-secure-scalable-agent-infra-bedrock-agentcore.md plus research/articles/alanadlevin-investing-in-autonomy-ten-hypotheses.md H8b; eval Part O.'
