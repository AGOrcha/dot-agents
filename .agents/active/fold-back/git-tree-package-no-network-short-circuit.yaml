observation: t5 dogfood — every da install/refresh re-clones each git-tree package ref from upstream even when the CAS is warm and the content digest verifies (~2s per re-run against the live remote). The no-write guarantee holds at the lock/CAS/projection layer but not the network layer. A warm-CAS + matching-lock-digest ref should skip the network fetch entirely (resolve from CAS). Feeds t9-perf — profile and add a CAS-warm fetch short-circuit for git-tree (and OCI) refs.
