observation: 'OPEN — production native-alternative inventory from the #557 graphstore Git cutover. internal/graphstore is now Git-process-free (go-git index reads for submodule/gitlink enumeration, go-git merge-base tree diff for changed files) and is cutover-locked by tools/execguard. The remaining production process boundaries with an obvious in-process alternative are recorded as KindDebt in tools/execguard/ledger.go and pointed at this note; they are deliberately NOT migrated in #557. Clusters, with the native replacement: (1) home/source/sync git in commands/internal/lifecycle/{init_from,install,status}.go and commands/sync/*.go plus commands/kg/sync_code_warm_link.go -> git.PlainClone / PlainInit, Worktree.{Pull,AddWithOptions,Commit,Remove,Status}, Repository.{Head,Log,Push,Remotes}; credential-helper, SSH-agent, merge-based pull, hook/filter/signing and LFS parity is the real work here, which is why it is not opportunistic. (2) workflow git in commands/workflow/{delegation,iter_log,plan_task,state}.go -> Worktree.Status with explicit staged-vs-unstaged classification, ResolveRevision for HEAD~1, resolved-ref->CommitObject->Tree->File for show ref:path, and PlainOpenWithOptions(DetectDotGit) for worktree detection; the generic gitStateExec and gitOutput wrappers must be decomposed per operation rather than re-wrapped. (3) scoring git in internal/scoring/{signal_backfill,signal_git}.go -> CommitObject(hash).Committer.When, Repository.Log, commit-parent/merge-base traversal; signal_git.runGit is a generic wrapper and needs the same decomposition. (4) commands/workflow/journal.go ghJSON shells out to the gh CLI -> GitHub REST, gated on reproducing gh''s host/token/enterprise-endpoint resolution. Non-git process boundaries recorded as permanent KindBoundary and NOT in scope: OCI credential-helper ABI, eval task/verifier execution, event exec sources, macOS security keychain and defaults, Windows PowerShell fsops fallback, target-CLI probes, the da self-re-exec, and the code-review-graph Python bridge (which retires with this task, not by a Go rewrite). Consumer artifacts: tools/execguard/ledger.go, tools/execguard/main.go, internal/graphstore/gitnative.go.'
