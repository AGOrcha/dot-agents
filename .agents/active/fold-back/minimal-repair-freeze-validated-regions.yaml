observation: Minimal-repair re-entry — the Atomic Task Graph paper (arXiv 2607.01942, research Part L.3) repairs only the affected subgraph on failure and leaves validated regions frozen. Our bounded fold-back/ISP re-entry re-runs a whole stage; on a single-slice fold-back it should skip re-verifying already-passing disjoint slices (composes with the L.1 Cognition finding that lead over-verification does not increase correctness). Forward-looking refinement for the runtime bounded re-entry path — no live task owns it (routing and re-entry tasks are completed). Consumer — full-loop-orchestration-runtime re-entry design. Evidence — research/articles/intuitmachine-atomic-task-graph.md and eval Part L.3.
