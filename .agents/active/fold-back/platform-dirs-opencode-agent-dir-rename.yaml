observation: 'OpenCode renamed its agent directory from singular .opencode/agent/ (project) and ~/.config/opencode/agent/ (user) to the plural .opencode/agents/ / ~/.config/opencode/agents/ (vendor source sst/opencode packages/web/src/content/docs/agents.mdx, re-verified 2026-07-04; ref docs/PLATFORM_DIRS_DOCS.md @ 0.5.0). dot-agents still emits, links, and audits the singular dir, so OpenCode agent links land in a directory OpenCode no longer reads. Production sites: internal/platform/opencode.go L254 (BuildSharedAgentFileSymlinkIntents, the actual project-scope agent-file symlink emit), L142 (ensureUserAgents user-scope), L161 (RemoveLinks), L217 and L219 (PrintAudit plus printSymlinkDirAudit literals), L274 (CountLinks), L291 (opencodeUserConfigDirs user broken-link scan); internal/platform/resource_plan.go L274 (isAllowlistedSharedMirrorTarget .opencode/agent/ prefix gate, which blocks the new plural emit unless updated); commands/internal/lifecycle/resource_map.go L46 (RelOpenCodeAgentsDir const) and L201 (path-to-canonical mapping); commands/add.go L82 (aiScanDirPatterns) and L403 (explain items); commands/import.go L163 and L222 (import candidate); commands/remove.go L126 and commands/explain.go L189 (display strings). WARNING opencodeAgentsDir equals .agents is the shared skills root, NOT the agent dir, leave it. Uncertain so proposing rather than task-noting: decide whether to dual-emit both agent/ and agents/ for older OpenCode installs, and note the code links user scope at ~/.opencode/agent/ while the vendor doc now lists ~/.config/opencode/agents/, a second divergence to resolve together.'
