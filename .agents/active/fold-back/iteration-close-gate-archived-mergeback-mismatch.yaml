observation: 'iteration-close-gate R1.1 checks sentinel.expected_artifacts by active path existence only and reads the latest active iteration-close sentinel, not canonical task state or delegation-closeout history. Reproduced on t1-kg-brief-molecule: the worker closeout sentinel expected .agents/active/iteration-log/iter-67.yaml and .agents/active/merge-back/t1-kg-brief-molecule.md; after parent workflow delegation closeout --decision accept archived the merge-back under .agents/history/kg-ideate-skill/delegate-merge-back-archive/2026-07-07/t1-kg-brief-molecule/ and removed the active merge-back file, the still-active iteration-close sentinel continued to require the old active path. Result: recursive stop/pretool deadlock despite canonical task completion, because stop/subagent_stop only sees the missing active artifact and does not recognize that lifecycle ownership has moved from worker closeout to parent archive/cleanup. Current recovery is split by lifecycle stage: if the worker genuinely died mid-closeout, inspect the active iteration-close sentinel and recreate the missing expected artifacts long enough to finish verify/checkpoint/merge-back; if the task has already moved forward and the artifact was archived/removed by parent closeout, clear the stale sentinel explicitly with da workflow hook-sentinel clear iteration-close --run-id <run_id>. Important current-state fact: workflow delegation closeout does not auto-clear the matching iteration-close sentinel and does not update or supersede it for the next lifecycle stage, so without an explicit clear the stale sentinel remains authoritative and will keep re-firing. Design conclusion: this should be modeled as automatic lifecycle handoff, not more expectations in iteration-close. iteration-close should govern the worker active-closeout contract only; delegation-lifecycle parent_closeout should govern archive/cleanup expectations. On successful workflow delegation closeout, the matching iteration-close sentinel should be auto-cleared, or parent_closeout startup should fail/repair when a stale iteration-close sentinel still governs the same task. Optional follow-up: use workflow journal / trace-backed evidence to make the handoff auditable, but the core fix is one governing sentinel per lifecycle stage instead of overlapping active sentinels.'
