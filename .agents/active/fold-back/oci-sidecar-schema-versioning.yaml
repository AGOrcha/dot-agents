observation: t6 round-3 cross-harness (Codex, demoted to LOW forward-hardening) — the oci-type.json sidecar attests OCI-type provenance but not that the fresh pull which produced it passed the mandatory verifyOCILayerDescriptorDigest check. Not exploitable today (ociPull is stubbed — no real OCI cache entries exist), but once the live OCI wire protocol lands, a cache dir populated by a pre-round-3 binary could be trusted. Before wiring ociPull — add a schema/version field to ociTypeSidecar (e.g. IntegrityVerified bool or a version int) written only by pulls that passed the mandatory digest check, and require it in readCachedOCIArtifact/readCachedOCILayer. Also two LOW test-rigor nits — TestOCILayerFetcherCacheHitWithoutSidecarIsNotTrusted should assert ReasonTransport (not just err != nil); TestOCILayerFetcherFreshPullSeedsOCISidecar should assert got.Data/ResolvedSHA equality. Tie to the same ociPull-wiring milestone as oci-pin-manifest-digest-deadcode.
