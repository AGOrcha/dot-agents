observation: t1b closed the achievable fetch-time bounds (blob:limit partial-clone filter for filter-capable servers + pre-decode tree/blob size gate). Documented residual — go-git v6 resolves the received packfile in memory (delta reconstruction + non-blob object decode) BEFORE the quota storer sees a write, and exposes no hook to bound that. So a malicious all-delta-chain pack over non-blob objects, or a filter-incapable server, can still OOM. Availability-only from UNTRUSTED git sources (da-agc is trusted). Follow-up — a transport-byte cap or a shell-git partial-clone fallback for untrusted git sources. Trigger — before advertising untrusted-remote git package sources.
