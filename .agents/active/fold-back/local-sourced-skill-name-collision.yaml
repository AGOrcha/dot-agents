observation: t5 dogfood — a real da install of dot-agents onto da-agc fails closed with a conflicting-intents error because this machine has a locally-authored ~/.agents/skills/dot-agents/release-docs-refresh/ while da-agc also provides a release-docs-refresh skill. Local-scope discovery is a directory scan in internal/platform/resource_plan.go, independent of .agentsrc.json's skills[] array, so a sourced package colliding with a same-named local resource has no defined precedence — it just errors. Needs a resolution rule (sourced vs local precedence, or an explicit shadow/override) so a package can supersede or coexist with a same-named local resource. Blocks the dogfood on any machine with the local skill.
classification: proposal
