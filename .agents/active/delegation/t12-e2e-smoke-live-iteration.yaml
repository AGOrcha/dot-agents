success_criteria: |-
    Two complementary tests:

    (a) Go integration test
    (tests/e2e/dashboard_live_iteration_test.go):
      1. spin up cmd/da-dashboard against a fresh tmpdir iter-log
         fixture (3 iters);
      2. open an SSE client to /api/v1/observability/events;
      3. write a new iter-4.yaml + run scoring.ScoreIteration +
         write the sidecar;
      4. assert an iteration.scored frame arrives within 2s.

    (b) Playwright UI smoke (web/dashboard/e2e/):
      1. start the standalone service in test mode against the
         same fixture,
      2. navigate to /, assert RunsGrid renders,
      3. drill into /runs/:sid, assert iteration count,
      4. write a new iter-4 sidecar from the test harness,
      5. assert the grid count increments without reload.

    Both tests skip-guarded behind an `e2e` build tag.
