        covering MkdirAll → WriteFile → Remove → RemoveAll.
      - `mkdirAllComponents` boundary cases (the Windows variant
        walks path components individually).
      - `systemExe` returns the right Windows exe-prefix.
      - Negative paths using `testutil.MakeDirUnreadable` from
        perms-dir (PR #72 — provides the Windows DACL fixture for
        "cannot stat / cannot list" assertions) to drive the
        error branches that fsops_windows.go's defensive guards
        need to hit.

    Depends on perms-dir because the negative paths need the
    DACL fixture. cg6-prune can prune the `internal/fsops/*`
    allowlist entries once this lands (currently
    `internal/fsops/fsops_windows.go [platform-tag] 0.00%` per
    the allowlist).

    Anti-scope: do NOT modify any *.go production file in
    internal/fsops/. Test-only addition.

    ISP routing:
      mode: direct (single new test file)
      verifier: smoke (go test ./internal/fsops on Windows CI)
      review: code review
      bundle-context (if fanout): catalogue findings.md +
                                   internal/testutil/perms_dir*.go
      output contract: internal/fsops Windows coverage > 0
