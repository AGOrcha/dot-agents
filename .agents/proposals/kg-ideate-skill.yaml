# Destined for the starter scaffold (planned starter skill — ships via `da init` to all
# projects). Until proposal-routing v2 lands, the artifact lives repo-local and is reviewed
# here; on promotion it lands at the starter source below and is registered as a global skill.
target:
  # Starter source (where the skill is authored in this repo):
  starter_source: internal/scaffold/home/starter/skills/global/kg-ideate/
  # Where it lands after `da init` (per-project link target for the active platform):
  installed_at: ~/.agents/skills/kg-ideate/
  # NOTE: repo-local for now, pending the scoped proposal-routing rework. Routing may move
  # this back to a starter-registration path once proposal-routing v2 lands.
rationale: |
  The workflow has a cold-start problem that spans the WHOLE artifact pipeline, not just
  spec authoring: ideas are turned into specs, plans, and staged-execution handoffs from
  scratch without querying accumulated KG knowledge (prior decisions, research findings,
  contradictions, lessons). This produces repeated rediscovery of the same design space,
  inconsistent terminology across specs and plans, decisions that ignore or contradict
  prior work, and fanout bundles whose write-scopes were guessed rather than grounded.

  kg-ideate is the KG-grounded FRONT-END to the entire artifact pipeline
  (idea/proposal → spec → plan → concurrent staged execution), for work that is planned
  solo by the orchestrator OR delegated to subagents. Phase 1 (KG/research/lessons
  briefing) stays as the grounding step. The downstream now spans spec authoring AND plan
  drafting AND the handoff into the concurrent staged-execution flow (fanout / ISP).

  The phase ordering is deliberate. Scaffolding without a briefing produces generic
  templates the author ignores. A briefing without scaffolding produces context that sits
  unread. Sequencing them — automated grounding, then guided creation across spec/plan,
  then a clean handoff to staged execution — ensures the KG actually shapes the output and
  the work that follows it.

  Designed to extend cleanly to the citation graph backend now defined in
  `.agents/workflow/specs/graph-backend-adapter-contract/design.md` §13.4
  (built-in adapter `dotagents-builtin:graph/citation@^1.0`). Once citation adapter notes
  are populated, the Phase 1 contradiction-traversal step becomes structural not just
  semantic, using the adapter's named queries (`claims_citing_source`,
  `claims_supported_by_source`, `contradicting_claims`). Critically, the broader skill is
  useful WITHOUT that adapter — semantic KG search, the research corpus, and lessons still
  ground the briefing; only the structural-contradiction step is adapter-gated and degrades
  gracefully (see the deferral note).
