# One task, one da workflow slot. The outer omp-full-loop driver selects work.
swarm:
  name: da-per-task-profile-pipeline
  workspace: /Users/nikashp/proj-docs/dot-agents
  mode: pipeline
  target_count: 3
  model: claude-opus-4-8
  agents:
    profile_resolve:
      role: resolve task profile and explicit OMP model routes
      model: claude-opus-4-8
      task: |
        Read $BUNDLE, $TASK, and the repository full-loop runtime instructions. Use the
        repository-HEAD da binary. Resolve topology and lenses with `da config relevance
        --task "$TASK" --filter topology --json` and `--filter lenses --json`. For every
        verifier/lens slug call `da --json workflow resolve-prompt --kind <kind> --slug
        <slug>`. Refuse a matched stage with empty model or model_family. Partition the
        compatibility slug cross-harness-adversarial into cross_family_lens; all other
        lenses remain routine_lenses in declared order. Require cross_family_lens.family
        to differ from executor/default.family. Write $COORD/profile.json containing the
        task, bundle, app_type, executor route, verifier routes (max 7), routine lens routes
        (max 4), optional cross-family route, lens_concurrency, and prior fold-back feedback.
        If cardinality exceeds those maxima or dependency/base state changed, write
        $COORD/BLOCKED.md and stop. A prior $COORD/READY.md makes later iterations no-op.

    executor:
      role: task implementation executor
      model: claude-opus-4-8
      waits_for: [profile_resolve]
      task: |
        Read $BUNDLE, $COORD/profile.json, and prior $COORD/GATE.md. Skip on BLOCKED or
        READY. Confirm executor model=claude-opus-4-8 and family=claude. Work only in the
        delegated worktree and write_scope. Address every prior fold-back point first.
        Implement, run focused tests through the production path, and commit without AI
        attribution trailers. Emit $COORD/impl.md with DONE|FAIL|SKIP, commit, files,
        focused evidence, and feedback addressed. Never mutate PLAN/TASKS or delegation state.

    verify_1: &verify_slot
      role: verifier slot 1
      model: claude-opus-4-8
      waits_for: [executor]
      task: |
        Read $COORD/profile.json and impl.md. Run verifier_routes[0] if present, using its
        resolved prompt composition; require its route to equal this agent's explicit model
        and family=claude. Emit $COORD/verify-1.md PASS|FAIL|SKIP with command and evidence.
        Never mutate canonical workflow state.
    verify_2:
      <<: *verify_slot
      role: verifier slot 2
      waits_for: [verify_1]
      task: "Run verifier_routes[1] under the same contract; gate on verify-1 PASS; emit $COORD/verify-2.md."
    verify_3:
      <<: *verify_slot
      role: verifier slot 3
      waits_for: [verify_2]
      task: "Run verifier_routes[2] under the same contract; gate on prior PASS; emit $COORD/verify-3.md."
    verify_4:
      <<: *verify_slot
      role: verifier slot 4
      waits_for: [verify_3]
      task: "Run verifier_routes[3] under the same contract; gate on prior PASS; emit $COORD/verify-4.md."
    verify_5:
      <<: *verify_slot
      role: verifier slot 5
      waits_for: [verify_4]
      task: "Run verifier_routes[4] under the same contract; gate on prior PASS; emit $COORD/verify-5.md."
    verify_6:
      <<: *verify_slot
      role: verifier slot 6
      waits_for: [verify_5]
      task: "Run verifier_routes[5] under the same contract; gate on prior PASS; emit $COORD/verify-6.md."
    verify_7:
      <<: *verify_slot
      role: verifier slot 7
      waits_for: [verify_6]
      task: "Run verifier_routes[6] under the same contract; gate on prior PASS; emit $COORD/verify-7.md."

    review_routine_1: &routine_review
      role: routine review lens slot 1
      model: claude-opus-4-8
      waits_for: [verify_7]
      task: |
        Read profile.json, implementation, and verifier evidence. Run routine_lenses[0] if
        present and all verifiers passed. Require its route to equal this agent's explicit
        model and family=claude. Review read-only and emit $COORD/review-routine-1.md
        APPROVE|REJECT|SKIP with cited findings. Never mutate canonical workflow state.
    review_routine_2:
      <<: *routine_review
      role: routine review lens slot 2
      waits_for: [review_routine_1]
      task: "Run routine_lenses[1]; honor lens_concurrency and prior rejection; emit $COORD/review-routine-2.md."
    review_routine_3:
      <<: *routine_review
      role: routine review lens slot 3
      waits_for: [review_routine_2]
      task: "Run routine_lenses[2]; honor lens_concurrency and prior rejection; emit $COORD/review-routine-3.md."
    review_routine_4:
      <<: *routine_review
      role: routine review lens slot 4
      waits_for: [review_routine_3]
      task: "Run routine_lenses[3]; honor lens_concurrency and prior rejection; emit $COORD/review-routine-4.md."

    review_cross_family:
      role: blocking cross-model-family adversarial reviewer through OMP
      model: gpt-5.4
      waits_for: [review_routine_4]
      task: |
        Read profile.json and all evidence. If no cross_family_lens is configured, emit SKIP.
        Otherwise require slug=cross-harness-adversarial, model=gpt-5.4, family=gpt, and
        family different from executor/default. Run its resolved prompt read-only through OMP.
        Mutation-check tests and inspect production-path wiring. Emit
        $COORD/review-cross-family.md APPROVE|REJECT|SKIP with cited findings. Any
        BLOCKER/HIGH rejects. Do not invoke the Codex CLI or apply Codex sandbox/permission flags.

    gate:
      role: task evidence and refinement artifact gate
      model: claude-opus-4-8
      waits_for: [review_cross_family]
      task: |
        Read profile.json plus all implementation, verifier, and review signals. On complete
        evidence and approval, push/open the owner-held PR, poll the app_type delivery gate,
        author a schema-valid merge-back draft, and write $COORD/READY.md. Otherwise write
        $COORD/GATE.md with FOLD-BACK and every actionable blocker for the next bounded
        iteration. Write $COORD/refinement.json with idempotent stable slugs for task_notes,
        plan_summary observations, and cross-cutting proposal candidates. Never merge, advance,
        close out a delegation, or mutate canonical plan/task state. Commit only coordination
        artifacts through the configured CAS state channel.
