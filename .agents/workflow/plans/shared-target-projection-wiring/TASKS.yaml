        `platform.RunSharedTargetProjection(...)`. No change required.
    - id: stp-import-relink
      title: Wire projection into import.go relinkImportedProjects (the real gap)
      status: completed
      depends_on: []
      blocks:
        - stp3-regression-parity
      owner: dot-agents
      write_scope:
        - commands/import.go
      verification_required: true
      notes: |-
        THE genuine remaining gap (spec Q1 4th entry). `relinkImportedProjects`
        (commands/import.go:1425, called from import.go:322) loops platforms
        calling `p.CreateLinks(project, path)` (:1435) WITHOUT first running
        `RunSharedTargetProjection` — so a user-config import does NOT
        materialize repo `.codex/agents/*.toml` or the Claude shared-skills
        projection for relinked projects. Add the projection call before the
        per-project CreateLinks loop, matching refresh/install/add ordering
        and enabled-platform scoping. Existing Deps/contract shape only — do
        not pre-empt di-refactor / graphstore-contract. Interface seam for
        coverage, no allowlist entry.
    - id: stp-doctor-repair
      title: Doctor repair fixes broken projection + links ALL managed da entities
      status: completed
      depends_on:
        - stp-import-relink
      blocks:
        - stp3-regression-parity
      owner: dot-agents
      write_scope:
        - commands/doctor.go
      verification_required: true
      notes: |-
        DECISION (user 2026-05-18): doctor repair must NOT stay
        symlink-only. It must (a) run RunSharedTargetProjection to fix
        broken/missing projected shared-target artifacts, AND (b) ensure
        ALL managed da entities are linked for the project (full
        CreateLinks across installed platforms — not merely re-repairing
        already-detected broken symlinks). Today `commands/doctor.go:191`
        only re-runs CreateLinks for links it already found broken and
        never runs the projection, so a missing/broken shared-skill or
        codex-toml is not repaired. Mirror the established
        refresh/install/add/import projection-call shape; keep idempotent
        (a healthy managed project → no spurious changes/output). Existing
        Deps/contract shape only — do not pre-empt di-refactor /
        graphstore-contract.
    - id: stp3-regression-parity
      title: 'Regression: import-relink + doctor + refresh-skill-mirror produce projection; dry-run/idempotent'
      status: pending
      depends_on:
        - stp-import-relink
        - stp-doctor-repair
        - refresh-skill-relink/fix-shared-skill-relink
      blocks: []
      owner: dot-agents
      write_scope:
        - commands/import_test.go
        - commands/doctor_test.go
        - commands/refresh_test.go
      verification_required: true
      notes: |-
        refresh/install/add already covered upstream — scope here is the
        NEWLY wired paths. Behavior-asserting tests: (a) import relink
        produces repo .codex/agents/*.toml + Claude shared-skills
        projection, (b) doctor repair (if wired per stp-doctor-repair
        decision), (c) dry-run no-mutation, (d) idempotent second run,
        (e) no regression to existing relink/repair behavior, (f) the
        refresh-skill-mirror routing landed by
        refresh-skill-relink/fix-shared-skill-relink — same dry-run +
        idempotence assertions; no per-platform CreateLinks regression.
        go test ./... green; per-file cov gate via interface seams,
        zero new allowlist entries.

        CROSS-PLAN: stp3 deliberately waits on
        refresh-skill-relink/fix-shared-skill-relink so the regression
        sweep can validate that routing alongside import-relink + doctor.
        Acyclic — refresh-skill-relink depends_on stp1-wire-refresh
        (completed) for its prereq; stp3 then closes the loop here.
