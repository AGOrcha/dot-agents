        Same rubric as falsification-review; CI-backed contrasts only; frontier claims without CI exclusion of dominance reversal are rejected.
        - (fb:review-gate-deterministic-pre-llm-tier) REDESIGNED 2026-07-13 (user affirms merit + research R3). Adopt a DETERMINISTIC PRE-LLM TIER on the review gate — config/deny-list/size/state/contract checks that are NON-JUDGMENT (known or pre-configurable), fail-closed, where the LLM lens may only TIGHTEN never loosen, so auto-rejectable or auto-passable work never spends review-lens tokens (faster and cheaper). EXTEND the same treatment to a PRE-VERIFIER deterministic gate — deterministic checks we can pre-config (build/format/lint/contract/schema) run before the LLM verifier stage. Harness-enforced not prompt-advisory (research long-horizon-prompting — constraints that must survive optimization pressure live in the harness). Candidate deterministic checks include context-engineering gates from research context-rot PART 10 (context-budget cap near 25-30 percent of advertised window, structure/middle-position exposure). Live-wave data (gate-induced re-work + verdict/block-rate per contrast) still MEASURES the savings and tunes the deny-list, and a proposal routes the concrete tier once the plan can implement. Anchor research/articles-evaluation-context-engineering-and-foldback-design.md R3. Supersedes the assess-whether framing with adopt-both-tiers, data-tuned.
      app_type: docs
