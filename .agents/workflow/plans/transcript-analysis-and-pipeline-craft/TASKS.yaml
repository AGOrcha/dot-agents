      blocks: []
      owner: dot-agents
      write_scope:
        - .agents/workflow/plans/transcript-analysis-and-pipeline-craft/evidence/pareto/
        - .agents/workflow/runtime/full-loop/
      verification_required: true
      notes: |-
        Candidates CORRECTED after registry probe (omp models): PRIMARY = claude-sonnet-5 (anthropic, 1M ctx) + gpt-5.6-terra (openai-codex, 372K ctx) per user's original ask - both ARE resolvable; earlier absence claim was a config.yml-role-alias artifact. SECONDARY cheap tier = claude-haiku-4-5 + gpt-5.6-sol (user-picked). Baseline claude-opus-4-8 executor. One stage swap per contrast, snapshot-identical paired runs, >=3 repeats, bounded --max-waves. RULE-7 self-collision RESOLVED (2026-07-12): the cross-family adversarial gate is a review-VALIDITY stage whose family is pinned OPPOSITE the executor family (registered cross-harness-adversarial-claude=claude-opus-4-8/claude for gpt-family executors), EXCLUDED from the measured cell; first-pass executor/verifier attribution, gate-induced re-work + verdict/block-rate reported per-contrast. Deterministic route map: evidence/pareto/live-contrast-lens-map.md. Executable now w/o flip: C1,C2,C5-claude-legs,C6-sol-gate-leg; C3/C4/C5-gpt-legs need the opposite-family flip; C6-haiku-4-5-gate-leg is ILLEGAL (haiku is claude-family, same as the claude C6 executor) — valid only as a cheapened routine verifier/lens slot, never the cross-family gate. PRE-EXECUTION DESIGN GATE CLEARED; live runs remain user-gated (cost).
        - (fb:evidence-rubric-token-field-trust) RESOLVED 2026-07-12 — graduated into evidence-rubric clause E6 (per-harness token-field-trust table, CC requestId last-entry-wins dedup, mandatory corpus-slice pinning). Ground truth strengthened by devforth mitmproxy capture (API charges once per requestId; research/articles/devforth-cc-usage-overestimates-output-tokens.md). No open decision — apply E6.
        - (fb:merge-back-deviations-section) RESOLVED 2026-07-12 — Deviations now mandatory in merge-back --integration-notes per the iteration-close skill instruction (.agents/skills/iteration-close/instructions/workflow.md, Merge-back section); explicit 'Deviations — none' when clean. Template-level as planned; schema field deferred unless queries need it.
        - (fb:c0-null-contrast-gate) RESOLVED (design) 2026-07-12 — C0 (A/A null, opus-4-8 both arms, n>=5) registered as gating step 4a in methodology/pareto-measurement-rubric.md and as the first row of evidence/pareto/live-contrast-lens-map.md; runs FIRST as wave 0 of this task and gates C1-C6 (gate = C0 delta CI vs 3.5 percent volume). Thresholds re-based per historical-hypotheses Erratum 3 (H1 boundary now ±7 percent). Execution rides this task; no mid-wave decision remains.
        - (fb:disposable-task-substrate) RESOLVED 2026-07-12 — evidence/pareto/disposable-tasks.md authored (definition with 4 qualifying properties; Tier-A historical-task replays from .agents/history with ground-truth landed diffs; Tier-B synthetic calibration controls hard-excluded from frontier cells per O13; empirical cell-matching via C0 profiling; anti-Goodhart non-goals). Wave prep resolves exact task ids per its selection rules.
        - (fb:external-digest-stat-corrections) RESOLVED 2026-07-12 — digest item 1 corrected in place (slice-pinned dedup ratios, input/output placeholder field-swap fixed, unreconstructable-corpus note) plus devforth mitmproxy corroboration added; historical-hypotheses.md Erratum 3 restates H1 max (6.44 percent full corpus → ±7 percent boundary) and widens T-c1/H2 bands (95-98 percent tokens, 58-69 percent dollars).
        - (fb:scorer-3-0-0-shadow-burn-in) RESOLVED 2026-07-12 — shadow-scored iters 55-66 under rubric 3.0.0 in a scratch iter-log (canonical 2.1.0 sidecars untouched); 11/12 reconcile within ±0.004, one explainable band change from git-topology drift (iter-66 landed signal). Burn-in PASSED; see evidence/pareto/scorer-3.0.0-shadow-burn-in.md. In-situ validation on wave rows rides C0.
        - (fb:lens-transfer-trap-test) RESOLVED 2026-07-13 — Tier-B trap-test transfer check added to evidence/pareto/disposable-tasks.md (planted-defect calibration task gates instrument trust when a stage prompt ports to a SECONDARY-tier arm; fail routes to bounded single-section prompt regeneration; O13-compatible, never a frontier row). No wave decision reopened.
        - (fb:cross-family-lens-autoswap) OPEN (e2e pipeline audit 2026-07-13) — no code path auto-selects cross-harness-adversarial-claude; resolveCrossFamily/profile_prompt.go take an explicit slug and the -claude stage_profiles key has zero non-config references. A gpt-family executor arm that keeps the plain lens hits the family-equality refusal and blocks (fail-safe but the arm dies). Operational note added to evidence/pareto/live-contrast-lens-map.md — C3/C4/C5-gpt-legs/C6-gpt-gate arm configs MUST pin the -claude lens at wave prep. Optional post-wave wiring — automatic opposite-family lens selection keyed on executor family. Additive, gate-neutral, no wave decision reopened.
      app_type: go-cli
