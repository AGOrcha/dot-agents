success_criteria: |-
    Hard test: SonarCloud quality gate on PR #10 passes (or, if not
    practical for this PR's branch-wide debt, the failing conditions are
    explicitly documented as out-of-scope-for-this-PR with rationale,
    accepted by the maintainer, and tracked as a follow-up plan).
    `go test ./...` passes locally on the branch tip. `bash -n` clean
    on all touched shell scripts. YAML loads clean on touched workflows.

    Common false positive: local fixes appear to clear findings but
    SonarCloud's incremental analysis (vs base branch) still flags them
    because of how the PR's diff is computed. Verify against the live
    PR analysis page, not against locally-replayed lint passes.
verification_strategy: |-
