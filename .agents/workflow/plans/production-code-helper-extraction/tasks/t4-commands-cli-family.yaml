        remains.

        Anti-scope: do NOT change CLI surface (flags, exit codes,
        UI text). Extraction is structural only.

        ISP routing:
          mode: fanout-amenable per file pair (settings/mcp/rules
                 group is one task; others are independent)
          verifier: smoke (go test ./commands/) + manual CLI
                     spot-check on one extracted command
          review: code review (CLI surface preserved)
          bundle-context (if fanout): T1's classification, the file
                                       group, ExampleBlock and
                                       cobra.Command precedents
          output contract: ~150-200 dup lines removed from Group CMDS
    app_type: code-fix
