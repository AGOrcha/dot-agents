      verification_required: true
      notes: |-
        First language adapter. Templates: impl-pure-fn,
        refactor-extract, add-test-coverage. Each template runs a KG
        query, picks a seed symbol, synthesizes a prompt + verification
        cmd, returns a TaskSpec. Registers in the language registry.
        Fixture-driven tests against a tiny seed KG.
      app_type: go-cli
    - id: generator-python
