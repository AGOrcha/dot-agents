      verification_required: true
      notes: |-
        Same template surface as Go; Python-specific prompt synthesis
        + pytest/unittest verification command. Reuses the registry.
        The "Go-first then port" sequencing means a stable interface
        and avoids retroactive churn on the registry.
      app_type: go-cli
    - id: generator-typescript
