    - id: release-record-0.3.3-fold
      title: 'Release record: capability folds into 0.3.3 (no separate bump)'
      status: pending
      depends_on:
        - p0-types-and-helpers
        - p1-broken-links-cursor-claude
        - p2-broken-links-remaining
        - p3-badge-and-countlinks
        - p4-orphan-canonicals-and-userconfig
