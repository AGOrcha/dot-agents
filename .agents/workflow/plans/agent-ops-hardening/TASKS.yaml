      write_scope:
        - .agents/skills/orchestrator-session-start/
      verification_required: true
      notes: |-
        Stale-queue re-discovery cost 483 "already done" hits + wasted spawns. Add a reconcile step to
        orchestrator-session-start: git fetch origin master + mark merged-to-master tasks done before emitting the
        eligible set (never orient off the divergent local branch). Pre-load the deferred orchestrator tools
        (SendMessage/TaskStop/Monitor/PushNotification/sonarqube gate-status) for active.loop sessions so they aren't
        ToolSearch-refetched (~70 calls/run).
      app_type: skill
