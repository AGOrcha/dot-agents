tasks:
    - id: p0-codex-gocache-sandbox
      title: 'P0: pre-set GOCACHE/GOTMPDIR/TMPDIR + da-write perms in Codex sandbox'
      status: pending
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - .codex/
      verification_required: true
      notes: |-
        Kills the biggest tax (1,222 GOCACHE=/tmp workarounds across 159 Codex sessions). Set GOCACHE/GOTMPDIR/TMPDIR
        to a writable sandbox dir in the Codex config/profile, and grant sandbox write for da/~/.agents/~/.codex paths
        so legitimate da refresh / KG / git writes stop triggering per-command escalation. Verify a Codex go build
        runs with no manual cache redirect.
      app_type: config
    - id: p0-sonar-scanner-exclusions
      title: 'P0: exclude dist/ + .scannerwork from sonar-scanner (stop pre-push flake)'
      status: pending
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - sonar-project.properties
      verification_required: true
      notes: |-
        The sonar pre-push gate walked dist/ + .scannerwork created mid-session -> 1562 scannerwork hits -> 461
        --no-verify reaches. Add dist/ and .scannerwork to sonar.exclusions (and confirm the pre-push scanner config).
        Removes the root reason workers bypass the local gate.
      app_type: config
    - id: p0-move-repo-out-of-documents
      title: 'P0: migration to move repo out of ~/Documents (preserve Claude history)'
      status: pending
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - scripts/
      verification_required: false
      notes: |-
        The ~/Documents TCC lock cost 190 hits (Claude) + the Codex worktree-escape/reconstruction. Only protected
        folders are Documents/Desktop/Downloads/iCloud, so a repo at ~/dot-agents needs no FDA at all (brew-cdhash
        grants are upgrade-fragile; a detached tmux server is its own responsible process). Provide a migration script
        that: mv the repo; move ~/.claude/projects/<old-encoded>/ -> <new-encoded> (carries transcripts + memory/);
        merge the ~/.claude.json projects["<old abs path>"] entry into the new key; backup first. MAINTAINER runs it.
      app_type: ops
    - id: p1-safe-push-skill
      title: 'P1 skill: safe-push (clean artifacts + serialize + run gate)'
      status: pending
      depends_on:
        - p0-sonar-scanner-exclusions
      blocks: []
      owner: dot-agents
      write_scope:
        - .agents/skills/
      verification_required: true
      notes: |-
        Design via /skill-architect. Cleans dist/+.scannerwork, serializes pushes (one-at-a-time lock; parallel pushes
        wedge the sonar hook), runs the local gate; gates any --no-verify behind an explicit flake-confirmed check.
        Removes the most expensive recurring loop. Promote + da refresh after.
      app_type: skill
    - id: p1-delegation-brief-hardening-skill
      title: 'P1 skill: delegation-brief-hardening (code-graph scope + test-caller walk + HEAD-validate)'
      status: pending
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - .agents/skills/
      verification_required: true
      notes: |-
        Highest structural leverage. Pre-fanout gate: derive write_scope from the code-review-graph (not name-similarity),
        walk all *_test.go callers of changed/deleted symbols (the co-commit wall), HEAD-validate the bundle premise,
        forecast coverage-delta for test moves; refuse a bundle whose asserting tests fall outside scope. Retires the
        largest fold-back cluster. Design via /skill-architect; fold into orchestrator-session-start/delegation-lifecycle.
      app_type: skill
    - id: p1-release-cut-skill
      title: 'P1 skill: release-cut-monitor-retry + pin-toolchain CI check'
      status: pending
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - .agents/skills/
        - .github/workflows/
      verification_required: true
      notes: |-
        The 0.4.0 release burned 4 PRs + multiple failed runs on latent infra (unpinned dotnet sign -> kernel32 Linux
        crash; non-retryable workflow; stale-tag-on-retry; jsign tsmode). Skill: preflight pin-check the signing
        toolchain on Linux -> cut -> monitor auto-release -> on infra failure clean the stale tag + workflow_dispatch
        re-drive -> classify known failures (kernel32, DLSequence cast). + a CI step that fails if a signing/build tool
        installs unpinned. release-patch-train is a standing plan, so this pays off every release.
      app_type: skill
    - id: p1-reconcile-eligible-and-preload-tools
