summary: |-
    Operationalize the 4-stream retrospective: fix the environment taxes (TCC ~/Documents, Codex GOCACHE, sonar pre-push flake) and convert mature-but-unenforced lessons into skills + brief gates
    - (fb:scaffold-home-skill-sync-mechanism) OPEN (e2e pipeline audit 2026-07-13) — no CLI step syncs or drift-detects internal/scaffold/home/starter/skills/ vs an already-onboarded ~/.agents/skills/ tree; da refresh only re-links. Consequences found — the completed kg-ideate family invisible on this machine; 7 dot-agents-namespace skill copies stale vs global (isp was missing the REQUIRED stop-gate sentinel step); skill-architect missing the landed provider-pluggable scripts; kg-brief forked bidirectionally. All synced manually today. Wanted — a refresh-time (or status --audit) scaffold↔home content-digest check plus a sync verb; ALSO a promote-time divergence warning when ~/.agents/<bucket>/global/<name> exists alongside the project-scoped copy (internal/projectsync/promote.go has none); ALSO drop the inert .gitignore un-ignore for .agents/skills/knowledge-fold-back. Trigger — next CLI hardening pass.
    - (fb:plan-archive-foldback-sweep) OPEN (e2e pipeline audit 2026-07-13) — archiveSinglePlan (commands/workflow/plan_task.go) never touches the flat .agents/active/fold-back/ dir, so fold-back artifacts of archived plans rot in the active queue; the isDMAFile 'fold-back' path segment (commands/workflow/fs.go) is an unreachable leftover from a plan-nested design. Manual sweep done today — 8 artifacts of archived plans (graphstore-concurrency-contract, config-architecture-impl, swallowed-errors-loud-atomic x4, workflow-client-commands x2 incl. the now-verified-fixed foldback-create-dryrun-has-side-effects) moved to .agents/history/<plan>/fold-backs/[<task>/]; 7 legacy .md fold-backs without plan_id frontmatter left in place. Wanted — plan archive sweeps matching fold-back artifacts (RESOLVED ones plus any belonging to the archived plan), and the dead fs.go branch removed or made live. Trigger — next workflow-CLI hardening pass.
    - (fb:agentsrc-registry-completeness) RESOLVED 2026-07-13 (e2e pipeline audit) — .agentsrc.json registries drifted from disk because manual file drops bypass the promote/new append paths. Fixed — skills array gained article-extract, playwright, platform-docs-refresh (they were live-linked but unregistered, so a fresh da install would silently skip them); agents array gained orchestrator, platform-dirs-change-analyst, promise-gap-analyst (3 of 4 in-use .claude/agents were unregistered); dead deep-research reference removed from ideation orchestrate.core (skill never existed; kg-ideate now resolves after the scaffold sync). JSON validates; da refresh clean. Follow-up idea for the same pass as the sync-mechanism record — a status --audit registry-vs-disk completeness check.
