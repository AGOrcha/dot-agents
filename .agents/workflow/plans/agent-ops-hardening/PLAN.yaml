summary: |-
    Operationalize the 4-stream retrospective: fix the environment taxes (TCC ~/Documents, Codex GOCACHE, sonar pre-push flake) and convert mature-but-unenforced lessons into skills + brief gates
    - (fb:scaffold-home-skill-sync-mechanism) OPEN (e2e pipeline audit 2026-07-13) — no CLI step syncs or drift-detects internal/scaffold/home/starter/skills/ vs an already-onboarded ~/.agents/skills/ tree; da refresh only re-links. Consequences found — the completed kg-ideate family invisible on this machine; 7 dot-agents-namespace skill copies stale vs global (isp was missing the REQUIRED stop-gate sentinel step); skill-architect missing the landed provider-pluggable scripts; kg-brief forked bidirectionally. All synced manually today. Wanted — a refresh-time (or status --audit) scaffold↔home content-digest check plus a sync verb; ALSO a promote-time divergence warning when ~/.agents/<bucket>/global/<name> exists alongside the project-scoped copy (internal/projectsync/promote.go has none); ALSO drop the inert .gitignore un-ignore for .agents/skills/knowledge-fold-back. Trigger — next CLI hardening pass.
    - (fb:agentsrc-registry-completeness) RESOLVED 2026-07-13 (e2e pipeline audit) — .agentsrc.json registries drifted from disk because manual file drops bypass the promote/new append paths. Fixed — skills array gained article-extract, playwright, platform-docs-refresh (they were live-linked but unregistered, so a fresh da install would silently skip them); agents array gained orchestrator, platform-dirs-change-analyst, promise-gap-analyst (3 of 4 in-use .claude/agents were unregistered); dead deep-research reference removed from ideation orchestrate.core (skill never existed; kg-ideate now resolves after the scaffold sync). JSON validates; da refresh clean. Follow-up idea for the same pass as the sync-mechanism record — a status --audit registry-vs-disk completeness check.
    - (fb:cross-family-gate-not-fail-closed-specialized) REDESIGNED 2026-07-13 (user steer + research). Do NOT force fail-closed CrossFamily on specialized profiles — CrossFamily==nil stays ALLOWED. Instead a positive contract — (1) any profile without a distinct-family cross gate MUST still carry an adversarial/red-team review TYPE with the same adversarial checklist and guidance so the attack posture is preserved; (2) the BLOCKING cross-family gate is REQUIRED whenever the model registry offers a genuinely distinct opposite family available to THIS user/setup, so requiredness is registry/capability-conditional not absolute (different users have different model options); (3) when no opposite family is available, EMULATE cross-family via a fresh-context adversarial pass (separate session, blind to the build) applying the OPPOSITE family known failure-mode as the enumerated audit hunt-list — GPT-family tends to hallucinate confident-wrong, Claude-family tends to refuse/give-up (research context-rot PART 7). This preserves adversarial value and minimizes the completeness drawback for BOTH pareto and non-pareto profiles when cross-family is impossible. Harness-enforced, not prompt-advisory, and fresh-context-adversarial-over-self-critique is the load-bearing mechanism (research long-horizon-prompting). Anchor research/articles-evaluation-context-engineering-and-foldback-design.md R1. Supersedes the earlier fail-open-only observation.
    - (fb:plan-archive-foldback-sweep) MERGED 2026-07-13 into proposal obs-fold-back-resolution-lifecycle (both valid, per user steer). The lifecycle proposal is the PRIMARY path — consumed/rejected fold-backs are archived by the lifecycle BEFORE a plan is archived, so plan archive is not the primary archiver. plan-archive-foldback-sweep RETAINS value only as a BAD-STATE RECONCILIATION safety net — catching terminal-but-unarchived orphans when the lifecycle was not followed, plus removing the dead isDMAFile fold-back path segment (commands/workflow/fs.go). HARD RULE — the sweep MUST NOT touch DEFERRED (open, waiting-on-a-named-trigger) fold-backs; only terminal records left unarchived are swept, and a deferred fold-back on an archiving plan is surfaced for re-homing not silently archived. Manual sweep of 8 archived-plan orphans already done. Detail in obs-fold-back-resolution-lifecycle.md Merged section.
