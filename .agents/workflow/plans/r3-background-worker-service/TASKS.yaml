schema_version: 1
plan_id: r3-background-worker-service
tasks:
    - id: design-doc
      title: Resolve R3 open questions in a per-plan design.md
      status: completed
      depends_on: []
      blocks:
        - scheduler-core
        - event-bus
        - http-server
        - cobra-surface
      owner: dot-agents
      write_scope:
        - .agents/workflow/plans/r3-background-worker-service/design.md
      verification_required: false
      notes: |-
        Landed via the R3 planner output 2026-05-25: hosting model =
        `da service` cobra subcommand (R3-D1); task framework = minimal
        in-process scheduler in internal/service/scheduler with fsnotify
        triggers (R3-D2). See design.md for rejected alternatives
        (asynq/river/cron-only/standalone-binary/sidecar) and the
        per-task watermark protocol for restart-safe state.
      app_type: research
    - id: scheduler-core
      title: In-process scheduler with interval + fsnotify triggers
      status: completed
      depends_on:
        - design-doc
      blocks:
        - tasks-iterlog-ingester
        - tasks-rescore
        - cobra-surface
      owner: dot-agents
      write_scope:
        - internal/service/scheduler/
        - go.mod
        - go.sum
      verification_required: true
      notes: |-
        Build the scheduler primitive: Register(Task), Start(ctx),
        Stop(timeout). Task has {Name, Trigger, RunFn(ctx) error,
        Timeout}. Trigger interface with Interval and FSNotify
        implementations (fsnotify dep is new — add to go.mod).
        Scheduler tracks per-task last-run-at, next-run-at,
        last-error, consecutive-failures; exposes them via State()
        snapshot for the status CLI. Panics in RunFn are recovered
        and recorded as last-error, NOT propagated. Stop() drains
        in-flight runs up to timeout then cancels their context.
        Anti-scope: NO http surface here, NO concrete tasks, NO
        watermark logic (per-task in tasks/).
        Reviewer verifies: race detector clean, panic recovery test,
        Stop honors ctx cancellation, fsnotify coalesces rapid events.
        SHIPPED (coherence 2026-06-25): internal/service/scheduler/
        (scheduler.go + trigger.go + tests) landed via commit 0a57f0b6
        ("feat(service): in-process scheduler core") with the SonarCloud
        follow-up f9ea6632. Marked completed.
        - (fb:fsnotify-rearm-flake) TestFSNotifyTriggerReArmDuringBurst fails ~40 percent locally under -race on unmodified master (macOS); timing-sensitive re-arm window. Needs the deterministic-seam treatment (like the hangup/partial-identity fixes) rather than timing luck. Found during service-runtime integration (#272).
      app_type: go-cli
    - id: event-bus
      title: In-process pub/sub bus for task → consumer events
      status: completed
      depends_on:
        - design-doc
      blocks:
        - tasks-iterlog-ingester
        - http-server
      owner: dot-agents
      write_scope:
        - internal/service/events/
      verification_required: true
      notes: |-
        Bus.Publish(topic, payload), Bus.Subscribe(topic) returns
        <-chan Event. Channel-based, bounded buffer per subscriber,
        drop-oldest on slow consumer with a counter on dropped events.
        Event{Topic, Timestamp, Payload any}. Topics defined as
        constants: iteration.scored, rescore.done, task.error.

        Cross-plan contract: Bus.Publish signature is the shape R2's
        sse-broker (t04) and R5's collection-endpoint depend on. Keep
        it tiny: `Publish(topic string, payload any)`. If async/
        queue-backed is required later, that's a follow-up via a
        sibling Publisher interface.

        Anti-scope: NO durable storage (events are ephemeral — R2
        reads canonical state from sidecars), NO cross-process IPC.
        Reviewer verifies: drop-oldest semantics under back-pressure,
        unsubscribe closes channel cleanly, race detector clean.
        SHIPPED (coherence 2026-06-25): internal/service/events/
        (events.go + tests) landed via PR #172 (commits 7cd41916
        "feat(service): in-process event bus" + 594d0e75 Sonar fix).
        The shipped surface is Publish(topic, payload) +
        Subscribe(topic) (<-chan Event, func()) per D4; R2 t04-sse-broker
        and R5 collection-endpoint bind to it. Marked completed.
      app_type: go-cli
    - id: http-server
      title: Service transport layer — UDS/named-pipe control plane + HTTP/SSE edge (mounts for R2/R5, /healthz, /api/tasks)
      status: completed
      depends_on:
        - design-doc
        - scheduler-core
        - event-bus
        - event-bus-interface-seam
      blocks:
        - service-runtime
      owner: dot-agents
      write_scope:
        - internal/service/http/
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence, PR #162): OQ5 is ruled —
        option (B) UDS-first + HTTP edge (spec §2A). This task is a
        TRANSPORT LAYER, not an HTTP-everywhere server. NOT
        HTTP-by-default; each surface follows the §2A surface→transport
        map and selection rule ("Use HTTP for a surface when it is
        browser-facing, OR cross-machine, OR consumed by an external
        tool that speaks HTTP. Otherwise use the local high-efficiency
        transport."). Two listeners:
        (1) Local control plane — Unix-domain socket (named pipe on
        Windows) behind one small dialer abstraction. Serves
        `da service status`/`stop` and the §D6 CLI-routes-when-present
        path. Stop/admin is authorized by socket file permission +
        peer-credential check (SO_PEERCRED on Linux, LOCAL_PEERCRED on
        macOS, named-pipe client token on Windows) — this REPLACES the
        old "POST /admin/stop gated on loopback" network-ACL shape
        (OQ4). Named-pipe path must be exercised on the Windows box,
        not assumed to mirror UDS (§2A cross-platform note).
        (2) HTTP/SSE edge — net/http (no framework dep), mounted ONLY
        for the browser/dashboard surface (R2) and the explicit
        external bind (OQ3 default loopback 127.0.0.1:7878; external
        requires explicit --addr opt-in). Serves GET /healthz (200 ok)
        and GET /api/tasks (scheduler.State() as JSON).
        RegisterMount(prefix, handler) stitches a sub-handler under an
        arbitrary prefix on this edge — R2 calls with "/api" +
        dashboard handler, R5 with "/api/reviews" + review handler.
        Graceful shutdown via http.Server.Shutdown(ctx) wired to the
        runtime ctx; the control-plane listener closes on the same ctx.
        Dependencies: takes the §D4.1 EventBus INTERFACE (see
        event-bus-interface-seam), never the concrete *events.Bus.
        Anti-scope: NO R2 endpoints, NO R5 endpoints (only the mount
        machinery + stub test that proves RegisterMount routes
        correctly). NO authn/authz (R5 plan owns RBAC). NO
        worker-dispatch wire (scheduler→task RunFns stay in-process Go
        calls per the §2A map). NO external EventBus adapters.
        Reviewer verifies: /healthz returns 200 and /api/tasks JSON
        shape matches scheduler.State() on the HTTP edge; control
        endpoints answered over the UDS/named-pipe listener
        (integration test against a *socket* listener, not TCP, per
        the §2A verifier-chain note); peer-credential gate enforced on
        stop; RegisterMount with overlapping prefixes errors
        deterministically; graceful shutdown of both listeners
        completes within ctx deadline.
        - (fb:windows-named-pipe-control-plane) The UDS control plane (status/stop) is stubbed fail-fast on Windows (control_windows.go): da service will not start on Windows at all. Deferred at the transport layer (#249) and composition layer (#272) because §2A requires the named-pipe path be exercised on a REAL Windows box, not assumed, and go-winio is only an indirect dep. OWNER-RELEVANT: the maintainer's work PC is Windows, so da service is unusable there until this lands. Needs a named-pipe listener/dialer + Windows peer-identity (named-pipe client token per §2A) behind the existing per-OS listenControl/dialControl/defaultPeerUID seam, validated on real Windows CI.
      app_type: go-cli
    - id: tasks-iterlog-ingester
      title: Iter-log ingester task — fsnotify trigger, calls R1 scorer, publishes event
      status: completed
      depends_on:
        - scheduler-core
        - event-bus
        - event-bus-interface-seam
      blocks:
        - service-runtime
      owner: dot-agents
      write_scope:
        - internal/service/tasks/ingest_iterlog.go
        - internal/service/tasks/ingest_iterlog_test.go
        - internal/service/state/
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence): publish via the §D4.1
        EventBus INTERFACE (see event-bus-interface-seam), not the
        concrete *events.Bus, and assume only the §D4.2 G1-G4 floor —
        a missed event is recoverable from the sidecar + watermark
        (§D3), never from the bus. No transport wire here:
        scheduler→task dispatch is an in-process Go call per the §2A
        surface→transport map (worker-dispatch row).
        FSNotify trigger on .agents/active/iteration-log/. On a new
        or modified iter-N.yaml: call into internal/scoring (use
        ScoreIteration which is the same entrypoint
        commands/workflow/close_task.go calls — DO NOT duplicate that
        pipeline), write the sidecar via
        scoring.WriteIterationScoreWithRecord, publish
        events.IterationScored{iter, score, band, sidecar_path} on
        the bus, update watermark.
        Cross-plan dep: depends on the r1-outcome-scoring/persist
        sidecar shape (already shipped). If sidecar already current
        per watermark, skip — idempotent.
        Watermark sidecar at
        .agents/active/service-state/iterlog-ingester.watermark.yaml
        with {last_iter_processed, last_mtime, rubric_version}.
        Atomic write (temp+rename), mirroring
        internal/scoring/persist.go writeYAMLAtomic.
        Anti-scope: NO new scoring logic (delegate to
        internal/scoring), NO session-aggregate handling here.
        Reviewer verifies: restart test (write iter-1, run, kill,
        write iter-2, restart, assert only iter-2 is processed); drop
        and coalesce of rapid fsnotify events; absent watermark on
        first run.
      app_type: go-cli
    - id: tasks-rescore
      title: Rescore-on-rubric-bump task — interval trigger, rescores when RubricVersion changes
      status: completed
      depends_on:
        - scheduler-core
        - event-bus
        - event-bus-interface-seam
      blocks:
        - service-runtime
      owner: dot-agents
      write_scope:
        - internal/service/tasks/rescore.go
        - internal/service/tasks/rescore_test.go
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence): publish events.RescoreDone
        via the §D4.1 EventBus INTERFACE (see event-bus-interface-seam),
        not the concrete *events.Bus; assume only the §D4.2 G1-G4
        floor. No transport wire here — scheduler→task dispatch is an
        in-process Go call per the §2A map.
        Interval trigger (default 60s, configurable). Reads watermark
        .agents/active/service-state/rescore.watermark.yaml; compares
        scoring.RubricVersion to the recorded value. If different,
        invokes scoring.BuildSignalSets + rubric.ScoreAll for every
        record, writes sidecars via scoring.WriteIterationScores +
        WriteSessionScores, publishes events.RescoreDone{from_version,
        to_version, iter_count} on the bus, updates watermark.
        Anti-scope: DO NOT poll-rescore in the absent-watermark case
        on every interval — that's quadratic and the per-iter task
        already scores on ingest. Only act on version delta.
        Reviewer verifies: no-op when version unchanged (most ticks);
        rescore runs once per version bump; watermark persisted
        before event publish to keep the bus eventually-consistent
        with disk.
      app_type: go-cli
    - id: service-runtime
      title: Service runtime that composes scheduler + http + bus + tasks
      status: pending
      depends_on:
        - http-server
        - tasks-iterlog-ingester
        - tasks-rescore
      blocks:
        - cobra-surface
      owner: dot-agents
      write_scope:
        - internal/service/service.go
        - internal/service/service_test.go
        - internal/service/config.go
        - internal/service/config_test.go
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence): compose to the §2A/§D4
        shape, not the old HTTP-everywhere shape.
        Run(ctx, Config) wires everything: build the EventBus (the
        §D4.1 INTERFACE; v1 constructs the in-process builtin §D4.3
        directly — no config-selected external backends yet, per the
        OQ6 interface-only ruling), build scheduler, register
        iterlog-ingester + rescore tasks (each receives the EventBus
        interface), build the transport layer from http-server (UDS/
        named-pipe control listener + HTTP/SSE edge; the edge receives
        scheduler + bus), scheduler.Start, serve both listeners. On
        ctx.Done() cancel scheduler, close the control-plane listener,
        Shutdown the HTTP edge.
        Config: {ControlSocket (UDS path / named-pipe name, sensible
        per-repo default), HTTPAddr (default loopback 127.0.0.1:7878
        per OQ3; explicit non-loopback = deliberate external opt-in),
        IterLogDir, RepoDir, RescoreInterval, EnabledTasks []string}.
        Sensible defaults match the rest of the CLI
        (.agents/active/iteration-log; cwd for repo).
        Integration test: spin up Run in a goroutine against a temp
        iter-log dir, drop iter-1.yaml, subscribe via the EventBus
        interface, assert iteration.scored event arrives within 2s and
        sidecar exists, cancel ctx, assert Run returns within 5s.
        Anti-scope: NO cobra here (that's the next task); NO os.Exit
        — return clean errors so the cobra layer can render.
        Reviewer verifies: clean shutdown of BOTH listeners,
        integration test green, all goroutines exit (use goleak or
        manual wait).
      app_type: go-cli
    - id: cobra-surface
      title: '`da service run|status|stop` cobra subcommand'
      status: pending
      depends_on:
        - service-runtime
      blocks:
        - docs-and-verification
      owner: dot-agents
      write_scope:
        - commands/service/
        - commands/root.go
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence): control-plane commands
        ride the UDS/named-pipe control socket, not TCP/HTTP (spec §2A
        map — local control plane row; OQ4 stop becomes a socket-
        permission + peer-credential check, not a loopback network
        ACL). Also reconciled to spec D1: `-d`/`--detach` self-
        backgrounding + pidfile IS in scope — the earlier "no
        daemonization / no PID file" anti-scope contradicted D1 and
        the spec's done criteria.
        Pattern after commands/score.go: NewServiceCmd() returns the
        command group; wire into commands/root.go alongside
        NewScoreCmd. Subcommands:
          - `da service run`   — foreground; SIGINT/SIGTERM → graceful
            shutdown. Flags: --addr (HTTP edge bind, default loopback
            127.0.0.1:7878 per OQ3; explicit non-loopback = deliberate
            external opt-in), --control-socket, --iter-log-dir,
            --repo-dir, --rescore-interval, --task (repeatable
            allow-list). --json prints startup banner as JSON.
          - `da service run -d` (alias `--detach`) — self-backgrounds,
            writes a pidfile, returns immediately (spec D1 + done
            criteria; systemd/launchd supervision of the foreground
            mode coexists).
          - `da service status` — queries the running instance over
            the control socket (UDS / named pipe) and renders the task
            table (mirror score command's render style); --json passes
            through; helpful error when no service is running.
          - `da service stop`  — stop request over the control socket,
            authorized by socket file permission + peer credential
            (SO_PEERCRED / LOCAL_PEERCRED / named-pipe client token) —
            NOT a POST /admin/stop loopback endpoint.
        Reviewer verifies: --help text accurate; status renders over
        the socket; stop refused for a non-owner peer where the
        platform supports the check; `-d` writes a pidfile and returns
        immediately; SIGINT triggers graceful shutdown in <5s; root.go
        test still passes; named-pipe path exercised on the Windows
        box (§2A cross-platform note).
      app_type: go-cli
