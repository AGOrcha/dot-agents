    notes: 'Sibling to MakeFileUnreadable for directories — used by tests that need a "cannot stat / cannot list" assertion. POSIX path: chmod 0. Windows path: deny-DACL on the dir SID, or open with FILE_FLAG_BACKUP_SEMANTICS + share-none. Skip on root + on tmpfs/synthetic FS where DACL is not enforced. Test parity: os.ReadDir fails for the duration of the test, and cleanup restores access.'
