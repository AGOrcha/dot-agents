schema_version: 1
plan_id: cross-platform-test-skips-audit
tasks:
    - id: catalogue
      title: Catalogue every Windows skip and classify each
      status: in_progress
      depends_on: []
      blocks:
        - perms-dir
        - perms-readonly
        - symlinks
        - exec-bit
        - migrate-sites
      owner: dot-agents
      write_scope:
        - .agents/workflow/plans/cross-platform-test-skips-audit/findings.md
      verification_required: false
      notes: 'Walk `grep -rn ''runtime.GOOS == "windows"'' --include="*_test.go"` and produce findings.md with: (file:line, test name, what the skip is for, classification). Classes: [shortcut-permission] (chmod-based unreadability that testutil.MakeFileUnreadable already solves), [shortcut-mode] (relies on POSIX mode bits for exec/RO state — needs a sibling helper), [shortcut-symlink] (uses os.Symlink without elevated-priv guard), [genuine-posix] (e.g. inode equivalence semantics that have no Windows analog). The classification drives which subsequent task picks up the site.'
      app_type: go-cli
    - id: perms-dir
      title: Extend testutil with MakeDirUnreadable (POSIX chmod + Windows ACL/DACL)
      status: pending
      depends_on:
        - catalogue
      blocks:
        - migrate-sites
      owner: dot-agents
      write_scope:
        - internal/testutil/perms_dir.go
        - internal/testutil/perms_dir_unix.go
        - internal/testutil/perms_dir_windows.go
        - internal/testutil/perms_dir_test.go
      verification_required: true
      notes: 'Sibling to MakeFileUnreadable for directories — used by tests that need a "cannot stat / cannot list" assertion. POSIX path: chmod 0. Windows path: deny-DACL on the dir SID, or open with FILE_FLAG_BACKUP_SEMANTICS + share-none. Skip on root + on tmpfs/synthetic FS where DACL is not enforced. Test parity: os.ReadDir fails for the duration of the test, and cleanup restores access.'
      app_type: go-cli
    - id: perms-readonly
      title: Extend testutil with MakeFileReadOnly (works on both platforms)
      status: pending
      depends_on:
        - catalogue
      blocks:
        - migrate-sites
      owner: dot-agents
      write_scope:
        - internal/testutil/perms_readonly.go
        - internal/testutil/perms_readonly_test.go
      verification_required: true
      notes: 'Sibling to MakeFileUnreadable for the "write must fail" assertion. Implementation: os.Chmod(path, 0o444) on POSIX; on Windows the readonly file attribute is honoured for write operations, so a single cross-platform chmod 0o444 actually works (Go translates the W bit to FILE_ATTRIBUTE_READONLY). Verify the assertion both ways before declaring this is the cross-platform case.'
      app_type: go-cli
    - id: symlinks
      title: testutil.SymlinkOrSkip — gate symlink tests on capability, not OS
      status: pending
      depends_on:
        - catalogue
      blocks:
        - migrate-sites
      owner: dot-agents
      write_scope:
        - internal/testutil/symlink.go
        - internal/testutil/symlink_test.go
      verification_required: true
      notes: 'Several tests skip on Windows because os.Symlink requires SeCreateSymbolicLinkPrivilege. The right gate is "can this process create a symlink?", not "is this Windows?" — Windows 10 with Developer Mode enabled CAN create symlinks. Helper: attempt a probe os.Symlink in t.TempDir, t.Skip with a Windows-aware reason if it fails, return otherwise. Migration target: internal/links/symlink_remove_error_test.go and any sibling.'
      app_type: go-cli
    - id: exec-bit
      title: Decide on exec-bit tests — POSIX-only behaviour, document deliberately
      status: pending
      depends_on:
        - catalogue
      blocks:
        - migrate-sites
      owner: dot-agents
      write_scope:
        - internal/scaffold/home/copy_test.go
      verification_required: true
      notes: 'internal/scaffold/home/copy_test.go (and any other exec-bit test) is testing the POSIX 0o755 mode bit semantics that have no Windows equivalent. This is the [genuine-posix] class — no abstraction can fix it without changing what the test asserts. Keep the skip but document why explicitly so a future reader does not try to "abstract" it. Output: the test gets a multi-line comment block linking back to this plan.'
      app_type: go-cli
    - id: migrate-sites
      title: Migrate every shortcut-class skip to the new helpers
      status: pending
      depends_on:
        - perms-dir
        - perms-readonly
        - symlinks
        - exec-bit
      blocks:
        - cg6-prune
      owner: dot-agents
      write_scope: []
      verification_required: true
      notes: 'Apply the helpers to every site catalogued in the [shortcut-*] classes. Per-task write_scope will be filled in at fanout time (depends on the catalogue output). Acceptance: post-migration, no t.Skip log lines appear on the windows-latest runner for these tests; per-file Windows coverage rises measurably.'
      app_type: go-cli
    - id: cg6-prune
      title: Prune stale allowlist entries the migration unblocks
      status: pending
      depends_on:
        - migrate-sites
      blocks: []
      owner: dot-agents
      write_scope:
        - scripts/coverage-exceptions.txt
      verification_required: true
      notes: After migrate-sites lifts Windows coverage on the affected files, the coverage-gate prints STALE-ALLOWLIST for any entry now at or above threshold. Prune those entries — that is the cg6 ratchet tightening. Cross-reference with the R1 carry-over entries this PR added (internal/scoring/persist.go [defensive-guards], internal/scoring/objective_checks.go [legacy-tail], commands/agents/cmd.go, commands/workflow/prefs.go).
      app_type: go-cli
