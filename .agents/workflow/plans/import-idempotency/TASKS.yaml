schema_version: 1
plan_id: import-idempotency
tasks:
    - id: ii-import-idempotent
      title: Make da import idempotent (skip-unchanged, no spurious alternates, non-interactive-safe)
      status: completed
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - commands/import.go
        - commands/import_test.go
      verification_required: true
      notes: Make da import idempotent. Symptom -- da import (auto-run by da refresh) re-imports every source each run, never skipping identical already-imported content, and mints base-N alternates on conflict (commands/import.go ~826/846); re-import stacks -2 -> -2-2, bloating ~/.agents/hooks; also prompts interactively (import.go line 520) which breaks non-interactive refresh. Fix so re-import of an unchanged source is a no-op (no rewrite, no alternate, no prompt), alternates only on a genuine NEW conflict, and non-interactive runs never block (deterministic safe default). Verify import-twice is a no-op with stable store fingerprint under isolated HOME+AGENTS_HOME (internal/testutil).
      app_type: go-cli
    - id: ii-refresh-replace-policy
      title: Reconcile da refresh auto-replace policy with content-management rules
      status: completed
      depends_on:
        - ii-import-idempotent
      blocks: []
      owner: dot-agents
      write_scope:
        - commands/import.go
        - commands/refresh.go
        - internal/ui/confirm.go
      verification_required: true
      notes: |-
        Policy decided and locked. Auto-replace is the canonical refresh behavior: sources are
        truth (uv-style auto-sync); non-hook managed files are replaced when source content has
        changed. The ii-import-idempotent fix ensures unchanged sources are no-ops so only genuine
        updates reach the replace path. Backup sidecars are written before replacement for recovery.
        Policy comment added to runImportFromRefresh; regression test
        TestRunImportFromRefresh_Policy locks both the auto-replace (refresh) and
        preserve-on-non-interactive (da import) behaviors.
      app_type: go-cli
