        acquirer behind a swappable interface-DI seam (a JWTAcquirer interface; the exec runner injected) so the
        command/consumer code is unchanged when the mechanism becomes Option B (loopback browser->127.0.0.1 callback,
        the gh/VS Code/Claude pattern) on the future daemon + auth-proxy. JWT held only for the provision call, never
        persisted by da, never logged (section 7). OQ-1: A now, B later via the seam.
