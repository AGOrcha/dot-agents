schema_version: 1
plan_id: root-command-decomposition
order: 11
task:
    id: t10a-create-mcp-subpackage
    title: Move mcp command into commands/mcp/ (per agents/skills file convention)
    status: completed
    depends_on:
        - t10pre-extract-canonical-cmd-helpers
    blocks: []
    owner: dot-agents
    write_scope:
        - commands/mcp/cmd.go
        - commands/mcp/cmd_test.go
        - commands/mcp/deps.go
        - commands/mcp/example.go
        - commands/mcp/list.go
        - commands/mcp/show.go
        - commands/mcp/remove.go
        - commands/mcp/seams.go
        - commands/mcp/seams_test.go
        - commands/mcp/coverage_test.go
        - commands/mcp/mcp_test.go
        - commands/mcp.go
        - commands/mcp_test.go
    verification_required: true
    notes: |-
        Mirror the existing agents/skills/sync file convention — NOT
        a single mcp.go inside the subpackage. Target layout:

          - cmd.go            — NewCmd() (was NewMCPCmd in root) +
                                sub-command wiring (list/show/remove).
                                Pattern: commands/skills/cmd.go.
          - deps.go           — Deps struct + NewDeps() (was the root
                                mcpDeps + mcpCommandDeps).
                                Pattern: commands/agents/deps.go.
          - example.go        — Example string blocks for cobra
                                Example: fields.
                                Pattern: commands/agents/example.go.
          - list.go / show.go / remove.go — one file per sub-command,
                                each holding the run* runner + the
                                builder helper (was runMCPList /
                                runMCPShow / runMCPRemove + the
                                newMCPListCmd / newMCPShowCmd /
                                newMCPRemoveCmd builders, plus
                                mcpCanonicalSpec). Mirror commands/
                                agents/{list,promote,new,remove}.go.
          - seams.go + seams_test.go — package-var seams for os.* /
                                projectsync.* hooks. Mirror commands/
                                agents/seams.go.
          - coverage_test.go  — file-level coverage assertions.
                                Mirror commands/agents/coverage_test.go.
          - mcp_test.go       — the test file from t5 PR #49
                                (testutil-consuming refactor)
                                re-homed here. PRESERVE every
                                testutil.WriteScopeFile call site
                                verbatim through the move; only the
                                package decl changes.

        cmdutil import: commands/mcp/ imports
        "github.com/.../commands/internal/cmdutil" using the helpers
        extracted in t10pre (CanonicalCmdFlags,
        CanonicalCmdExampleBlock, RunCanonicalList / Show / Remove,
        CanonicalFileSpec). findMCPSpec stays package-private (used
        by TestFindMCPSpecNotFound).

        After this task, commands/mcp.go is a thin shim wiring
        commands.NewMCPCmd() -> mcp.NewCmd(). That root shim is
        deleted in t13.
