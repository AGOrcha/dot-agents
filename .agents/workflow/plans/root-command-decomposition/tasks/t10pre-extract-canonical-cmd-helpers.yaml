schema_version: 1
plan_id: root-command-decomposition
order: 10
task:
    id: t10pre-extract-canonical-cmd-helpers
    title: 'Precursor: lift canonicalCmdFlags + canonicalCmdExampleBlock into commands/internal/cmdutil'
    status: completed
    depends_on:
        - t01-design-subpackage-shape
    blocks:
        - t10a-create-mcp-subpackage
        - t10b-create-settings-subpackage
        - t10c-create-rules-subpackage
    owner: dot-agents
    write_scope:
        - commands/internal/cmdutil/canonical_cmd.go
        - commands/internal/cmdutil/canonical_cmd_test.go
        - commands/rules.go
        - commands/mcp.go
        - commands/settings.go
    verification_required: true
    notes: |-
        Today `canonicalCmdFlags` (struct) and
        `canonicalCmdExampleBlock` (helper) live in commands/rules.go
        (with a comment noting "rules was the first consumer; reused
        from mcp.go and settings.go via the shared cmdutil pattern").
        All three resource commands access them via same-package
        scope. The moment any one of those three splits into its own
        subpackage, that same-package access breaks.

        Lift both into commands/internal/cmdutil as the new exported
        `cmdutil.CanonicalCmdFlags` and
        `cmdutil.CanonicalCmdExampleBlock`. Update the three root
        call sites to use the cmdutil-qualified names. No behavior
        change; tests in commands/{mcp,settings,rules}_test.go must
        stay green.

        This task MUST land before t10a/b/c. After it lands, each of
        the three subpackages can split cleanly and independently
        in parallel.
