        - commands/mcp/
        - commands/settings/
        - commands/rules/
      verification_required: true
      notes: |-
        Per user decision: the move tasks (t02-t13) PRESERVE the
        current package-var seams. This task lands the per-file
        interface-DI shape (per the convention doc shipped with
        seam-interface-di-migration) across the new subpackages as a
        direct follow-up. Either fold into seam-interface-di-migration
        as new tasks (preferred — single plan owns the shape) or
        author as a sibling plan. Decide based on whether seam-
        interface-di's existing leaves (kg-pkg, skills-pkg, agents-
        pkg, platform-pkg) have shipped by the time this opens.

