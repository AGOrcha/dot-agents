        - commands/add.go
        - commands/doctor.go
        - commands/import.go
        - commands/import_plugins.go
        - commands/init.go
        - commands/install.go
        - commands/refresh.go
        - commands/remove.go
        - commands/status.go
        - commands/linkcount_unix.go
        - commands/linkcount_windows.go
        - commands/mcp.go
        - commands/settings.go
        - commands/rules.go
      verification_required: true
      notes: |-
        Per user decision: DELETE root shims entirely. Per t01
        SHAPE.md, root.go's AddCommand calls switch from
        commands.NewInstallCmd / etc. to lifecycle.NewInstallCmd,
        lifecycle.NewDoctorCmd, ..., mcp.NewCmd, settings.NewCmd,
        rules.NewCmd. Verify cmd/dot-agents/main.go still compiles
        unchanged (it should — it only calls
        commands.NewRootCommand()). Any external importer of
        commands.NewXxxCmd surfaced by t01's KG query must already
        have been addressed in that task's OD entries.

    - id: t14-import-graph-assertion
      title: Add CI assertion that package commands does not import banned internals
      status: pending
      depends_on:
