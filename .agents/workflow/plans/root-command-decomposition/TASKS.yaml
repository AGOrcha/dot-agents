      blocks: []
      owner: dot-agents
      write_scope:
        - tools/importguard/main.go
        - tools/importguard/main_test.go
        - .github/workflows/test.yml
      verification_required: true
      notes: |-
        Per PLAN.yaml verification_strategy: assert that package
        commands no longer imports internal/links,
        internal/projectsync, internal/scaffold/home, or
        internal/scaffold/hooks. Implement as a tiny Go program that
        walks `go list -json ./commands` and checks the import set,
        plus a workflow step (or add to existing test.yml as a fast
        check). Alternative: an analysistest rule. Path names above
        are placeholders — t01 SHAPE.md may pick a different home
        (e.g. internal/architest).

    - id: t15-direct-followup-interface-di
      title: 'Direct follow-up: land interface-DI on the new lifecycle + mcp/settings/rules subpackages'
      status: pending
