        - commands/lifecycle/init_test.go
        - commands/init.go
        - commands/init_test.go
      verification_required: true
      notes: |-
        init.go is the only root file importing internal/scaffold/home
        and internal/scaffold/hooks. After this move, package commands
        should no longer import those at all. The importguard built
        in t14 enforces it permanently.

