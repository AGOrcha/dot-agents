# yaml-language-server: $schema=../../../../schemas/workflow-tasks.schema.json
schema_version: 1
plan_id: typescript-port
tasks:
    - id: tp1-current-gap-audit
      title: Audit current Go ↔ TS command surface gap; produce checked-in gap memo
      status: pending
      depends_on: []
      blocks:
        - tp2-boundary-spec
        - tp3-sync-pipeline
      owner: dot-agents
      write_scope:
        - docs/TYPESCRIPT_PORT_GAP.md
      verification_required: false
      app_type: research
      notes: |-
        Tier: T1 (molecule — research + memo).

        Concrete deliverable: docs/TYPESCRIPT_PORT_GAP.md captures the
        current state at three levels of detail:

        1. Top-level command parity:
             Go has — add, agents, doctor, explain, hooks, import, init,
             install, kg, mcp, refresh, remove, review, rules, settings,
             skills, status, sync, workflow.
             TS has — add, agents, doctor, hooks, init, kg, refresh,
             skills, status, workflow.
             Per the Phase 4 boundary: missing-but-intentional are
             explain, import, install, mcp, remove, review, rules,
             settings, sync. Each gets a one-line classification:
             "Stage 1 + missing" (must mirror), "Phase 4 opt-out"
             (deferred by design), or "Phase 5 deferred" (Stage 2 work).

        2. Subcommand depth per Stage 1 command:
             For init, add, refresh, status, doctor, skills, agents, hooks:
             list every Go subcommand and flag; mark TS coverage as
             "implemented", "partial", "missing", or "deferred-by-design".
             This is the row-level diff that the future sync pipeline
             will lock in.

        3. Stage 2 deferred items already named:
             plugin spec listing in status (Go: printPluginsSection /
             ListPluginSpecs; TS: deferred). Any new Stage 2 surfaces
             since the boundary doc was written get added here.

        ISP routing:
          mode: direct (research; produces a single memo)
          verifier: manual (memo is well-formed and accurate)
          review: doc review (does the memo's classification match the boundary contract?)
          anti-scope: do NOT modify ports/typescript/ source. This task is read-only audit.
          bundle-context (if fanout): docs/TYPESCRIPT_PORT_BOUNDARY.md, ports/typescript/README.md, ports/typescript/src/commands/*.ts, commands/*.go listings, ports/typescript/tests/boundary.test.ts
          output contract: docs/TYPESCRIPT_PORT_GAP.md with three sections (top-level / subcommand depth / Stage 2 deferred), each row classified

    - id: tp2-boundary-spec
      title: Define machine-readable boundary spec the sync pipeline can consume
      status: pending
      depends_on:
        - tp1-current-gap-audit
      blocks:
        - tp3-sync-pipeline
      owner: dot-agents
      write_scope:
        - docs/typescript-port-boundary.json
        - docs/TYPESCRIPT_PORT_BOUNDARY.md
      verification_required: false
      app_type: research
      notes: |-
        Tier: T1 (molecule — schema design + cross-reference update).

        Concrete deliverable: docs/typescript-port-boundary.json — a
        machine-readable spec that the CI pipeline (tp3) reads to decide
        whether a Go change demands a TS change. Schema:

          {
            "version": 1,
            "stage1_commands": [<must-mirror command names>],
            "stage1_flag_lock": {
              "<cmd>": ["<flag1>", "<flag2>", ...]
            },
            "phase4_optouts": [<commands intentionally Go-only>],
            "phase5_deferred": [<commands deferred to future Stage 2 work>],
            "stage2_deferred_subitems": [<feature-level items>]
          }

        docs/TYPESCRIPT_PORT_BOUNDARY.md gains a forward reference:
        "Machine-readable form: docs/typescript-port-boundary.json
        (consumed by ports/typescript/scripts/check-boundary.* in CI)."

        ISP routing:
          mode: direct (single JSON spec + small markdown cross-reference edit)
          verifier: manual (spec parses; matches the prose boundary doc)
          review: doc review (spec faithfully encodes the Phase 4 decision)
          anti-scope: do NOT change the Phase 4 decision content. The JSON encodes the existing prose; deviations require a superseding ADR.
          bundle-context (if fanout): docs/TYPESCRIPT_PORT_BOUNDARY.md (current), docs/TYPESCRIPT_PORT_GAP.md (from tp1)
          output contract: docs/typescript-port-boundary.json (parses as valid JSON; matches the schema above) + the cross-reference line in TYPESCRIPT_PORT_BOUNDARY.md

    - id: tp3-sync-pipeline
      title: Implement CI sync check that diffs Go command tree against the boundary spec
      status: pending
      depends_on:
        - tp1-current-gap-audit
        - tp2-boundary-spec
      blocks:
        - tp4-close-mirror-gaps
      owner: dot-agents
      write_scope:
        - ports/typescript/scripts/check-boundary.ts
        - ports/typescript/tests/boundary-sync.test.ts
        - .github/workflows/typescript-port.yml
      verification_required: true
      app_type: ci-tooling
      notes: |-
        Tier: T2 (compound — script + test + CI workflow).

        Concrete deliverable: ports/typescript/scripts/check-boundary.ts
        runs the following diff:

        1. Parse the Go cobra command tree from `dot-agents __dump-tree`
           (or, if no such command exists yet, parse `commands/*.go` for
           cobra.Command literals — a fallback parser is acceptable for
           the first pass).
        2. Parse the TS commander tree from
           ports/typescript/src/cli.ts.
        3. Load docs/typescript-port-boundary.json.
        4. For every top-level Go command:
             - if name in stage1_commands AND name not in TS tree → FAIL
               (must-mirror gap).
             - if name in phase4_optouts OR phase5_deferred → ALLOW.
             - if name not in spec at all → FAIL with message "Go gained
               a top-level command not classified in the boundary spec.
               Add it to stage1_commands, phase4_optouts, or
               phase5_deferred."
        5. For each Stage 1 command, also diff flag-level surface against
           stage1_flag_lock; FAIL on undocumented additions or removals.

        CI workflow (.github/workflows/typescript-port.yml) runs this on
        every PR. Failure messages include actionable diffs.

        Verification: introduce a fake Go command in a draft commit, run
        the check locally, confirm it fails with a useful message, then
        revert. (This validation is performed in tp3 by the implementer
        and noted in the merge-back; not a permanent test artifact.)

        ISP routing:
          mode: fanout-amenable (CI tooling work; bundle-context-rich; isolated write scope under ports/typescript/scripts/ and .github/workflows/)
          verifier: smoke (run check-boundary locally; confirm it parses spec, parses Go tree, parses TS tree, exits 0 on current state)
          review: code review (diff logic correct? error messages actionable? edge cases — empty spec, malformed Go file — handled?)
          anti-scope: do NOT introduce a new Go subcommand `__dump-tree` in this task — if the parser fallback is sufficient, ship that; the Go-side dump-tree command is a separate, smaller follow-up if parser fragility shows up.
          bundle-context (if fanout): docs/typescript-port-boundary.json (from tp2), ports/typescript/src/cli.ts, commands/root.go (Go cobra root), existing CI workflows under .github/workflows/ for style consistency
          output contract: passing CI on this branch with the new workflow active; the validation experiment (fake-Go-command-fails) noted in merge-back

    - id: tp4-close-mirror-gaps
      title: Close any must-mirror gaps surfaced by tp1 audit
      status: pending
      depends_on:
        - tp1-current-gap-audit
        - tp3-sync-pipeline
      blocks: []
      owner: dot-agents
      write_scope:
        - ports/typescript/src/commands/
        - ports/typescript/src/cli.ts
        - ports/typescript/tests/
      verification_required: true
      app_type: typescript
      notes: |-
        Tier: T2 (compound — implementation work; size depends on tp1 findings).

        If tp1 finds zero "Stage 1 + missing" rows (i.e. the TS port
        already covers the documented Stage 1 surface), this task
        completes with a "no gaps to close" merge-back and is archived.

        If tp1 finds material gaps, those are scoped here. Each missing
        Stage 1 command or flag becomes a sub-deliverable; if the total
        scope exceeds 3 commands or 5 flag-level changes, this task
        SHOULD spawn a follow-up plan rather than ballooning. Use
        fold-back to escalate.

        ISP routing:
          mode: fanout-amenable (per-command independent work; clean isolation)
          verifier: smoke (each new command exercised with --help and at least one real input on a fresh repo)
          review: code review per command (does it match the Go behavior at the documented boundary level? does it write to ~/.agents/ correctly?)
          anti-scope: do NOT exceed the Phase 4 boundary. Read-only workflow surfaces are allowed; mutating workflow / KG / orchestration are NOT.
          bundle-context (if fanout): docs/TYPESCRIPT_PORT_GAP.md (from tp1), the Go source for the command being mirrored, existing TS commands as style reference, ports/typescript/tests/ for the testing pattern
          output contract: TS files for each newly-mirrored command; passing CI including the tp3 sync check; ports/typescript/README.md updated if user-facing surface changed
