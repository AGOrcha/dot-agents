      notes: 'req7. Add ''run make gate before push'' to the loop-worker self-gate/brief template; document --no-verify as forbidden (hook is reliable). Dogfoods lesson-loading: attach gates-must-be-locally-reproducible + tests-must-drive-the-production-path.'
