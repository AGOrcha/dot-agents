        - p4c-config-sync-lint
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/packages.go
        - internal/config/packages_test.go
        - commands/packages/cmd.go
        - commands/packages/install.go
        - commands/packages/update.go
        - commands/packages/list.go
        - commands/packages/publish.go
        - commands/packages/install_test.go
        - commands/root.go
      verification_required: true
      notes: |-
        Per spec §6 (pass 2) + §7 (lockfile packages section) + §13.2 (da packages subtree).

        Resolver pass-2:
        - read effective config 'packages' field from p1 snapshot
        - per ref: resolve version spec ({semver|tag|pinned:digest}) against OCI registry
        - content-addressed cache lookup by digest; on miss fetch blob
        - write resolved digest to .agentsrc.lock packages section
        - skipped if no packages declared

        CLI:
        - da packages install — install all; write lock packages section
        - da packages update [ref] — re-resolve semver ranges; write new digests
        - da packages list — show installed (resolved tag + digest + cache presence)
        - da packages publish <type> <path> — publish to declared OCI source (replaces conceptual 'da publish agent|verifier|skill|bundle')

        Per spec §11: error contract identifies which entry failed and category {transport|auth|content|schema|not_found}.

        Acceptance:
        - end-to-end test: install a fake-OCI package (digest-pinned) -> verify cache layout -> 'packages list' shows it -> 'packages update' is a no-op for pinned refs
        - semver-range package re-resolves and writes new lockfile digest on update
        - publish dry-run constructs the OCI manifest without uploading (live publish gated behind --confirm)
      app_type: go-cli
    - id: p7-v1-deprecation-warnings
      title: 'Phase 7: v1 surface deprecation warnings (post-soak)'
      status: pending
      depends_on:
        - p6-packages-pass2-cli
        - p4b-app-types-snapshot-refactor
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/agentsrc.go
        - internal/config/migrate.go
        - internal/config/migrate_test.go
        - commands/init.go
        - commands/doctor.go
      verification_required: true
      notes: |-
        Per spec §15.3 (deprecation cadence). NOT for the same release as p0; soak v2 for at least one minor cycle first.

        Behaviors:
        - LoadAgentsRC: if version=1 detected, emit one-time deprecation notice (to stderr) recommending 'da config migrate' to v2
        - new 'da config migrate' subcommand: converts v1 to v2 in-place
          - 'sources: [{type: local}, {type: git, url, ref}]' -> rewrites to v2 source-id'd form
          - adds repo_id auto-derived from git remote
          - adds extends: [] (empty, opt-in)
          - bumps version: 1 -> 2
          - idempotent; --dry-run prints diff
        - 'da doctor' WARN if v1 .agentsrc.json detected
        - 'da init' on a fresh repo writes v2 by default

        DO NOT remove v1 loading code in this phase. Final removal is a separate plan after a documented soak window.

        Acceptance:
        - migrate on a real-shape v1 fixture (the project's own .agentsrc.json shape pre-migration) produces a valid v2 file that re-loads identically (semantic equivalence)
        - migrate --dry-run prints unified diff
        - existing v1 file continues to load (with warning)

        Open question for the user: how long is the soak window? Recommended: 2 minor releases. Document in §5 of dependency-map proposal.
      app_type: go-cli
