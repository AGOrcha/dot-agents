schema_version: 1
plan_id: config-v2-migration
tasks:
    - id: p0-schema-additive-extension
      title: 'Phase 0: additive v2 schema extension (preserves v1 compat)'
      status: completed
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/agentsrc.go
        - internal/config/agentsrc_test.go
        - internal/config/schema_roundtrip_test.go
        - schemas/agentsrc.schema.json
        - internal/config/testdata/
      verification_required: true
      notes: |-
        Per spec config-distribution-model/design.md §3-§5 and §15.2 of org-config-resolution:

        Add v2 fields ADDITIVELY; keep v1 loadable:
        - Source: add id, cache_ttl, auth (opaque); expand type enum to local|git|http|oci
        - AgentsRC: add Extends []LayerRef, Packages []PackageRef, RepoID string, Features map[string]string
        - Bump schema version to support both 1 and 2 (do NOT remove version 1)
        - Tier constraint validation at schema time: extends must reference git|http|local; packages must reference oci|http

        Acceptance:
        - internal/config/testdata/v1/.agentsrc.json (current shape) loads unchanged
        - internal/config/testdata/v2/.agentsrc.json (extends+packages+repo_id) loads and validates
        - agentsRCKnown updated with new keys (per [[schema-usage]] four-place rule)
        - agentsrc.schema.json: add Source.id, Source.cache_ttl; add http+oci to type enum; add extends, packages, repo_id, features as new top-level optional props
        - additionalProperties: false on nested objects to catch drift
        - No new CLI behavior — schema/struct only

        Verification: go test ./internal/config/... -run 'TestAgentsRC|TestSchema' must pass on both v1 and v2 fixtures.
      app_type: go-cli
    - id: p0b-repo-id-bootstrap
      title: 'Phase 0b: repo_id field + da init auto-populate from git remote'
      status: completed
      depends_on:
        - p0-schema-additive-extension
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/agentsrc.go
        - commands/init.go
        - commands/init_test.go
      verification_required: true
      notes: |-
        Per org-config-resolution §5 (repo identity model):

        - AgentsRC.RepoID field landed in p0; here we wire bootstrap.
        - da init derives RepoID from 'git -C <repo> remote get-url origin' via normalization:
          - github.com/<org>/<repo>, gitlab.acme.internal/<group>/<repo>, etc.
          - strip .git suffix; lowercase host
        - If no git remote (or detached), RepoID stays empty and da doctor warns
        - RepoID is the protected field per spec §3 (cannot be overridden by imported layers); enforced in p1 resolver, not here.

        Acceptance:
        - new repo via 'da init' in a git checkout writes repo_id automatically
        - existing v1 .agentsrc.json without repo_id is preserved unchanged on subsequent saves (round-trip preserves omitempty)
        - normalization unit test covers github/gitlab/ssh/https forms

        No resolver behavior change yet.
      app_type: go-cli
    - id: p1-resolver-core-flat
      title: 'Phase 1: effective-config snapshot API (flat scope first)'
      status: completed
      depends_on:
        - p0-schema-additive-extension
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/snapshot.go
        - internal/config/snapshot_test.go
        - internal/config/resolver.go
        - internal/config/resolver_test.go
      verification_required: true
      notes: |-
        Per spec §6 (two-pass resolution) — but FLAT first (no network/git fetch). Foundation for p2+.

        Introduce internal/config/snapshot.go with a Resolver interface that produces:
          type Snapshot struct {
            Effective AgentsRC
            Provenance map[string]FieldProvenance   // field-path -> winning layer + full layer stack
            Layers []ResolvedLayer
          }
          type FieldProvenance struct {
            ActiveLayer string
            Layers []LayerValue   // ordered by precedence
          }

        Initial Resolver impl: FlatResolver
        - inputs: product defaults (built-in), user-local ~/.agents/agentsrc.json (if exists), repo-local .agentsrc.json
        - pass-1 walks these three sources only (no extends fetch yet)
        - emits provenance per the layer model in org-config-resolution §4

        Why now: per codex examination §6 Phase-4 task config-snapshot-api, and per [[additive-state-fields]] (use []T{} not nil, pointer for distinguishable absence). This unblocks 'da config explain' (p4) and 'workflow app-types' refactor without waiting on tier-1 fetching.

        Acceptance:
        - snapshot for a field returns full layer stack with one ActiveLayer
        - merge category rules per spec org-config-resolution §7.2 (scalar last-writer, set-union, map-merge, ordered-replace) covered by table-driven tests
        - Protected fields (repo_id, project) honored: an attempt to override emits a non-fatal warning event in a returned []ProvenanceWarning

        NO command surface change in this task — pure API + tests.
      app_type: go-cli
    - id: p1b-resolver-extends-tier1
      title: 'Phase 1b: resolver tier-1 extends (git+http+local layer fetch)'
      status: completed
      depends_on:
        - p1-resolver-core-flat
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/resolver.go
        - internal/config/resolver_test.go
        - internal/config/fetcher.go
        - internal/config/fetcher_test.go
        - internal/config/layer_schema.go
      verification_required: true
      notes: |-
        Per spec §6 (pass 1) + §7 (lockfile config section) + §8 (tier-1 caching).

        Extend FlatResolver into LayeredResolver:
        - pass-1 walks: product defaults -> user-local -> extends[] (left-to-right) -> repo-local -> plan/task/runtime overrides
        - fetcher: git (clone/fetch to ~/.cache/dot-agents/sources/<sha>/...), http (GET layer.json), local (direct path)
        - ref-syntax parse: 'source-id:layer-path[@version]' per spec §5
        - tier-constraint check at resolve time: extends entry referencing oci source -> fail with config.import.failed reason=schema
        - layer schema validation against AgentsRC layer schema (subset of full schema; layers cannot set repo_id/project)
        - optional entries supported per spec §11 ({\"ref\":\"...\",\"optional\":true}) — skipped with warning on fetch failure

        Lockfile config section (also in this task — keep cohesive):
        - write .agentsrc.lock with resolved layers: {resolved_sha, fetched_at, ttl_expires_at} per spec §7
        - caching: content-addressed by SHA under ~/.agents/cache/config/<source-id>/<layer-path>/<sha>/layer.json
        - TTL-based re-check (not eviction) per spec §8
        - offline behavior: use last resolved SHA from lockfile; emit cache_hit_offline warning

        Acceptance:
        - test fixture: local source with two layer files (org/base.json + team/frontend.json) resolves end-to-end
        - a third git source fetch is mocked (interface seam) — no live network in tests; cover via fakeFetcher
        - lockfile round-trip preserves both sections (config + empty packages stub)
        - protected-field violation on imported layer is dropped + warning surfaced
        - 'config explain' (still not wired) can be sanity-called from a test as the snapshot API consumer

        Per [[validate-bundle-against-head]]: confirm internal/config/snapshot.go (from p1) exists at HEAD before authoring tests that import it.
      app_type: go-cli
    - id: p2-lockfile-doctor-status
      title: 'Phase 2: lockfile drift surfaces (da doctor + da status)'
      status: completed
      depends_on:
        - p1b-resolver-extends-tier1
      blocks: []
      owner: dot-agents
      write_scope:
        - commands/doctor.go
        - commands/doctor_test.go
        - commands/status.go
        - commands/status_test.go
      verification_required: true
      notes: |-
        Per spec §13.4 (health surfaces).

        da doctor additions:
        - WARN if any layer's TTL has expired and 'da config sync' has not been run since
        - ERROR if .agentsrc.json declares a layer or package not present in .agentsrc.lock (drift detector)
        - WARN on any non-fatal config.field.protection_violation events from the last resolution

        da status additions:
        - show each declared layer with resolved SHA and TTL expiry
        - show each declared package with resolved tag + digest + cache presence

        NO new resolver behavior; this consumes the snapshot+lock from p1b.

        Acceptance:
        - doctor fixture with stale lock fails with actionable error pointing at 'da config sync'
        - status output deterministic + golden-file test
        - existing v1 (no lock file) is a no-op (legacy path unchanged)
      app_type: go-cli
    - id: p3-audit-events
      title: 'Phase 3: audit event taxonomy (config.* events)'
      status: completed
      depends_on:
        - p1b-resolver-extends-tier1
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/config/audit.go
        - internal/config/audit_test.go
        - internal/config/resolver.go
      verification_required: true
      notes: |-
        Per spec §9 (audit event taxonomy).

        Emit structured audit events from the resolver:
        - config.source.fetch (source_id; resolved_sha; cache_hit bool)
        - config.layer.resolve (source_id:layer_path; field_count; sha)
        - config.field.overridden (field_path; from_layer; to_layer; value_summary)
        - config.field.protection_violation (field_path; attempted_by_layer; outcome=dropped)
        - config.import.failed (source_id:layer_path; reason ∈ {transport,auth,content,schema,not_found})
        - config.effective.produced (repo_id; layer_count; package_count; trace_id)

        Base schema per external-agent-sources §8: {timestamp, actor, principal, action, target, outcome, trace_id}.

        Sink: log line under .agents/active/audit/config-YYYY-MM-DD.jsonl (rotation per day; not in this task). Pluggable Sink interface so r2-observability-dashboard can consume later.

        Acceptance:
        - table-driven test asserting one fetch+resolve+effective.produced per resolver call
        - protection-violation emitted exactly once per dropped field
        - trace_id correlates events within a single resolution

        No CLI change. Wires from p1b resolver.
      app_type: go-cli
    - id: p4-config-explain-cli
      title: 'Phase 4: da config explain command + da config subtree'
      status: in_progress
      depends_on:
        - p1-resolver-core-flat
      blocks: []
      owner: dot-agents
      write_scope:
        - commands/root.go
        - commands/config/cmd.go
        - commands/config/explain.go
        - commands/config/explain_test.go
      verification_required: true
      notes: |-
        Per spec §10 + proposal config-explain-live-surface.md.

        Net-new 'da config' subtree (no existing surface to migrate per codex examination §2.2).
        - commands/root.go: register NewConfigCmd()
        - commands/config/cmd.go: cobra parent
        - commands/config/explain.go:
          - 'da config explain [field-path]' default human-readable per spec §10 example
          - --all: full effective config annotated by winning layer
          - --flags: feature flag resolution view
          - --value-only: just the value
          - --origin-only: just the winning layer id
          - --json: machine-readable {field, value, active_layer, layers[]}
          - field-path syntax: dot-separated (e.g. app_type_verifier_map.go-cli)

        Exit codes per spec §10: 0 success, 1 layer fetch failure, 2 schema validation, 3 auth failure.

        Consumes snapshot API from p1; works on flat scope without needing p1b (degrades gracefully when no extends).

        Per spec §10 'Resolved execution manifest visibility' addendum: explain output for app_type (json mode) MUST include {selected_profile_ref, resolved_version, content_digest, composition_expansion, verifier_chain[], review_kind, graph_adapter, stage_agents, reviewer_lenses, overlays, execution_mode, return_gate_policy} when those fields exist in the effective config. If not present, omit gracefully — do not invent.

        Acceptance:
        - explain output matches spec §10 example for both single-field and --all
        - --json schema documented inline (godoc on the output struct)
        - consumed by tests via 'go test ./commands/config/...'
        - one bash smoke test under tests/test-config-explain.sh covering --value-only piped to a follow-on command
      app_type: go-cli
    - id: p4b-app-types-snapshot-refactor
      title: 'Phase 4b: refactor workflow app-types to consume snapshot API'
      status: completed
      depends_on:
        - p4-config-explain-cli
      blocks: []
      owner: dot-agents
      write_scope:
        - commands/workflow/app_types.go
        - commands/workflow/app_types_test.go
      verification_required: true
      notes: |-
        Per codex examination §2.2 task #3 and proposal config-explain-live-surface.md 'Phase 3'.

        'workflow app-types' currently reads .agentsrc.json directly. Refactor to consume the snapshot API from p1 so layered (extended) repos report layered app types.

        User-facing contract MUST be preserved: same flag surface, same output unless --verbose, same exit codes. This is a load-bearing pre-requisite for future scope-routed da review and staged-dispatch consumers reading the same snapshot.

        Acceptance:
        - snapshot-tests confirm identical output for a flat-only fixture (no extends)
        - new fixture with synthetic extends layer adds an inherited app_type and 'app-types --verbose' shows winning layer
        - existing app_types_test.go cases remain green

        Cross-link: spec config-distribution-model §10 'one effective-config snapshot API' requirement.
      app_type: go-cli
    - id: p4c-config-sync-lint
      title: 'Phase 4c: da config sync + da config lint + da config verify commands'
      status: in_progress
      depends_on:
        - p4-config-explain-cli
        - p1b-resolver-extends-tier1
        - p2-lockfile-doctor-status
