        Q3 ruling: 1-day v1 sunset paired with auto-migrator. After p7 ships deprecation warnings, this phase ships:

        1. Auto-detection: on `.agentsrc.json` load, if v1 schema detected (no extends/packages/repo_id, flat prompt_files), trigger migration
        2. Migration logic: produce v2-schema-shaped .agentsrc.json + .agentsrc.json.v1.bak sidecar
