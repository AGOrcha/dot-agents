        4. User-visible: clear log line "migrating v1 .agentsrc.json to v2 (backup at .v1.bak)"
        5. Idempotent: running on already-v2 file is a no-op

        After this phase ships + the 1-day sunset window passes, v1 loading is REMOVED entirely (becomes a separate small PR after p7b proves the migrator covers).

        Landed: `da config migrate` (opt-in v1→v2; v1.bak backup; folds legacy keys into
        stage_profiles/execution_profile; idempotent; --dry-run) merged to master via PR #138
        (2026-06-25) and shipped in the 0.4.1 release (#154, CHANGELOG ## [0.4.1] - 2026-06-24).
        Implemented as the OPT-IN migrator with a 2-release soak (NOT a 1-day forced sunset — the
        title is historical); v1 loading still works with a deprecation warning and is removed in a
        later release. commands/config/migrate.go + internal/config/migrate.go.
