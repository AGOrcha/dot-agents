schema_version: 1
id: config-v2-migration
title: v1->v2 config-distribution-model migration
status: active
summary: 'Materialize the unified config-distribution model defined in workflow/specs/config-distribution-model (the §15 units model supersedes the original §1-§2 two-tier config/packages framing) and org-config-resolution. Phased: additive schema -> Tier-1 resolver -> unified units lockfile (inputs_digest) -> audit -> da config explain -> units-lock wiring + command reshape (--scope/--source CRUD, no parallel da packages tree) -> deprecate v1. Owns the v2 substrate that config explain, agent-context-resolution, scope-routed da review, and staged-profile-dispatch consumers depend on. NOTE: the old Tier-2 packages CLI work (p6) is cancelled and folded into config-v2-coherence/ce; da install repurpose (p4d) is deferred to a separate plan (see §15 D3/D8).'
created_at: "2026-05-27T15:39:21Z"
updated_at: "2026-06-22T20:47:40Z"
owner: dot-agents
success_criteria: (1) .agentsrc.json validates against the v2 schema (sources id+cache_ttl+http+oci, extends, packages, repo_id, version=2); (2) the resolver produces an effective-config snapshot with per-field provenance, resolving layers to a fixpoint first then the declared artifact set as dependency ORDER (not a tier wall, per §15 D3); (3) .agentsrc.lock carries ONE units section keyed by source:path@version with a per-unit kind (layer|artifact) plus a top-level inputs_digest (§15 D3/D4/D7, supersedes the old config+packages two-section lock); (4) da config explain reports effective value + winning layer + full stack for any field path and auto-locks; (5) v1 .agentsrc.json files load without modification (backward-compat shim); (6) downstream consumers (workflow app-types, da config explain) consume the shared snapshot API; (7) audit events config.source.fetch / config.layer.resolve / config.field.overridden emitted.
verification_strategy: 'Per-phase: focused go test ./internal/config/... ./commands/... + table-driven tests for snapshot provenance + lockfile round-trip; schema validation test under schemas/agentsrc.schema.json with v1 + v2 fixtures; bash smoke at tests/test-config-explain.sh covering --value-only, --origin-only, --json, --all; integration test resolving a synthetic two-layer extends chain from a local source; lockfile drift detected by da doctor smoke test; v1 backward-compat fixture in internal/config/testdata/v1/.agentsrc.json must load and round-trip unchanged.'
current_focus_task: 'Phase 4c: da config sync + da config lint + da config verify commands'
