summary: 'Materialize the two-tier sources/extends/packages config model defined in workflow/specs/config-distribution-model and org-config-resolution. Phased: additive schema -> Tier 1 resolver -> lockfile -> audit -> da config explain -> Tier 2 (OCI/packages) -> deprecate v1. Owns the v2 substrate that PR-C (config explain), agent-context-resolution, scope-routed da review, and staged-profile-dispatch consumers will depend on.'
created_at: "2026-05-27T15:39:21Z"
updated_at: "2026-06-02T17:41:06Z"
owner: dot-agents
success_criteria: (1) .agentsrc.json validates against v2 schema with sources(id+cache_ttl+http+oci), extends, packages, repo_id, version=2; (2) two-pass resolver (pass 1 layers, pass 2 packages) produces an effective config snapshot with per-field provenance; (3) .agentsrc.lock written with config and packages sections; (4) da config explain reports effective value + winning layer + full stack for any field path; (5) v1 .agentsrc.json files load without modification (backward-compat shim); (6) downstream consumers (workflow app-types, da config explain, PR-C) consume the shared snapshot API; (7) audit events config.source.fetch / config.layer.resolve / config.field.overridden emitted.
verification_strategy: 'Per-phase: focused go test ./internal/config/... ./commands/... + table-driven tests for snapshot provenance + lockfile round-trip; schema validation test under schemas/agentsrc.schema.json with v1 + v2 fixtures; bash smoke at tests/test-config-explain.sh covering --value-only, --origin-only, --json, --all; integration test resolving a synthetic two-layer extends chain from a local source; lockfile drift detected by da doctor smoke test; v1 backward-compat fixture in internal/config/testdata/v1/.agentsrc.json must load and round-trip unchanged.'
current_focus_task: 'Phase 1: effective-config snapshot API (flat scope first)'
