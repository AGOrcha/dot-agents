id: full-loop-orchestration-runtime
title: Full-loop OMP orchestration runtime
status: active
summary: |-
    Drive eligible tasks across all active plans through profile-resolved OMP pipelines under da slot, delegation, fold-back, and scoring contracts.
    - (fb:minimal-repair-freeze-validated-regions) Minimal-repair re-entry — the Atomic Task Graph paper (arXiv 2607.01942, research Part L.3) repairs only the affected subgraph on failure and leaves validated regions frozen. Our bounded fold-back/ISP re-entry re-runs a whole stage; on a single-slice fold-back it should skip re-verifying already-passing disjoint slices (composes with the L.1 Cognition finding that lead over-verification does not increase correctness). Forward-looking refinement for the runtime bounded re-entry path — no live task owns it (routing and re-entry tasks are completed). Consumer — full-loop-orchestration-runtime re-entry design. Evidence — research/articles/intuitmachine-atomic-task-graph.md and eval Part L.3.
    - (fb:cache-aware-model-routing) Cache-aware model routing — Alex Ker harness-engineering guide (research Part L.6) notes routing to a different model mid-session incurs a prompt-cache miss, so a router should prefer the warm-cache model when quality permits. Small operational refinement for our per-agent model routing (explicit-model-routing, completed). Consumer — full-loop-orchestration-runtime routing note or r-series. Evidence — research/articles/thealexker-architects-guide-harness-engineering.md and eval Part L.6. Practitioner-grade, additive.
    - (fb:bilevel-meta-loop-mechanism-generation) Bilevel meta-loop (mechanism generation) — PARKED, admission criteria sharpened by ideation-cycle cross-brain audit 2026-07-13 (evidence .agents/active/ideation/2026-07-13-research-forks/evidence/forkA-crossbrain-audit.md). The Bilevel Autoresearch paper (arXiv 2603.23420v2, eval Part M) shows an outer loop autonomously authoring+injecting new mechanisms beats parameter-tuning (~5x), carrier generalizing to skills/rules/prompts/evaluators — the dot-agents artifact model. RATIFIED decision — make NO standing routing change now (do NOT add a mechanism-over-parameter heuristic to knowledge-fold-back — preliminary evidence, would be slogan-level noise and bias triage) and keep autonomy parked. Cite the paper for DIRECTION only (mechanism-change beats parameter-change as a research hypothesis), never as a production rule (n=3, one benchmark, one bilevel step). CORRECTION from the audit — skill-architect + da review is structural + human validation, NOT a runtime safety envelope. Admission criteria to reconsider autonomous generation — (1) replicated cross-task evidence beyond the paper's n=3 single-benchmark result, AND (2) a real runtime envelope, namely fail-closed transactional promotion with automatic rollback (isolate candidate, preserve prior mechanism, failed validation cannot silently mutate active state) PLUS provenance of machine-authored mechanisms PLUS bounded canary/blast-radius. No wave decision reopened.
    - (fb:bakaus-adversarial-weave-blind) Bakaus Dark-Arts #1 — adversarial review parent should WEAVE lens findings not concatenate, and lenses stay blind to each other (feeding one lens output into another skews both ways). Add a Codex fallback — if a lens cannot spawn a sub-agent (Codex without parallel permission) STOP and ask the user. Sharpens the cross-harness-adversarial gate + reviewer.base parent-synthesis. Source research/articles/pbakaus-dark-arts-skill-engineering.md
