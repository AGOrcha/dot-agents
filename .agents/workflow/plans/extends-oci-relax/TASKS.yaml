      notes: |-
        Per D13. SelectFetcher (fetcher.go) returns an OCI LAYER fetcher for "oci" instead of the rejection. New
        ociLayerFetcher implements the Fetcher interface (Fetch/FetchRefresh -> FetchedLayer): reuse the existing OCI
