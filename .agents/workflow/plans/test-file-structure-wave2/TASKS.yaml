tasks:
  - id: w2-harden-migrator
    title: 'Harden the AST migrator: //go:build + internal/external test pkg'
    status: pending
    depends_on: []
    blocks:
      - w2-graphstore
      - w2-master-owned
    owner: dot-agents
    write_scope:
      - .agents/workflow/plans/test-file-structure/migrate_ast.go
    verification_required: true
    notes: |-
      The wave-1 migrator strips the file header (where //go:build lives)
      and assumes a single package clause. Two gaps to close before any
      further folds:
      1. Preserve build constraints — a moved decl must land in a file
         whose //go:build matches its origin; refuse/segregate otherwise.
      2. Internal vs external test packages — some _extra files are
         `package <p>_test` while the mirror is `package <p>` (or vice
         versa). Moving across that boundary changes symbol visibility;
         the mover must match the destination's package clause or skip.
      Add a dry-run conformance check that aborts on mismatch.
