        audTag + policies + the bound-token model; the retention behavior is exercised against the
        o3 config.
    - id: o12-obs-verify-close
      title: End-to-end live smoke (incl. per-project routing) + close the plan
      status: pending
      depends_on:
        - o5-obs-ingest-do-d1
        - o6-obs-auth-gate
        - o7-obs-dashboard-frontend
        - o9-workflow-push-hook
        - o10-obs-historical-backfill
        - o11-obs-cf-access-iac-hardening
      blocks: []
      verification_required: true
      write_scope:
        - .agents/history/obs-dashboard-cf-deploy/
      notes: |-
        End-to-end LIVE proof against the deployed (Access-protected) obs Worker: `da observability
        sync` through the real bound CF Access service token -> events land in DO+D1; the authed
        REAL SPA shows a live update < 2s; fail-closed auth (no assertion -> 401, wrong aud ->
