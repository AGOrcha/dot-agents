success_criteria: obs.agorcha.dev serves the dashboard behind CF Access; POST /api/ingest accepts CLI service-token pushes into DO+D1 and dedupes; da observability login/sync/status work; live events reach the UI via WebSocket; local .agents/history stays canonical.
verification_strategy: |-
  LIVE smoke against the shipped Worker, not test-files alone: `wrangler dev` (miniflare
  DO+D1) and a `wrangler deploy` PREVIEW, then curl the real endpoints and assert
  machine-checkable output - POST /api/ingest -> {accepted,deduped}; auth 401-without /
  200-with a CF Access service token; a wrong-aud JWT rejected; a WebSocket live update <2s;
  D1 dedup on re-POST; local-canonical rebuild (wipe remote + `da observability sync --full`).
  go test for the CLI/config; the fail-closed exposure checklist (cf-worker-auth-gate). CI green.
