    - id: wt1-typed-git-iface
      title: Typed git/worktree interface (the contract callers bind to)
      status: completed
      depends_on:
        - wt0-spike-git-mechanism
      blocks:
        - wt2-worktree-registry
        - wt4-index-isolation
      owner: dot-agents
      write_scope:
        - internal/gitwt/
      verification_required: true
      notes: |-
        One typed Go interface: worktree create/list/remove/prune, branch
        ops, base-ref record/read, index/status/commit. Implementation
        behind it per the wt0 decision. Callers/skills bind to the
        interface only (so a later mechanism swap is invisible).
        RECONFIRMED 2026-07-10 (refresh-ideate-worktree-platform): genuinely
        shipped, not stale-vs-reality — internal/gitwt/{gitwt.go,gogit.go}
        exist, `go build ./internal/gitwt/...` is clean, PR #181 is a real
        merge commit dated 2026-05-29, and gitwt_test.go carries 14 tests
        incl. TestAddBranch/TestAddBranchErrors/TestAddDetached/TestList/
        TestRemove/TestPrune/TestBaseRefRecordRead/TestIndexIsolation. The
        shipped Manager already includes Prune()+RecordBaseRef()/BaseRef() —
        richer than the design doc's original "seam for wt1" sketch — which
        shrinks wt2's remaining scope (base-ref storage is NOT wt2's job;
        rich metadata + staleness policy is). One live consumer exists:
        internal/eval/sandbox (R4 eval-harness, separate plan, already
        merged) — see wt2 notes for what to reconcile with it.
    - id: wt2-worktree-registry
      title: Rich worktree metadata registry + auto-prune-if-unchanged (layered on wt1's Prune/BaseRef)
      status: pending
      depends_on:
        - wt1-typed-git-iface
      blocks:
        - wt3-subbranch-mergeback
      owner: dot-agents
      write_scope:
        - internal/gitwt/registry.go
        - internal/gitwt/registry_test.go
      verification_required: true
      notes: |-
        GROOMED 2026-07-10. Scope shrank from the original sketch: wt1
        already ships RecordBaseRef/BaseRef (persisted under
        .git/worktrees/<name>/base-ref) and Prune() (admin-metadata cleanup
        for worktrees whose dir is already gone from disk). wt2 adds ONLY:
        (1) a per-worktree metadata sidecar — purpose, parent PR, created-at,
        last-used — keyed by worktree name so it reconciles 1:1 with
        Manager.List() (per wt0 Residual 3); persist it under the same
        .git/worktrees/<name>/ admin dir as the base-ref file (visible from
        the MAIN repo regardless of which worktree a process is currently
        in — required by the `worktree-isolation-defeats-status-tracking`
        lesson: a registry only the linked worktree itself can read is
        useless to an orchestrator scanning from the main checkout).
        (2) auto-prune-if-unchanged: a NEW staleness check — current branch
        tip via Worktree.Head()/Branch() vs the wt1-recorded BaseRef — that
        Prune() does not do (Prune only checks "dir gone", not "no commits
        since base"). Policy: (no commits past base) AND (idle past a
        last-used TTL) => eligible for prune; commits past base are NEVER
        auto-pruned even if idle (that's abandoned work, not idle work —
        surface it, don't delete it).
        Reference implementations to mine (do not re-invent from scratch):
        swarm-cd's TTL/last-used-marker scan (mined for wt0) AND
        internal/eval/sandbox's marker.go pattern (sandbox.yaml sidecar +
        PruneStale, merged separately, already live) — eval/sandbox
        duplicates base-ref bookkeeping itself today because wt2 doesn't
        exist yet; note the follow-up (separate task, NOT in this scope) to
        move it onto this registry instead of two parallel schemes.
        Acceptance: registry create/read/update round-trip keyed on name;
        List()-registry reconciliation test (registry entry for a name
        gitwt.List() no longer returns is detected, not silently kept);
        prune-if-unchanged test matrix — (unchanged, expired) => pruned,
        (changed, expired) => kept, (unchanged, fresh) => kept.
    - id: wt3-subbranch-mergeback
      title: 'da worktree create/merge-back CLI: sub-branch -> merge-back/rebase using the recorded base'
      status: pending
      depends_on:
        - wt2-worktree-registry
      blocks:
        - wt5-skills-integration
      owner: dot-agents
      write_scope:
        - internal/gitwt/mergeback.go
        - commands/worktree/
        - commands/root.go
      verification_required: true
      notes: |-
        GROOMED 2026-07-10. First-class create-sub-branch (wraps
        gitwt.AddBranch) and merge-back/rebase that read the base EXCLUSIVELY
        from wt2's registry (via wt1's BaseRef) — never re-derive via git
        merge-base (kills the recurring bad-boundary trap this whole plan
        exists to fix). New `commands/worktree/` package (matches sibling
        subsystem convention: commands/workflow/, commands/kg/,
        commands/eval/ — each gets its own NewCmd() wired into
        commands/root.go's root.AddCommand(...) block); no existing
        commands/worktree/ dir today (verified: does not exist).
        Regression test: a force-pushed parent + a deliberate stale-base
        scenario must be caught/handled (the recurring trap this kills).
        Also honor the `parallel-worker-branch-drift` lesson: after
        merge-back, verify the worktree's branch HEAD still matches the
        expected commit (a pre-commit hook stash/restore can silently land
        a commit on a sibling worktree's branch) — fail loud, don't assume.
    - id: wt4-index-isolation
      title: Concurrent-agent index isolation proof + formal done-criterion close (residual after wt1)
      status: pending
      depends_on:
        - wt1-typed-git-iface
      blocks:
        - wt5-skills-integration
      owner: dot-agents
      write_scope:
        - internal/gitwt/index_isolation_concurrent_test.go
      verification_required: true
      notes: |-
        GROOMED 2026-07-10 — scope shrank sharply. wt1's
        TestIndexIsolation (gitwt_test.go) already proves the core
        guarantee: a commit in worktree A never appears in worktree B's or
        the main repo's status, and only A's branch advances. That test is
        SEQUENTIAL, not concurrent. The genuine residual here is a real
        concurrent test — N goroutines, each opening its own linked
        worktree and writing/staging/committing in parallel — run under
        `go test -race`, formalized as this plan's done-criterion ("per-
        worktree index proven isolated, concurrent agents cannot
        cross-stage"). NOT a from-scratch build.
        Consumer correction: workflow-commit-command already shipped
        (status: completed) WITHOUT this — it solved the shared-index race
        with scoped path-set derivation inside the single main index, not
        physical worktree isolation (see design.md Relationships,
        reconciled 2026-07-10). So this no longer literally unblocks that
        plan. Its real consumers are wt5-skills-integration and,
        transitively, any worker-bundle-authoring commit-2-cli-scoped-mode
        caller that ends up running inside a linked worktree.
