schema_version: 1
plan_id: worktree-platform
tasks:
  - id: wt0-spike-git-mechanism
    title: 'Spike: VERIFY go-git v6 x/plumbing/worktree (+ mine swarm-cd)'
    status: pending
    depends_on: []
    blocks:
      - wt1-typed-git-iface
    owner: dot-agents
    write_scope:
      - .agents/workflow/specs/worktree-platform/design.md
    verification_required: true
    notes: |-
      Decision A (pure go-git v6) CONFIRMED feasible: payout/swarm-cd
      swarmcd/worktree.go is a working pure-go-git-v6 linked-worktree
      manager (go-git/v6 + x/plumbing/worktree, zero shell-git) — see
      the Reference implementation section in design.md; adopt that
      pattern (gitworktree.New(Storer) -> mgr.Add/Remove/Open, typed
      errors, TTL stale-cleanup helpers). Spike is now narrow + bounded,
      VERIFY-only residuals: (1) branch-mode worktree create/branch
      creation (swarm-cd uses detached-HEAD+commit; we need branches
      for sub-branch->merge-back); (2) per-worktree index isolation via
      mgr.Open(...).Worktree() (the workflow-commit-command guarantee);
      (3) List support vs enumerate-via-our-registry; (4) pin the go-git
      v6 pseudo-version. Hybrid fallback only if a residual disproves.
      Still GATES the plan but materially de-risked.
  - id: wt1-typed-git-iface
    title: 'Typed git/worktree interface (the contract callers bind to)'
    status: pending
    depends_on:
      - wt0-spike-git-mechanism
    blocks:
      - wt2-worktree-registry
      - wt4-index-isolation
    owner: dot-agents
    write_scope:
      - internal/gitwt/
    verification_required: true
    notes: |-
      One typed Go interface: worktree create/list/remove/prune, branch
      ops, base-ref record/read, index/status/commit. Implementation
      behind it per the wt0 decision. Callers/skills bind to the
      interface only (so a later mechanism swap is invisible).
  - id: wt2-worktree-registry
    title: 'Managed registry + deterministic prune-if-unchanged'
    status: pending
    depends_on:
      - wt1-typed-git-iface
    blocks:
      - wt3-subbranch-mergeback
    owner: dot-agents
    write_scope:
      - internal/gitwt/
    verification_required: true
    notes: |-
      Registry record per worktree: branch, TRUE base ref, parent PR,
      purpose, created-at. Deterministic cleanup mirroring the harness
      isolation:worktree auto-prune-if-unchanged. Registry is the
      single source of truth for a worktree's base.
  - id: wt3-subbranch-mergeback
    title: 'Sub-branch -> merge-back/rebase using the recorded base'
    status: pending
    depends_on:
      - wt2-worktree-registry
    blocks:
      - wt5-skills-integration
    owner: dot-agents
    write_scope:
      - internal/gitwt/
      - commands/
    verification_required: true
    notes: |-
      First-class create-sub-branch and merge-back/rebase that use the
      registry's recorded base — never re-derive via git merge-base.
      Regression test: a force-pushed parent + a deliberate stale-base
      scenario must be caught/handled (the recurring trap this kills).
  - id: wt4-index-isolation
    title: 'Per-worktree index isolation contract (unblocks workflow-commit-command)'
    status: pending
    depends_on:
      - wt1-typed-git-iface
    blocks:
      - wt5-skills-integration
    owner: dot-agents
    write_scope:
      - internal/gitwt/
    verification_required: true
    notes: |-
      Expose/prove that each managed worktree has its own index so a
      commit in one cannot stage another's tree. This is the seam the
      workflow-commit-command plan binds to (closes its adversarial
      finding #3). Concurrent-agent isolation test.
  - id: wt5-skills-integration
    title: 'delegation-lifecycle / isp / loop-worker consume the platform'
    status: pending
    depends_on:
      - wt3-subbranch-mergeback
      - wt4-index-isolation
    owner: dot-agents
    write_scope:
      - .agents/skills/
    verification_required: true
    notes: |-
      Orchestration skills create/track/merge-back delegated slices via
      the platform so isolation + recorded-base are automatic, not
      manual. No raw git in the delegation skill paths.
  - id: wt6-verify-close
    title: 'Verify done-criteria + close'
    status: pending
    depends_on:
      - wt5-skills-integration
    owner: dot-agents
    write_scope: []
    verification_required: true
    notes: |-
      All spec done-criteria: stale-base catch, concurrent-agent index
      isolation, deterministic prune, single typed interface. go
      build/test/gate green. Archive plan; notify workflow-commit-command
      its blocker (finding #3) is cleared.
  - id: release-minor
    title: 'Release: bump VERSION + finalize CHANGELOG for the worktree-platform minor'
    status: pending
    depends_on:
      - wt0-spike-git-mechanism
      - wt1-typed-git-iface
      - wt2-worktree-registry
      - wt3-subbranch-mergeback
      - wt4-index-isolation
      - wt5-skills-integration
      - wt6-verify-close
    blocks: []
    owner: dot-agents
    write_scope:
      - VERSION
      - CHANGELOG.md
    verification_required: true
    notes: |-
      Release-gated tail task (hybrid convention, MINOR path). This plan
      delivers a new user-visible capability — a managed git worktree +
      sub-branch/merge-back lifecycle (the typed gitwt layer plus
      delegation-lifecycle/isp/loop-worker integration). Although much of
      it is internal (internal/gitwt/), it ships a new managed-worktree
      capability consumed through the orchestration skills, so it is a
      MINOR not MAJOR (no public surface removed or incompatibly changed).
      Ambiguity flag: if the maintainer judges this as purely internal
      plumbing with no agent-facing capability change, it instead feeds the
      patch train (drop this tail). Left as MINOR because it changes how
      delegated work is isolated/committed — observable behavior.
      Target version = next minor computed from current VERSION at
      ready-time (do NOT hardcode). With VERSION at 0.3.2 today the next
      minor is 0.4.0, but resolve from VERSION when ready; serialize at the
      VERSION bump if another minor ships first.
      Action: bump VERSION to the resolved next minor and finalize the
      CHANGELOG "## [<target>]" section. Merge to master fires
      auto-release.yml.
    app_type: release
