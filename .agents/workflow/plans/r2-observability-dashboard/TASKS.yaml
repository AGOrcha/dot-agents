    - id: t13-r3-mount-integration
      title: Replace fswatch primary with R3 publish primitive; mount handlers in R3 service
      status: pending
      depends_on:
        - t03-handlers-rest
        - t05-sse-handler
        - t06-recompute-on-miss-and-fswatch
      blocks:
        - t14-documentation
      owner: dot-agents
      write_scope:
