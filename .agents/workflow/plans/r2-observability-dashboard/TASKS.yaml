  verification_required: true
  notes: "Implements design.md Q2: read directly from\n.agents/active/iteration-log/ + iter-N.score.yaml\
    \ +\nsession-*.score.yaml sidecars, with a small in-process LRU\ncache (size 256, TTL 30s, exposed\
    \ metrics).\n\nStore interface (sketch):\n  type Store interface {\n    ListRuns(ctx, filter) ([]RunSummary,\
    \ error)\n    GetRun(ctx, sessionID) (RunDetail, error)\n    ListIterations(ctx, sessionID) ([]IterationSummary,\
    \ error)\n    GetIteration(ctx, iter int) (IterationDetail, error)\n    Rubric(ctx) (RubricDoc, error)\n\
    \  }\n\nUses internal/scoring.LoadIterationLog for the iter-log walk\nand a sidecar glob + YAML decode\
    \ for scores. Wraps disk reads\nin a sync.Mutex-protected LRU keyed by (root, sessionID|iter).\nCache\
    \ invalidation on iter-log mtime change; the broker (t04)\nalso evicts on push events.\nAnti-scope:\
    \ no writes, no recompute (t06 owns recompute)."
  app_type: go-cli
