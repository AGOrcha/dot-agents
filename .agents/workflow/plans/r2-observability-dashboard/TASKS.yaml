- id: t04-sse-broker
  title: Build SSE event broker (subscribe / publish / fan-out)
  status: completed
  depends_on:
  - t01-api-contract-design
  blocks:
  - t05-sse-handler
  - t13-r3-mount-integration
  owner: dot-agents
  write_scope:
  - internal/dashboard/events/
  verification_required: true
  notes: "RESCOPED 2026-07-02 (\xA72A coherence): the cross-plan contract\nis r3's \xA7D4.1 EventBus INTERFACE\
    \ \u2014\n  Publish(topic string, payload any) error\n  Subscribe(topic string) (<-chan Event, func(),\
    \ error)\n  Close() error\n(r3 task event-bus-interface-seam) \u2014 bind to it, never to the\nconcrete\
    \ *events.Bus. Assume only the \xA7D4.2 G1-G4 floor:\nat-most-once best-effort delivery, best-effort\
    \ per-topic\norder, bounded-buffer drop-oldest (publishers never block),\nno cross-publish atomicity.\
    \ The bus backend may later be\nconfig-selected (\xA7D4.4) without changing this broker. SSE\nstays\
    \ this plan's browser-push wire per the \xA72A map.\n\nTiny in-process broker. Interface:\n  type\
    \ Publisher interface { Publish(topic string, payload any) }\n  type Broker struct { ... }    // implements\
    \ Publisher\n  func (b *Broker) Subscribe(ctx) (<-chan Event, func())\n(Broker's local Publisher shape\
    \ stays minimal; the r3-facing\nseam is bridged in t13 against the EventBus interface.)\n\nFan-out:\
    \ N goroutines each holding a buffered channel; an event\narriving on a FULL channel disconnects that\
    \ subscriber immediately\n(client refetches on reconnect) \u2014 RATIFIED 2026-07-02 during t04\n\
    review: with G3 non-blocking publishers and gapless delivered\nstreams, arrival-on-full forces either\
    \ a silent gap (unsound) or a\ndisconnect; a pre-drop grace window is unsatisfiable as previously\n\
    worded. This is the OQ5 bounded-buffer disconnect-on-overflow policy.\nHeartbeat: emit a ping every\
    \ 15s.\n\nWhen R3's bus lands (t13), it replaces this broker as the\nprimary publisher; this broker\
    \ becomes a thin\nsubscriber+fanout.\n\nAnti-scope: do NOT define WHERE events come from \u2014 that\
    \ is\nR3's EventBus (via t13) and a filesystem watcher bridge (t06)."
  app_type: go-cli
