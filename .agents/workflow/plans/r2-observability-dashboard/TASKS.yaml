    - id: t02-storage-read-layer
      title: Build dashboard.Store read-through layer over iter-log + score sidecars
      status: completed
      depends_on:
        - t01-api-contract-design
      blocks:
        - t03-handlers-rest
        - t06-recompute-on-miss-and-fswatch
      owner: dot-agents
      write_scope:
        - internal/dashboard/store/
      verification_required: true
      notes: |-
        Implements design.md Q2: read directly from
        .agents/active/iteration-log/ + iter-N.score.yaml +
        session-*.score.yaml sidecars, with a small in-process LRU
        cache (size 256, TTL 30s, exposed metrics).

        Store interface (sketch):
          type Store interface {
            ListRuns(ctx, filter) ([]RunSummary, error)
            GetRun(ctx, sessionID) (RunDetail, error)
            ListIterations(ctx, sessionID) ([]IterationSummary, error)
            GetIteration(ctx, iter int) (IterationDetail, error)
            Rubric(ctx) (RubricDoc, error)
          }

        Uses internal/scoring.LoadIterationLog for the iter-log walk
        and a sidecar glob + YAML decode for scores. Wraps disk reads
        in a sync.Mutex-protected LRU keyed by (root, sessionID|iter).
        Cache invalidation on iter-log mtime change; the broker (t04)
        also evicts on push events.
        Anti-scope: no writes, no recompute (t06 owns recompute).
      app_type: go-cli
    - id: t03-handlers-rest
      title: Implement HTTP handlers for the REST API per the contract
      status: pending
      depends_on:
        - t01-api-contract-design
        - t02-storage-read-layer
      blocks:
        - t07-standalone-service-bin
        - t13-r3-mount-integration
        - t09-feature-aggregate-view
        - t10-feature-per-run-drilldown
      owner: dot-agents
      write_scope:
        - internal/dashboard/handlers/
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence): these REST handlers live
        on the HTTP/SSE browser edge — the one surface r3's §2A
        surface→transport map deliberately keeps on HTTP
        (browser-facing arm of the selection rule). When mounted in
        R3 (t13) they mount on that HTTP edge via RegisterMount,
        never on the UDS control plane. Transport is single-sourced
        in r3 spec §2A; this plan does not re-decide it.
        Pure handlers — depend on dashboard.Store and
        dashboard.Events interfaces, NOT on net/http.ServeMux or any
        router. Wiring lives in t07 / t13. Use stdlib net/http only.

        Each handler: parses query params, validates, calls Store,
        writes envelope-wrapped JSON, sets ETag from store mtime,
        emits structured log lines (slog).

        contract_test.go: golden-file response per endpoint + JSON
        Schema validation using
        github.com/santhosh-tekuri/jsonschema (already in go.mod).
        Fixture iter-log lives under handlers/testdata/.
      app_type: go-cli
    - id: t04-sse-broker
      title: Build SSE event broker (subscribe / publish / fan-out)
      status: pending
      depends_on:
        - t01-api-contract-design
      blocks:
        - t05-sse-handler
        - t13-r3-mount-integration
      owner: dot-agents
      write_scope:
        - internal/dashboard/events/
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence): the cross-plan contract
        is r3's §D4.1 EventBus INTERFACE —
          Publish(topic string, payload any) error
          Subscribe(topic string) (<-chan Event, func(), error)
          Close() error
        (r3 task event-bus-interface-seam) — bind to it, never to the
        concrete *events.Bus. Assume only the §D4.2 G1-G4 floor:
        at-most-once best-effort delivery, best-effort per-topic
        order, bounded-buffer drop-oldest (publishers never block),
        no cross-publish atomicity. The bus backend may later be
        config-selected (§D4.4) without changing this broker. SSE
        stays this plan's browser-push wire per the §2A map.

        Tiny in-process broker. Interface:
          type Publisher interface { Publish(topic string, payload any) }
          type Broker struct { ... }    // implements Publisher
          func (b *Broker) Subscribe(ctx) (<-chan Event, func())
        (Broker's local Publisher shape stays minimal; the r3-facing
        seam is bridged in t13 against the EventBus interface.)

        Fan-out: N goroutines each holding a buffered channel; full
        channel drops the slowest subscriber after 1s grace — this
        drop-slowest bounded-buffer policy is exactly G3 / r2 OQ5.
        Heartbeat: emit a ping every 15s.

        When R3's bus lands (t13), it replaces this broker as the
        primary publisher; this broker becomes a thin
        subscriber+fanout.

        Anti-scope: do NOT define WHERE events come from — that is
        R3's EventBus (via t13) and a filesystem watcher bridge (t06).
      app_type: go-cli
    - id: t05-sse-handler
      title: Wire /api/stream SSE handler to broker
      status: pending
      depends_on:
        - t03-handlers-rest
        - t04-sse-broker
      blocks:
        - t07-standalone-service-bin
