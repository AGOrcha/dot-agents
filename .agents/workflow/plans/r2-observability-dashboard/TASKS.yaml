        - internal/dashboard/server/r3mount_test.go
        - internal/dashboard/events/r3bridge.go
        - internal/dashboard/events/r3bridge_test.go
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence).
        GATED ON R3 MILESTONES. Specifically:
          - R3 task event-bus (concrete builtin, merged) AND R3 task
            event-bus-interface-seam (the §D4.1 EventBus interface)
            must merge first — the bridge binds to the INTERFACE,
            never to the concrete *events.Bus.
          - R3 task http-server — now the §2A transport-layer task
            (UDS control plane + HTTP/SSE edge) — must merge first
            for RegisterMount.

        Deliverable: a Mount(svc r3.Service, deps) function that
        registers t03's handlers under /api/ on R3's HTTP/SSE edge
        (the browser-facing arm of the §2A surface→transport map —
        NOT the UDS control plane), and bridges R3's EventBus
        interface into t04's Broker. After this task lands:
          - fswatch (t06) demotes from primary to fallback (kept for
            developers running `da score run` outside the service).
          - the standalone cmd/da-dashboard binary remains valid for
            users not running R3.

        RESOLVED (was open): "if R3's primitive ends up async/
        queue-backed" — r3 §D4.4 makes external/queue-backed backends
        config-selected adapters behind the SAME EventBus interface,
        bounded to the §D4.2 G1-G4 floor. The bridge assumes only
        G1-G4, so no Publish-signature growth is needed here or in
        t04.
      app_type: go-cli
