summary: |-
    Web dashboard (React/TS frontend + Go backend API) over session telemetry, loop-run metrics, and R1 scores. Read-through reads (no new store in v1) from .agents/active/iteration-log/ + iter-N.score.yaml sidecars; SSE push channel for sub-2-second live updates; drill-down from aggregate view to per-iteration signal breakdown and integrity observations.
    - (fb:bakaus-path-keyed-memory) Bakaus Dark-Arts #4 — path-keyed memory. Derive the snapshot and score slug from the resolved file path not the request phrasing, so a teammate pointing at the same target inherits the score trend across sessions. Check the scoring and journal keying uses resolved-path identity. Source research/articles/pbakaus-dark-arts-skill-engineering.md
    - (fb:see-it-run-verifier-evidence) Parked lead from research Part N (myprasanna great-flattening, bottleneck 4) — see-it-run E2E testing as verifier evidence. Add a browser-driven flow-proof recording artifact and a per-branch live preview URL to the verifier/iteration evidence surface ('running code isn't the bar; seeing it run is'). We have the verify + playwright skills but no recording-as-iteration-evidence discipline and no per-branch preview outside the docs site. Trigger — when r2's verifier-evidence surface lands, or the first UI-heavy app_type is onboarded via pipeline-architect. Additive, gate-neutral, no wave decision reopened. Source research/articles/myprasanna-great-flattening.md; eval research/articles-evaluation-kg-and-adjacent.md Part N.
