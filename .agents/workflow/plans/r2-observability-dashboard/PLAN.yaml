summary: |-
    Web dashboard (React/TS frontend + Go backend API) over session telemetry, loop-run metrics, and R1 scores. Read-through reads (no new store in v1) from .agents/active/iteration-log/ + iter-N.score.yaml sidecars; SSE push channel for sub-2-second live updates; drill-down from aggregate view to per-iteration signal breakdown and integrity observations.
    - (fb:bakaus-path-keyed-memory) Bakaus Dark-Arts #4 — path-keyed memory. Derive the snapshot and score slug from the resolved file path not the request phrasing, so a teammate pointing at the same target inherits the score trend across sessions. Check the scoring and journal keying uses resolved-path identity. Source research/articles/pbakaus-dark-arts-skill-engineering.md
