  harness proven at evidence/dashboard-live-smoke-baseline.md (6/6 green vs shipped
  cmd/da-dashboard). Unit/race tests, the import-guard, docs link-check, and CI stay; a task is
  DONE only when the shipped artifact demonstrably does the thing. t12 runs the full harness
  live end-to-end.
