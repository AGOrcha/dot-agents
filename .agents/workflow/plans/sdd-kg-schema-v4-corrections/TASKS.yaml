schema_version: 1
plan_id: sdd-kg-schema-v4-corrections
tasks:
    - id: g1-node-id-type-namespacing
      title: Type-prefix node ids for spec/plan/task (close plan/spec bare-id collision)
      status: pending
      depends_on: []
      blocks: []
      owner: Nikash Prakash
      write_scope:
        - .agents/workflow/specs/work-tracking-storage-abstraction/sdd-entity-kg-schema-draft.md
      verification_required: true
      notes: 'GAP 1 (dogfood, PR #179). The v4 composite-key rule covers TASK identity (task_key = plan_id + slash + task_id, draft S1.1 ~line 151-159) but NOT the plan/spec id-namespace overlap. A plan and a spec share a bare id by the dir-name convention (e.g. docs-starlight-migration exists as BOTH a plan and a spec); the DSL evaluator indexes notes by id, so a bare-id spec node and plan node overwrite each other in the id map, silently breaking type-checked edge traversal. FIX (already proven in PR #179 ingest.go specNodeID/planNodeID/taskNodeID): every graph NODE id is type-prefixed so ids are unique ACROSS types; unprefixed business keys (spec_id/plan_id/task_key) stay on FIELDS, which is what WHERE clauses match. Make this a NORMATIVE node-id rule in the draft identity section, not just the task composite-key note. Cross-ref PR #179 as grounding evidence.'
      app_type: docs
    - id: g2-on-disk-plan-spec-field
      title: Specify on-disk plan->spec linkage field (replace dir-name convention)
      status: pending
      depends_on: []
      blocks: []
      owner: Nikash Prakash
      write_scope:
        - .agents/workflow/specs/work-tracking-storage-abstraction/sdd-entity-kg-schema-draft.md
      verification_required: true
      notes: 'GAP 2 (dogfood, PR #179). plan->spec linkage today relies ONLY on the dir-name convention (plan_id == spec_id). The dogfood found 11/35 plans have NO matching spec, so plan_for_spec/implements_spec edges UNDER-LINK the real corpus (edge only fires when a same-named spec exists; see ingest.go linkedSpec). Specify a NORMATIVE on-disk field (e.g. PLAN.yaml spec_id / owning_spec) so linkage is explicit, not inference-by-dirname. Decide + document whether this is a PROPOSED field add to schemas/workflow-plan.schema.json and how the plan_for_spec derivation changes. This task is the DRAFT spec change; the on-disk schema change is a follow-up.'
      app_type: docs
    - id: g3-spec-plan-frontmatter-parse
      title: Normalize spec frontmatter Plan-line (4 formats across 9 specs)
      status: pending
      depends_on: []
      blocks: []
      owner: Nikash Prakash
      write_scope:
        - .agents/workflow/specs/work-tracking-storage-abstraction/sdd-entity-kg-schema-draft.md
      verification_required: true
      notes: 'GAP 3 (dogfood, PR #179). The spec frontmatter Plan reference is unparseable: 4 different formats appear across 9 specs. Specify a SINGLE normative frontmatter format for the spec->plan back-reference (or drop it in favor of the gap-2 forward PLAN.yaml field). Document the canonical format in the draft and enumerate the 4 current variants as the evidence ledger. Mechanical reconcile of the 9 on-disk specs is a follow-up once the format is ratified.'
      app_type: docs
    - id: g4-spec-schema-and-status-enum
      title: Spec frontmatter schema + spec_id; reconcile status enum to freeform reality
      status: pending
      depends_on: []
      blocks: []
      owner: Nikash Prakash
      write_scope:
        - .agents/workflow/specs/work-tracking-storage-abstraction/sdd-entity-kg-schema-draft.md
      verification_required: true
      notes: 'GAP 4 (dogfood, PR #179). Spec frontmatter is freeform: no spec JSON Schema, no schema-d spec_id (identity is the dir name only), and **Status:** is free text. The draft (S1.2 ~line 204-206) currently models spec.status as a CLOSED enum [draft, ratified, superseded], but ingest.go parseSpecFrontmatter shows only freeform draft is attested on disk; ratified/superseded are INVENTED. Either (a) define a spec frontmatter contract + spec_id and a real status enum and mark them PROPOSED (not on disk), or (b) keep status as freeform string and drop the closed-enum claim. Make the draft internally consistent: a v4 status enum that does not hold against the corpus is the bug. This is the highest-value gap (formalizes spec identity + the schema-v4 status contract).'
      app_type: docs
    - id: g5-depends-on-dangling-policy
      title: Document depends_on dangling/cross-plan-ref emission policy (529 edges)
      status: pending
      depends_on: []
      blocks: []
      owner: Nikash Prakash
      write_scope:
        - .agents/workflow/specs/work-tracking-storage-abstraction/sdd-entity-kg-schema-draft.md
      verification_required: true
      notes: 'GAP 5 (dogfood, PR #179). depends_on targets dangle: cross-plan and stale refs are real (529 depends_on edges over the corpus; ingest.go addDeps emits a depends_on edge whose to-node may not exist as a projected node). Document the NORMATIVE policy in the draft: a depends_on edge records a DECLARED dependency even when the target is unresolved (stale/cross-plan), vs. requiring referential integrity. Specify how a consumer distinguishes resolved vs dangling (e.g. a derived view / health query). Decide whether dangling refs are a data-quality signal worth a separate lint, and note it.'
      app_type: docs
