        ---
        Fanout briefing (2026-05-23 — orchestrator re-pickup):

        Pre-existing in_progress status carries no in-flight worker,
        no branch, no bundle; treat as a fresh spawn.

        Required reads BEFORE touching any target file:
          1. internal/testutil/testutil.go — the canonical helper API
             shipped by t2 (NewTempProjectDir, fixture seeders, etc.).
          2. .agents/history/archived-delegations/2026-05-23/t4-extract-workflow-tests.yaml
             — the immediately preceding sibling bundle (t4, PR #44
             MERGED) — same plan, same refactor pattern, same
             forbidden_scope shape, same verification commands. Mirror
             its commit-per-file rhythm.

        Worktree: create at .agents/worktrees/t5 off master (matches
        current repo convention; .claude/worktrees/ was cleaned up
        2026-05-23 and is no longer used).

        Branch: t5-extract-commands-root-tests off master. Fresh
        branch, NOT stacked on any other plan's branch.

        One-PR-in-flight: open PR after all 4 commits land on the
        branch; do not merge — user gates.

        Touch tests only — no production .go changes. If you find a
        helper in internal/testutil that would benefit from a small
        additive extension to absorb a duplicated pattern, STOP and
        report (out of write_scope; do not silently modify the
        shared package). Same rule for production code: report, do
        not fix-and-pad.
      app_type: code-fix
