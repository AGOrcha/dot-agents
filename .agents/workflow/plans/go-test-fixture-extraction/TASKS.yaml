schema_version: 1
plan_id: go-test-fixture-extraction
tasks:
    - id: t1-audit-and-helper-design
      title: Audit Cluster D fixtures; design canonical helper signatures
      status: completed
      depends_on: []
      blocks:
        - t2-create-internal-testutil
      owner: ""
      write_scope:
        - .agents/workflow/specs/go-test-fixture-extraction/design.md
      verification_required: false
      notes: |-
        Tier: T1 (research + design memo).

        Concrete deliverable: an updated design.md "Open questions"
        section with answers, plus a table of canonical helper
        signatures the rest of the plan implements against.

        Steps:
          1. Re-snapshot live Cluster D duplication
             (mcp__sonarqube__search_duplicated_files on the latest PR
             tip). Counts in design.md drift across pushes.
          2. For each file in the inventory, list every fixture
             function it defines (setupTempProject, writeFixtureRC,
             manifest writers, etc.). Group by signature.
          3. Identify cases where a per-package fixture is
             materially different (e.g. graphstore tests need a real
             SQLite/Postgres handle; workflow tests need a populated
             plan tree). These get bucket-specific helpers.
          4. Write the signature table — return values, error policy
             (t.Fatal vs returned error), TempDir ownership.

        Hard test: design.md "Open questions" section is empty;
        signature table covers every duplicated block in the live
        SonarCloud inventory.

        Anti-scope: do NOT begin extracting helpers in this task.
        Audit only. The audit may surface a need to split this plan
        further (e.g. graphstore fixture work as its own plan); raise
        via fold-back rather than expanding scope here.

        ISP routing:
          mode: direct (research + spec edit)
          verifier: doc review
          review: design quality (signatures must compose; no
                  package-cycle hazards)
          bundle-context (if fanout): findings.md Cluster D table,
                                       the 21 *_test.go files
          output contract: design.md updated with concrete signatures
      app_type: research
    - id: t2-create-internal-testutil
      title: Land internal/testutil with helpers + unit tests
      status: completed
      depends_on:
        - t1-audit-and-helper-design
      blocks:
        - t2_5-extend-internal-testutil
        - t3-extract-platform-tests
        - t4-extract-workflow-tests
        - t5-extract-commands-root-tests
        - t6-extract-graphstore-tests
        - t7-extract-skills-and-agents-tests
      owner: ""
      write_scope:
        - internal/testutil/
      verification_required: true
      notes: |-
        Tier: T2 (compound — new package + unit tests).

        Implements the helper set converged on in T1. Helpers must:
          * accept *testing.T as first arg, call t.Helper()
          * t.Fatal on prerequisite errors (matches existing style)
          * not call t.TempDir() internally (see design.md decision)
          * have go-doc on every exported function

        Unit tests cover helper logic with non-trivial branching
        (e.g. WriteAgentsRC with explicit Sources vs default).
        Helpers that are pure thin wrappers around os.WriteFile
        don't need a unit test; they're exercised by every consumer.

        Hard test: go test ./internal/testutil passes; package builds
        clean; no consumers yet (extraction starts in T3+).

        Anti-scope: do NOT modify any *_test.go in this task. Land
        the helpers; consumers come next.

        ISP routing:
          mode: direct (single-package implementation)
          verifier: smoke (go test ./internal/testutil)
          review: code review
          bundle-context (if fanout): T1's signature table
          output contract: internal/testutil exists with helpers,
                           docs, tests; importable by any *_test.go
      app_type: code-fix
    - id: t2_5-extend-internal-testutil
      title: 'Extend internal/testutil: NewTempAgentsHome + WriteScopeFilePath'
      status: pending
      depends_on:
        - t2-create-internal-testutil
      blocks:
        - t3-extract-platform-tests
        - t6-extract-graphstore-tests
      owner: ""
      write_scope:
        - internal/testutil/testutil.go
        - internal/testutil/testutil_test.go
      verification_required: true
      notes: |-
        Tier: T2 (additive helper extension).

        Two new helpers, both surfaced by t5's merge-back narrative
        (commands/refresh_test.go ×17, commands/import_test.go ×10)
        and corroborated by t7's audit
        (commands/skills/promote_test.go::TestPromoteSkillIn_Mirror...
        site). Landing these BEFORE t3 and t6 prevents those workers
        from hitting the same walls and re-surfacing the same finding
        as t5.5 candidates.

        Helper 1 — NewTempAgentsHome:

          // NewTempAgentsHome creates a t.TempDir(), sets HOME and
          // AGENTS_HOME envs (with .agents/ subdir under HOME), and
          // returns (tmp, agentsHome).
          //
          // Lighter than NewTempProject when a test needs full env-
          // var control but no project tree. Absorbs the recurring
          // 5-line preamble:
          //
          //   tmp := t.TempDir()
          //   t.Setenv("HOME", tmp)
          //   agentsHome := filepath.Join(tmp, ".agents")
          //   if err := os.MkdirAll(agentsHome, 0755); err != nil { t.Fatal(err) }
          //   t.Setenv("AGENTS_HOME", agentsHome)
          //
          // Use NewTempProject when you also need a project dir +
          // canonical agents tree; use this when you don't.
          func NewTempAgentsHome(t *testing.T) (tmp, agentsHome string)

        Helper 2 — WriteScopeFilePath:

          // WriteScopeFilePath extends WriteScopeFile to accept a
          // nested relative path under agentsHome/bucket/scope/, e.g.
          // ".github/hooks/pre-tool.json". The relative path components
          // are MkdirAll'd as needed.
          //
          // Equivalent to WriteScopeFile when relPath has no
          // separator. Unlocks the seed loop in
          // TestRestoreFromResourcesCounted_RestoresDirectoryBuckets
          // and similar nested-path call sites surfaced in t5's
          // merge-back.
          func WriteScopeFilePath(t *testing.T, agentsHome, bucket, scope, relPath string, content []byte)

        Implementation rules (per t2's design):
          * t.Helper() first
          * t.Fatal on prerequisite errors
          * GoDoc on every exported function
          * NewTempAgentsHome may call t.TempDir() internally
            (different from t2's "no t.TempDir() inside helpers"
            rule because the env-var setup wraps the temp dir; this
            is the explicit purpose of the helper)
          * No call-site migrations in this task — those happen in
            t3/t6 (which already own the affected test files)

        Hard test: go test ./internal/testutil -race -count=1 passes;
        package builds clean.

        Anti-scope: do NOT modify any consumer *_test.go in this
        task. Just land the helpers + their unit tests. t3 / t6 / a
        possible future cleanup pass consume them.

        ISP routing:
          mode: direct (single-package additive)
          verifier: smoke (go test ./internal/testutil -race -count=1)
          review: code review (small surface)
          bundle-context (if fanout): t5 merge-back
            (.agents/history/archived-delegations/2026-05-23/
            t5-pr49-orphans/t5-extract-commands-root-tests.md) for
            the exact call-site shape; t2's design doc for the
            helper-style rules.
          output contract: two new exported helpers + their unit
            tests, ready for t3/t6 consumers.
      app_type: code-fix
    - id: t3-extract-platform-tests
      title: Refactor internal/platform/*_test.go to use internal/testutil
      status: pending
      depends_on:
        - t2-create-internal-testutil
        - t2_5-extend-internal-testutil
      blocks: []
      owner: ""
      write_scope:
        - internal/platform/resource_plan_test.go
        - internal/platform/mcp_settings_test.go
        - internal/platform/rules_test.go
      verification_required: true
      notes: |-
        Tier: T2 (compound — three files; resource_plan_test.go is
        the largest single Cluster D offender at 239 dup lines).

        Refactor each test file to consume internal/testutil
        helpers in place of in-file setup/fixture-writer functions.
        Delete now-unused per-file helpers.

        Per-file commit convention (one commit each):
          * "test(platform): use internal/testutil in resource_plan_test"
          * "test(platform): use internal/testutil in mcp_settings_test"
          * "test(platform): use internal/testutil in rules_test"

        Hard test: go test ./internal/platform/ passes after each
        commit; commit-by-commit diff shows test bodies reduced
        by N lines with assertions unchanged.

        Common false positive: refactor accidentally drops an
        assertion when collapsing a per-file helper. Reviewer must
        compare assertion lists pre/post.

        Anti-scope: do NOT touch production code in this task.

        ISP routing:
          mode: fanout-amenable (one subagent per file)
          verifier: smoke (go test ./internal/platform/)
          review: code review per file
          bundle-context (if fanout): T1's signature table, T2's
                                       internal/testutil API
          output contract: ~250 dup lines removed; gate-relevant
                           density falls
      app_type: code-fix
