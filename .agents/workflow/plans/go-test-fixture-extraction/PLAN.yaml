schema_version: 1
id: go-test-fixture-extraction
title: Extract internal/testutil to clear Cluster D test-fixture duplication
status: proposed
summary: |-
    Cluster D from sonarqube-pr10/findings.md: ~1,500-1,700 duplicated
    lines across 18+ *_test.go files (Go test scaffolding —
    setupTempProject, writeFixtureRC, manifest writers, table-test
    boilerplate). Per ADR-0008 (option B) this work is deferred from
    PR#10 to a follow-up plan; this is that plan.

    Strategy: land internal/testutil with the canonical helpers, then
    refactor each Cluster D file to consume it (one commit per file
    so reviewer can bisect/revert). Touch tests only — no behavioral
    change. Must run on a fresh branch off master, NOT stacked on
    PR#10 (would add 18+ files to an already 895-file review).

    Spec: .agents/workflow/specs/go-test-fixture-extraction/design.md
    Source decision: docs/adr/0008-pr10-duplication-scope.md (option B)
    Source classification: .agents/workflow/plans/sonarqube-pr10/findings.md (Cluster D)
created_at: "2026-05-04T00:00:00Z"
updated_at: "2026-05-04T00:00:00Z"
owner: dot-agents
success_criteria: |-
    Hard test: SonarCloud quality gate on the follow-up PR reports
    new_duplicated_lines_density below 3% OR Cluster D's contribution
    is reduced by >= 60% (production-code cluster may move the gate
    independently — that is a cross-plan concern).

    Local test: go test ./... passes at every commit; per-package
    refactor commits do not change behavior, only the source location
    of fixture helpers. internal/testutil has unit tests for any
    helper with non-trivial branching.

    False positive watch: a refactored test that still passes locally
    but has lost an assertion is the most likely regression. Reviewers
    must diff old test bodies against new ones to confirm the same
    scenarios + assertions remain, not just that tests pass.
verification_strategy: |-
    Per-task: go test ./<refactored-package> + go vet on the package.
    Plan-level: at closeout, single SonarCloud snapshot of the follow-up
    PR confirms duplication-density movement and a quick CI green.

    Plan archives when the follow-up PR merges. ADR-0008 is the cross
    reference linking this plan to PR#10's waiver.
current_focus_task: T1 audit — re-snapshot live Cluster D inventory and converge helper signatures before any extraction commits land
