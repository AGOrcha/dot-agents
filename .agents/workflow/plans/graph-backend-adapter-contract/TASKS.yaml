schema_version: 1
plan_id: graph-backend-adapter-contract
tasks:
    - id: t1-none-adapter-end-to-end
      title: Built-in `none` adapter end-to-end pipeline
      status: completed
      depends_on: []
      blocks:
        - t2-compliance-read-only
        - t3-ttrpg-dogfood
        - t4-crg-dual-read
        - t7-app-type-profiles-wiring
      owner: dot-agents
      write_scope:
        - internal/adapters/builtin/none/
        - internal/kg/registry/
        - internal/kg/lockfile/
        - cmd/da/commands/kg/
      verification_required: true
      notes: |-
        COMPLETED (#136 merge wave). SHIPPED reality:
          * `none` adapter at internal/adapters/builtin/none/ (null backend)
          * Adapter registry + ref resolver (internal/kg/registry/)
          * Lockfile state machine + fail-closed reconciliation
            (internal/kg/lockfile/)
          * `da kg lockfile show` / `da kg lockfile reconcile`
            (commands/kg/lockfile.go)
          * graphstore C-Hybrid `Store` family (CodeGraphReader/Writer/
            KGNoteStore/NoteSymbolLinkStore/Closer) + Path A ephemeral/bounded
            provider; Path B daemon deferred (CONTRACT.md)

        Smallest possible adapter; exercises the whole pipeline (schema
        validation, namespace provisioning, lockfile init, query routing)
        with no real domain logic. Spec reference:
        graph-backend-adapter-contract §13.1.

        O2 resolution (token signing) folded: namespace-token integrity uses
        in-process HMAC with a per-process/per-daemon ephemeral key (N13);
        asymmetric (Ed25519) deferred to the `http`-backend milestone. The MAC
        is computed over the in-memory token (no lockfile-format change). NOTE
        vs SHIPPED: namespace-token issuance/signing is NOT yet implemented in
        internal/kg — it is design-resolved (O2) but unbuilt; the storage-layer
        namespace check (N6-N9) remains the primary capability boundary. Any
        follow-up that delivers the token path must implement HMAC per O2.

        O7 resolution (executor vs Store seam) folded: query routing goes
        THROUGH the role-segregated `Store` family (never around it); the
        executor tier (§2.7) sits above the gcc `Store` seam. See the
        executor-tier reconciliation note in graphstore-concurrency-contract.

        Hard test:
          A profile selecting `graph_backend: dotagents-builtin:graph/none@^1.0`
          resolves, lockfile registers, no-op impact_radius runs.

        Anti-scope:
          NO domain-specific logic; NO real bootstrap skill; NO real DSL
          beyond basic MATCH/RETURN.

        ISP routing:
          mode: fanout-amenable (bounded write_scope; integration tests
                clear-cut)
          verifier: integration tests
          review: code review
    - id: t2-compliance-read-only
      title: Compliance register adapter (read-only / stub bootstrap)
      status: completed
      depends_on:
        - t1-none-adapter-end-to-end
      blocks:
        - t5-cross-adapter-reads-from
      owner: dot-agents
      write_scope:
        - internal/adapters/builtin/compliance-register/
        - internal/kg/dsl/
        - testdata/compliance/
      verification_required: true
      notes: |-
        Hand-author the schema; populate via a stub bootstrap; run the
        named queries. Validates DSL parser, ref-joins, env_predicates,
        materialized views. Spec reference:
        graph-backend-adapter-contract §13.2.

        Delivers:
          * Full DSL parser with §5.4 ref-joins, §5.4.2 OPTIONAL+WHERE
            lowering, §5.1.1 allowed-functions-in-WHERE
          * env_predicates wiring (§7) — time_after + webhook predicate
            kinds
          * Conformance tests T6-T22, T23-T31 passing (full v1 DSL)
          * Compliance worked example loads and named queries return
            expected results on a sample corpus

        Hard test:
          impact_radius query returns regulations/risks/findings/evidence
          + owner on control status change; policy_review_due_impact
          surfaces controls when policy.review_due fires.

        Common false positive:
          coalesce in WHERE accepted but only for params (T23 passes,
          T24 must reject — guard against accidentally allowing
          field-level computation).

        O5 resolution (staleness drivers) folded: this task exercises all five
        scoped-KG drivers with the pinned semantics — source mutation =
        content-hash change; revocation = new note `revokes: <id>`; code-graph
        derivation depth 1 hop (note→note unbounded, opt-in via §7.3
        `derivation: true`); taint persists until `kg refresh --scope`;
        edge-type allowlist = `documents`/`implements`/`decided_on` (not
        `mentions`). Canonical: O5 + scoped-knowledge-graphs §4.1/§4.2.

        STATE NOTE: the DSL package (internal/kg/dsl/) is NOT yet built as of
        t1; this task delivers the first real DSL parser. Decision-complete
        (O5 pins driver semantics) — activatable once t1's completion is
        confirmed.
    - id: t3-ttrpg-dogfood
      title: TTRPG dogfood adapter — first real adapter author UX
      status: completed
      depends_on:
        - t1-none-adapter-end-to-end
      blocks: []
      owner: dot-agents
      write_scope:
        - .agents/sandbox/ttrpg-adapter/
        - oci packages for ttrpg-campaign-bootstrap skill
      verification_required: true
      notes: |-
        Real bootstrap skill parsing session logs. Validates Tier 2 OCI
        distribution, SDK contract (§8.4), real adapter author UX.
        First DM friend onboarded for live dogfood.

        Spec references:
          §13.3 (TTRPG worked example)
          §8.4 (SDK contract)
          §9 (Tier 2 OCI distribution)

        Delivers:
          * Bootstrap skill packaged as OCI artifact
          * SDK (`da-adapter-sdk`) for Go; bootstrap uses it exclusively
          * TTRPG adapter loads from sandbox local source; queries.yaml
            runs against session-log corpus
          * DM friend(s) provide initial wishlist signal

        Hard test:
          Bootstrap on a 10-session corpus produces expected note/edge
          counts; named queries return DM-validated results.

        Anti-scope:
          No grammar extensions (§5.1) — TTRPG works within v1.
          Wishlist accumulates §12 budget signals; do NOT pre-emptively
          extend grammar.
    - id: t4-crg-dual-read
      title: CRG migration — dual-read mode with crg-bridge adapter
      status: completed
      depends_on:
        - t1-none-adapter-end-to-end
      blocks:
        - t6-bridge-decommission
      owner: dot-agents
      write_scope:
        - internal/adapters/builtin/crg/
        - internal/adapters/builtin/crg-bridge/
        - internal/graphstore/
        - testdata/crg-parity/
      verification_required: true
      notes: |-
        Bootstrap writes to new kg-native namespace; bridge remains
        active for tools without parity; crg-bridge adapter exposes
        legacy bridge state as read-only mirror namespace.

        Spec references:
          §11 (CRG migration path)
          §11.2 (crg-bridge adapter)
          §11.3 (dual-read mode)
          §11.6 (parity test corpus)

        Delivers:
          * crg-bridge adapter shipping inside `da`, marked
            `migration_only: true`
          * CRG adapter bootstrap skill performing Tree-sitter
            ingestion to kg_crg.* namespace
          * Parity test corpus (100 commits) with passing thresholds
            for build/update/status/impact-radius rows (§11.1)
          * `workflow drift` flags consumers not yet migrated

        Hard test:
          For 10 pinned commits, both bridge and kg-native adapter
          produce equivalent node/edge counts and impact-radius results
          for a 100-symbol corpus.

        Anti-scope:
          NO decommissioning in this task — bridge stays active.
          flows/communities/postprocess parity is t6.

        O5 resolution folded: the `staleness_drivers: [source_mutation]` slice
        fires on note content-hash change (per O5, not any-upsert).

        O6 resolution (parity-matrix) folded: fold proposals A/C/D (the §11.1/
        §11.6 testability-gap refinements) into the parity matrix BEFORE
        building this task's parity surface, so t6's multi-week parity clock is
        tested against the corrected matrix. REJECT G (SQL-callable views break
        the §2.2/§5.2 no-raw-SQL invariant). OWNER-GATE: the exact §11.1/§11.6
        edits A/C/D imply must be re-read against
        .agents/proposals/crg-dual-read-parity-surface-2026-05.md before
        ratification — the posture is resolved (O6) but A/C/D's specific
        content was outside the dossier read set.

        STATE NOTE: CRG ships today as a Python-subprocess provider behind the
        `Store` seam (internal/graphstore/crg.go), NOT as an adapter. This task
        builds the kg-native CRG adapter + crg-bridge mirror adapter. The
        long-range Python→Go architecture question is owned here + §11
        (go-native-code-graph-analysis is superseded-in-part by §11).
    - id: t5-cross-adapter-reads-from
      title: Cross-adapter `reads_from` — compliance view from CRG
      status: completed
      depends_on:
        - t2-compliance-read-only
        - t4-crg-dual-read
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/adapters/builtin/compliance-register/views/
        - internal/kg/dsl/cross-namespace/
        - testdata/cross-adapter/
      verification_required: true
      notes: |-
        Compliance adapter declares a view that reads from CRG.
        Validates namespace-token set derivation (§8.2), multi-namespace
        query plans, lockfile cross-adapter coordination (§10).

        Spec references:
          §8.3 (cross-adapter reads via reads_from)
          §10.3 (cross-adapter cutover)
          §10.1.3 (fail-closed reconciliation)

        Delivers:
          * Multi-namespace token derivation per N3-N4 conformance tests
          * Cross-namespace SQL plan validation per N6-N9
          * View `controls_with_changed_function_evidence` from §8.3
            example loads and refreshes correctly
          * Lockfile state machine transitions through full
            pending-recompat-check → pending-rebuild → ready cycle
            when CRG schema is bumped

        Hard test:
          Bump CRG to a backward-compatible new schema; the dependent
          view transitions through the state machine and rebuilds.
          Then bump CRG to an incompatible schema; the view enters
          dsl-update-required and blocks dependee activation until
          compliance adapter ships an updated view query.

        Common false positive:
          Cross-adapter writes attempted via materialized view —
          must be storage-layer rejected (N8).

        O1 resolution (cutover gate) folded: NO `accepts_breaking_changes`
        opt-out — the cutover gate is mechanical (§10.3). The hard test above
        (incompatible CRG bump → view enters `dsl-update-required` and blocks
        dependee activation until a fixed query ships) IS the mechanical-gate
        behavior. Do NOT build an ack-command surface or an
        `accepts_breaking_changes` lockfile field. Canonical: O1 + §14 Q2
        (resolved). The recoverable case falls through via §10.3.3.
    - id: t6-bridge-decommission
      title: Bridge decommissioning — close §11.4 gate
      status: pending
      depends_on:
        - t4-crg-dual-read
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/graphstore/ (deletions)
        - internal/adapters/builtin/crg/ (full feature parity)
        - .github/workflows/ci.yml (parity test promotion)
      verification_required: true
      notes: |-
        Flip `da` core to prefer new CRG namespace. Decommission the
        Python subprocess bridge once §11.4 gate passes.

        Spec references:
          §11.1 (full parity matrix — flows/communities/postprocess
                  remain)
          §11.4 (decommissioning gate)

        Delivers:
          * flows/communities/postprocess parity (named queries OR
            materialized views OR adapter MCP server per §11.1 — log
            budget signal if MCP server is used)
          * 3 consecutive weeks of CI green on the parity matrix
          * Behavior-preservation gate (§6.2 of app-type-profiles)
            passes on 100-task corpus
          * `workflow drift` reports zero consumers still using bridge
          * crg-bridge adapter removed from `da` core
          * Python subprocess machinery deleted

        Hard test:
          After deletion, `kg build|update|impact|flows|communities|
          postprocess|changes` commands all work end-to-end against
          new kg-native namespace only.

        Anti-scope:
          Do NOT delete bridge until ALL §11.4 gate conditions are
          met. If even one consumer's lockfile still has
          `reads_from: [crg-bridge]`, keep the bridge.
    - id: t7-app-type-profiles-wiring
      title: Wire graph_backend adapter-ref selection into app-type-profiles
      status: completed
      depends_on:
        - t1-none-adapter-end-to-end
      blocks:
        - release-minor
      owner: dot-agents
      write_scope:
        - .agents/workflow/specs/app-type-profiles/design.md
        - internal/config/
        - cmd/da/commands/
      verification_required: true
      notes: |-
        O3 (ACCEPTED 2026-06-24). Applies the app-type-profiles edits §15 of
        graph-backend-adapter-contract defers (the "wiring" commit): replace the
        closed graph_backend enum (crg|citation-graph|document-cross-ref|none)
        with an adapter-ref that resolves via sources/extends and pins in the
        lockfile (§9). Wire the profile-selection path so a profile declaring
        `graph_backend: dotagents-builtin:graph/none@^1.0` resolves to the t1
        none adapter end-to-end.

        COUPLING (do NOT ratify independently of O4's schema): the KG schema
        models `app_type` as an OPEN/extensible vocabulary (free string +
        documented known-starter set), the same surface this task wires
        (graph_backend enum → adapter-ref; app_type ref-form resolution). t7's
        app-type-profiles edits and the KG schema's app_type /
        plan.default_app_type / task.app_type fields must agree on the
        open-vocabulary contract. See
        work-tracking-storage-abstraction/sdd-entity-kg-schema-draft.md.

        Hard test: a profile selecting the none adapter ref resolves, registers
        in the lockfile, and the no-op impact_radius runs through the profile
        path (not just the direct adapter path t1 exercised).

        Anti-scope: no new adapters; uses the t1 none adapter as the proof.

        ISP routing:
          mode: fanout-amenable (bounded write_scope; config/profile surface)
          verifier: integration tests
          review: code review
    - id: t8-tasks-schema-app-type-drift
      title: Fix workflow-tasks.schema.json app_type drift (schema rejects a field code uses)
      status: completed
      depends_on: []
      blocks: []
      owner: dot-agents
      write_scope:
        - schemas/workflow-tasks.schema.json
      verification_required: true
      notes: |-
        O4 schema-v3 flagged drift (NOT fixed in #136). Real bug, not doc-lag:
        schemas/workflow-tasks.schema.json sets `additionalProperties: false`
        on each task item and does NOT list `app_type`, so a TASKS.yaml that
        carries `app_type` — which CanonicalTask.AppType marshals
        (commands/workflow/types.go, `app_type,omitempty`) and live plans like
        docs-starlight-migration already write (`app_type: docs`/`go-cli`) —
        FAILS schema validation.

        Fix: add an optional open-string `app_type` property to the task-item
        `properties` so the schema matches CanonicalTask + the live artifacts.
        Scope: schemas/workflow-tasks.schema.json ONLY.
        Verify: a TASKS.yaml carrying `app_type` validates.

        Independent of the adapter pipeline (depends_on: []); can run any time.
        Route via `da workflow` — recorded here per the O4 dossier
        recommendation; intentionally NOT fixed in the docs-only coherence PR.
    - id: release-minor
      title: 'Release: bump VERSION + finalize CHANGELOG for the graph-backend minor'
      status: pending
      depends_on:
        - t1-none-adapter-end-to-end
        - t2-compliance-read-only
        - t3-ttrpg-dogfood
        - t4-crg-dual-read
        - t5-cross-adapter-reads-from
        - t6-bridge-decommission
        - t7-app-type-profiles-wiring
      blocks: []
      owner: dot-agents
      write_scope:
        - VERSION
        - CHANGELOG.md
      verification_required: true
      notes: |-
        Release-gated tail task (hybrid convention, MINOR path).
        Maintainer ruling 2026-05-28: MINOR, not MAJOR. The functionality
        does not semantically change — only the under-the-hood backend. The
        Python-bridge removal in t6-bridge-decommission is an internal backend
        swap (Python subprocess bridge -> native kg adapter), invisible to
        `da` consumers: no public-surface or contract change. The graph-backend
        surface callers depend on is preserved end-to-end, so SemVer rule keys
        MINOR (additive adapters/DSL + invisible backend migration), not MAJOR.
        t1–t5 (built-in adapters, DSL, cross-adapter reads) are purely additive.
        t6 is fenced behind a multi-week §11.4 parity gate and a "keep the
        bridge if any consumer still reads it" anti-scope, so the swap only
        completes once parity is proven — keeping the consumer-visible behavior
        identical, which is why it stays MINOR.
        Target version = next minor computed from current VERSION at
        ready-time (do NOT hardcode). VERSION is already 0.4.0 (that minor
        shipped), so the next minor resolves to 0.5.0 — but always recompute
        from the live VERSION when this task becomes ready rather than
        hardcoding, and serialize at the VERSION bump if another minor ships
        first.
        Action: bump VERSION to the resolved next minor and finalize the
        CHANGELOG "## [<target>]" section, documenting the bridge migration as
        an internal backend swap (no consumer-facing change). Merge to master
        fires auto-release.yml.
      app_type: release
    - id: t9-sdk-materializeview-readsfrom-gate
      title: Wire reads_from enforcement into SDK.MaterializeView
      status: pending
      depends_on:
        - t4-crg-dual-read
      blocks: []
      owner: dot-agents
      write_scope:
        - internal/adapters/sdk/
      verification_required: true
      notes: Codex review of t4 (#172) found SDK.MaterializeView accepts arbitrary readsFrom without consulting the registry, so the migration_only reads_from gate (registry.EnforceReadsFrom, wired at load in t4) does not cover the materialized-view path. Wire EnforceReadsFrom (or an equivalent registry consult) into SDK.MaterializeView so a view reading a migration_only adapter is rejected. Add an integration test; mutation-verify the gate.
      app_type: go-cli
