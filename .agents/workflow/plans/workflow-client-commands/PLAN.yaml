owner: dot-agents
success_criteria: |-
    - `da workflow close-task` runs end-to-end and produces (a) an
      iter-N.yaml entry conforming to workflow-iter-log.schema.json,
      (b) a fresh iter-N.score.yaml sidecar, (c) status=completed on the
      closed task, (d) refocus to the next eligible task, (e) a workflow
      commit of the state changes — all in one invocation.
    - `da workflow start-task` mirrors the start side: plan activated /
      focused / scope-derived / optionally fanned out, with the workflow
      state committed.
    - --score-recompute=current is the default and only re-touches the
      one new iter sidecar; recent-N and all are documented escape
      hatches for rubric / signal-shape changes.
    - The iteration-close skill calls close-task and renders the new
      score's per-signal breakdown back to the operator so the
      immediate-feedback loop closes at the same moment the iteration
      does — no separate `da score iteration N` step.
    - The fine-grained primitives (verify record, advance, plan update,
      workflow commit, score run) remain callable independently — client
      commands compose, they do not replace.
verification_strategy: |-
    Per-task Go unit + integration:
      - close-task: golden-path against a tempdir repo + iter-log,
        asserting every downstream artifact appears with the right shape
        (iter file conforms to schema, score sidecar conforms to
        PersistedScore, task status flipped, focus moved, commit landed).
        Error-injection on each downstream step to confirm the orchestration
        surfaces failures rather than silently swallowing them.
      - start-task: same coverage, plus the fanout branch.
      - Auto iter-log derivation: round-trip a synthetic session through
        the helper and assert the produced yaml parses back through
        LoadIterationLog.
      - Score recompute scope: assert --score-recompute=current writes
        exactly one sidecar; recent-N writes N; all reproduces the full
        `da score run` output.
      - Skill integration: drive iteration-close end-to-end (TBD test
        harness) and assert the score breakdown appears in the rendered
        output. If a skill-level test harness isn't available, gate the
        assertion on a CLI smoke that mirrors the skill's call sequence.
