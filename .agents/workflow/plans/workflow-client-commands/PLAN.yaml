schema_version: 1
id: workflow-client-commands
title: da workflow close-task / start-task client commands + auto iter-log + scoring at close
status: active
summary: |-
    Promote two recurring workflow sequences from "hand-typed each session" to first-class client commands that compose the existing fine-grained primitives:

      da workflow close-task [--task T] [--score-recompute=current|recent-N|all]
          verify record (last test result) →
          write iter-N.yaml (auto-derived from in-flight session state) →
          score the just-closed iteration (or wider window if requested) →
          advance --status completed →
          plan update --focus <next eligible> →
          workflow commit (stage workflow-state, via go-git v6 per
          workflow-commit-command)

      da workflow start-task [--task T]
          plan update --status active --focus T →
          plan derive-scope T (sidecar evidence sniff) →
          workflow fanout (if a bundle is appropriate) →
          workflow commit (focus + scope change)

    The plan is the natural integration point for R1 scoring: scoring runs inside close-task with sensible defaults, so every iteration gets a persisted, explainable outcome score as a byproduct of the normal close flow — not a separate ritual the operator has to remember. Older scores stay static once written (they're computed from immutable inputs); the default --score-recompute=current is therefore cheap. The recent-N and all flags exist for rubric or signal-shape changes that warrant backfill.
    Critically, this plan also closes the "no source = no score" gap by making iter-N.yaml an auto-derived artifact rather than a hand-edited one. Without that, R1's downstream chain (signals → scorer → persist → cli) has nothing to score on iterations where the operator forgot to write the log.
