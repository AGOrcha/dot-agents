success_criteria: |-
  The kg-ideate compound skill + its four molecules + instruction/template files exist and pass
  the batch verifier; a degraded-mode run (no citation adapter) completes all four phases with
  the contradiction step no-opping into the competing-decisions fallback; the structural
  contradiction step lights up once §13.4 `contradicting_claims` ships; canonical
  proposal.schema.json + lesson.schema.json exist and are referenced by both the global
  proposal/lesson system and the KG typed nodes.
verification_strategy: |-
  Per-molecule batch verifier (skill frontmatter declares verifier: batch); a degraded-mode
  end-to-end dry-run demonstrating the graceful-degradation contract (D3); schema validation of
  the new proposal/lesson schemas against existing proposal/lesson artifacts. The
  structural-contradiction task is verified only after the citation adapter gate clears.
