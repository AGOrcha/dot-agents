schema_version: 1
id: layered-pr-fanout
title: 'Layered PR fanout: awaiting_review status + slot/dep accounting + blocked-on'
status: active
summary: |-
    Implement the layered-pr-fanout spec (workflow/specs/layered-pr-fanout/design.md): the awaiting_review task status with awaiting_agent_review/awaiting_owner_review sub-statuses, slot accounting (§2.8: awaiting_owner_review + blocked-on free the slot, awaiting_agent_review holds it), eligibility/dep-satisfaction (awaiting_owner_review satisfies downstream deps), the blocked-on:<ref> parameterized state + auto-resume predicates (§3.4), the layered base-resolution algorithm (§4), and the verifier/lens-gate/owner transition split (§6). Unblocks the PR-open staged-pipeline model so open-PR tasks free slots and satisfy deps instead of stalling as in_progress.
    - (fb:verifier-preconditions-should-be-configurable) RESOLVED design (user steer): precondition policy = predicates over the unified event contract, but a policy is a NAMED entry in a top-level precondition_policies registry (mirrors verifier_profiles, object-keyed, schema-additive, no enum), referenced by name from stage profiles — so an org/team defines a policy once and layers/reuses it across many app_types via the same sources/extends delivery (Payout case). Resolution reads the LOCKFILE (the merged/locked final config, config-v2 SOT for what is actually set up), NOT raw .agentsrc.json. Built-in default policy = the historical PR/go-cli gate (event.pr.open + ci.rollup green + gate.quality.sonar + new_code_issues==0). Spec amended at layered-pr-fanout 2.3/3.2/6.1. Impl = Slice A (transitions.go generic predicate registry + evaluator + built-in default, self-contained, on the #51 branch) then Slice B (top-level precondition_policies registry config across the 6 AgentsRC sync points + stage-profile reference-by-name + lockfile resolution).
created_at: "2026-05-30T18:46:09Z"
updated_at: "2026-06-30T18:37:04Z"
owner: dot-agents
success_criteria: (1) advance --status accepts awaiting_review/awaiting_agent_review/awaiting_owner_review; schema documents them. (2) Slot accounting per §2.8 table (awaiting_owner_review + blocked-on free slot; awaiting_agent_review holds; in_progress holds). (3) da workflow eligible treats an upstream in {completed, awaiting_owner_review} as dep-satisfied; in_progress does not satisfy. (4) blocked-on:<ref> frees the slot, tracked in a separate blocked bucket, with auto-resume predicate evaluation (task/secret/decision/condition) per §3.4.5. (5) fanout computes base_branch from the dep PRs' branches per §4. (6) verifier owns in_progress->awaiting_agent_review, lens-gate owns ->awaiting_owner_review, owner-merge ->completed per §6.
verification_strategy: 'Focused go test on the workflow status/eligible/advance packages; table-driven slot-accounting tests (each status -> counts/frees); eligibility test (awaiting_owner_review upstream satisfies dep, in_progress does not); blocked-on auto-resume predicate unit tests; fanout base-resolution test from a synthetic dep-PR lineage; end-to-end: mark a task awaiting_owner_review and confirm its dependents become eligible and its slot frees.'
