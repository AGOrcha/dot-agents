        form; admin sees /review/users + /review/audit subroutes.

        Cross-plan dep: R2 must have shipped its base React app
        skeleton + run-detail page (NOT R2's real-time push surface).
        The exact write_scope path is locked once R2's frontend
        layout exists.
      app_type: web
    - id: admin-cli
      title: '`da review` CLI for user/audit administration'
      status: pending
      depends_on:
        - rbac-identity
        - audit-log
      blocks: []
      owner: dot-agents
      write_scope:
        - commands/review_admin.go
        - commands/review_admin_test.go
        - commands/root.go
      verification_required: true
      notes: |-
        Distinct from the existing `da review` (review-mode).
        NAME CLASH IS REAL (verified 2026-06-25): commands/review.go
        already registers `da review` with subcommands show|approve|
        reject (NewReviewCmd). The admin surface (users add|list|
        remove --role; audit verify|prune --before) therefore CANNOT
        nest under `da review` without colliding. Resolution: nest the
        admin subtree under the existing `da review` group as
        `da review users ...` / `da review audit ...` ONLY if those
        subcommand names do not collide with show/approve/reject
        (they don't) — i.e. extend NewReviewCmd with new subcommands
        rather than a second top-level group. Otherwise use
        `da review-admin` or `da workflow review-admin`. Pick one and
        pin it before opening; update write_scope (commands/review.go
        if extending the existing group, vs commands/review_admin.go
        if a new group). Admin-only; operates on local YAML/JSONL —
        no network.
        RATIFIED 2026-07-02: prune uses --before-year (year-keyed
        rotation), superseding the earlier --before <date> sketch.
        Audit log rotation is year-keyed (archive names encode year),
        so year-granular prune is the correct contract. The
        internal/review/audit/ prune implementation uses this flag.
      app_type: go-cli
    - id: e2e-smoke
