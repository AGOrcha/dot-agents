        AGENTS_HOME"); NOT ~/.agents/review/ (the earlier draft path
        would git-sync hashed secrets). Hash = argon2id, NOT bcrypt.
        SHIPPED (coherence 2026-06-25): internal/review/auth/ landed
        (authenticator.go + token.go + users.go + role.go + tests);
        commit 854821bc moved users.yaml out of AGENTS_HOME to
        ~/.config/da; commit e3995d80 swapped bcrypt→argon2id. Marked
        completed. Earlier ~/.agents/review + bcrypt note was stale;
        spec D5.3 + shipped code are the single source.
