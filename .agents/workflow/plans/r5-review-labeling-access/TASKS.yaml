    - id: collection-endpoint
      title: HTTP route handlers + auth/audit middleware (mounts into R3 server)
      status: completed
      depends_on:
        - rbac-identity
        - label-model
        - audit-log
      blocks:
        - review-ui
        - e2e-smoke
      owner: dot-agents
      write_scope:
        - internal/review/http/
      verification_required: true
      notes: |-
        RESCOPED 2026-07-02 (§2A coherence): these review routes are
        browser-facing / external-tool-consumed, so they take the
        HTTP arm of r3's §2A surface→transport map — they mount on
        R3's HTTP/SSE edge via the stdlib
        RegisterMount(prefix, handler) surface (net/http; NO
        chi/router dep — the earlier "func Mount(r chi.Router, deps
        Deps)" sketch is superseded; R3's server is framework-free).
        They do NOT ride the UDS control plane. No EventBus access is
        needed for v1 (r3 §D4.3: R5 mounts an HTTP handler that does
        not need bus access); if a later slice subscribes to events,
        it binds to the §D4.1 EventBus INTERFACE, never *events.Bus.

        Defines an HTTPMount that R3 imports and mounts under
        /api/reviews. Handlers: POST/PATCH
        /api/runs/:iteration/labels, GET /api/runs/:iteration/labels,
        GET /api/review/audit (admin), users CRUD (admin).
        AuthMiddleware reads Bearer token via Authenticator;
        AuditMiddleware emits one record per mutating call. Route
        ownership stays in this package (spec D5.5); R3 owns the
        host, middleware chain, and lifecycle.

        Cross-plan dep: r3 http-server — now the §2A transport-layer
        task (UDS control plane + HTTP/SSE edge, RegisterMount on the
        edge) — must ship before this can be wired in-process. Until
        then, this package ships a standalone http.Handler usable in
        tests.
      app_type: go-cli
    - id: r1-integration
      title: Human-label signal + RubricVersion major/minor bump (resolve at task time)
      status: completed
      depends_on:
        - label-model
      blocks:
        - e2e-smoke
      owner: dot-agents
      write_scope:
        - internal/scoring/signal_human_label.go
        - internal/scoring/signal_human_label_test.go
        - internal/scoring/rubric.go
        - internal/scoring/signals.go
        - internal/scoring/signals_test.go
        - docs/OUTCOME_SCORING_RUBRIC.md
      verification_required: true
      notes: |-
        Per D5.2: add SignalHumanLabel (weight ~0.15, re-balance the
        existing SEVEN signals down — note the shipped rubric now has
        seven, not six: R1.5 added hook_outcomes at 2.1.0), extend
        SignalSet with HumanLabel SignalValue, add
        ExtractHumanLabelSignals(iterLogDir, n) reading
        iter-N.labels.yaml, wire it through AssembleSignalSet and
        BuildSignalSets. Update docs/OUTCOME_SCORING_RUBRIC.md with
        the new signal + new weight table + rationale. Multi-label
        aggregation rule: mean of latest-per-reviewer.

        RUBRIC VERSION (resolve at task time, do NOT hardcode 3.0.0):
        R1.5 shipped first and bumped to 2.1.0 (confirmed in
        internal/scoring/rubric.go: `const RubricVersion = "2.1.0"`).
        Per the R1.5 design D5 / OUTCOME_SCORING_RUBRIC.md ordering
        policy, R5 (the FIRST signal depending on external human input)
        owns the next MAJOR bump → target 3.0.0 only if the constant is
        still 2.1.0 at task time; if another rubric mutation lands
        first, rebase to the next available major/minor per that
        policy. The earlier "3.0.0" plan text predated R1.5 shipping
        2.1.0 — read the constant, do not assume.

        Note: this task touches R1's shipped surface area
        (RubricVersion is global). Coordinate via the umbrella spec
        and the R1.5 ordering policy before opening.
      app_type: go-cli
    - id: review-ui
      title: Review surface in R2 (list, inspect, label form, role-aware controls)
      status: pending
      depends_on:
        - collection-endpoint
      blocks:
        - e2e-smoke
      owner: dot-agents
      write_scope:
        - web/dashboard/src/review/
      verification_required: true
      notes: |-
        Two routes /review (filterable list, unlabeled-first sort) +
        /review/:iteration (detail + label form). API client wraps
        fetch to inject Bearer token from localStorage; 401/403
