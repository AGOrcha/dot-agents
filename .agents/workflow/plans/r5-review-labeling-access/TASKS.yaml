      verification_required: true
      notes: |-
        Implement Authenticator interface + LocalUsersAuthenticator
        backed by the local users file (argon2id-hashed token, role
        enum reviewer|admin|readonly). Token issuance helper. No HTTP
        yet — pure package, unit-tested. Decision D5.3.
        Users-file path = ~/.config/da/review/users.yaml honoring
