version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/docs/web"
    schedule:
      interval: "weekly"
    groups:
      docs:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # Starlight pins a specific Astro major; let the Starlight bump drive
      # the Astro major so the two stay compatible. Allow minor/patch only.
      - dependency-name: "astro"
        update-types:
          - "version-update:semver-major"
