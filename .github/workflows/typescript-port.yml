name: TypeScript Port

on:
  push:
    branches:
      - master
      - feature/*
  pull_request:
    branches:
      - master
      - feature/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: ports/typescript

jobs:
  boundary-sync:
    name: Boundary sync (Go cobra <-> TS commander)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The boundary parser walks commands/**.go from the repo root, so
          # we need a full checkout (not a sparse clone).
          fetch-depth: 1

      - name: Set up Go
        # Pinned to 1.26.x to match .github/workflows/test.yml. The boundary
        # check itself is pure-TS today and parses Go source statically; Go
        # is set up so future iterations can opt into running the binary
        # for cross-checking without changing CI.
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ports/typescript/package-lock.json

      - name: Install TS port dependencies
        run: npm ci

      - name: Build TS port
        run: npm run build

      - name: Run boundary sync test (vitest)
        # The boundary check lives in ports/typescript/scripts/check-boundary.ts
        # and is exercised end-to-end via tests/boundary-sync.test.ts. Vitest
        # transpiles the script on the fly (no separate build step needed),
        # asserts zero violations, and prints a numbered list of FAIL
        # diagnostics with explicit paths and spec sections to update when it
        # detects drift.
        run: npx vitest run tests/boundary-sync.test.ts
