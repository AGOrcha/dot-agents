name: Deploy docs to agorcha.dev

on:
  push:
    branches: [master]
    paths:
      - 'docs/web/**'
      - 'docs/DEMO_*.md'
      - 'schemas/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/web/**'
      - 'docs/DEMO_*.md'
      - 'schemas/**'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: deploy-docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/web/package-lock.json

      - name: Install dependencies
        working-directory: docs/web
        run: npm ci

      - name: Build site
        working-directory: docs/web
        env:
          # Switches astro.config.mjs to root-base URLs for agorcha.dev
          # (GitHub Pages would use /dot-agents/ instead).
          DEPLOY_TARGET: cloudflare
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/web
          command: deploy ${{ github.event_name == 'pull_request' && '--env preview' || '' }}
