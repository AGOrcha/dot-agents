name: Test

on:
  # Run on direct pushes to master (post-merge baseline) and on PRs.
  # PR branch pushes are covered by the pull_request lane only — narrowing
  # push: to master eliminates the duplicate runs that occurred when a PR
  # branch matched both push:branches (feature/*, pr*/*) and pull_request.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - feature/*
      - pr*/*

concurrency:
  # Use head_ref (the PR source branch) for pull_request events so that
  # repeated pushes to the same PR cancel earlier in-flight runs. For push
  # events (master) fall back to ref. cancel-in-progress is guarded to only
  # cancel pull_request runs — master pushes complete so release-tag and
  # baseline invariants are preserved.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # commands/workflow was git-heavy (~438s non-race on a real Windows box) and
  # needed a 1200s scaffold under -race. The workflow-perf-optimization pass
  # (H1 shared fixtures + H2/H3 git-spawn cuts) brought its -race wall-clock on
  # windows-latest back under Go's 600s default, so the scaffold is reverted.
  # -timeout is PER-PACKAGE, so a genuine hang still fails the run.
  GO_TEST_FLAGS: -race -count=1 -timeout=600s

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |f| puts "Validating #{f}..."; YAML.load_file(f) }'
          echo "All workflow files have valid YAML syntax"

      - name: Install actionlint
        run: |
          curl --proto "=https" --tlsv1.2 -sSf -o /tmp/download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
          bash /tmp/download-actionlint.bash

      - name: Run actionlint
        run: |
          # Run actionlint but only fail on errors, not warnings
          # -ignore flag skips shellcheck info/style issues
          ./actionlint -color \
            -ignore 'SC2002:' \
            -ignore 'SC2086:' \
            -ignore 'is too old to run'

      - name: Release signing-toolchain pin guard
        # Guards the 0.4.0 class of release failures: a signing tool that
        # resolves to a fresh version at job time can break the cut (the
        # dotnet `sign` kernel32 Linux crash; an unpinned timestamp lib's
        # DLSequence cast). Every signing-tool install in auto-release.yml MUST
        # be version+sha256 pinned. This targets the curl|install signing-tool
        # steps (jsign/quill/cosign), NOT the SHA-pinned `uses:` actions, which
        # carry their pin in the ref. See the release-cut skill + the lesson
        # pin-release-toolchain-and-make-releases-retryable.
        run: |
          set -euo pipefail
          WF=.github/workflows/auto-release.yml
          fail=0

          flag() { echo "::error file=${WF}::$1"; fail=1; }

          # 1. The dotnet `sign` tool must never come back: it crashed on Linux
          #    with a kernel32.dll DllNotFoundException and broke 0.4.0.
          if grep -Eq 'dotnet[[:space:]]+tool[[:space:]]+install[^\n]*(\bsign\b|--global[[:space:]]+sign)|\bdotnet[[:space:]]+sign\b' "${WF}"; then
            flag "dotnet 'sign' tool reintroduced (0.4.0 kernel32 Linux regression). Use jsign instead."
          fi

          # 2. No signing/build tool may be installed via --prerelease or @latest.
          if grep -Eq -- '--prerelease' "${WF}"; then
            flag "a --prerelease install is present on the release path; pin an exact version instead."
          fi
          if grep -Eni 'tool[[:space:]]+install|go[[:space:]]+install|curl' "${WF}" \
              | grep -Eqi 'jsign|quill|cosign|goreleaser' \
              && grep -Eni 'jsign|quill|cosign' "${WF}" | grep -Eq '@latest'; then
            flag "a signing tool is installed with @latest; pin an exact version instead."
          fi

          # 3. Every signing-tool that is fetched via curl must verify a checksum.
          #    For jsign/quill/cosign, require BOTH a *_VERSION and a *_SHA256 env
          #    var so the fetched bytes are pinned and verified.
          for tool in JSIGN QUILL; do
            if grep -Eqi "${tool}_VERSION" "${WF}"; then
              if ! grep -Eqi "${tool}_SHA256" "${WF}"; then
                flag "${tool} is version-pinned but has no ${tool}_SHA256 checksum; pin version + sha256 together."
              fi
            fi
          done

          # A signing tool pulled by curl must be checksum-verified (sha256sum -c).
          if grep -Eqi 'curl[^\n]*(jsign|quill)' "${WF}"; then
            if ! grep -Eq 'sha256sum[[:space:]]+-c' "${WF}"; then
              flag "a signing tool is fetched via curl but no 'sha256sum -c' verification is present."
            fi
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "Release signing-toolchain pin guard FAILED. See errors above."
            exit 1
          fi
          echo "Release signing-toolchain pin guard passed: signing tools are version+sha256 pinned, no dotnet 'sign', no --prerelease/@latest."

  # Named soak-clock signal for §11.6 / t6d: this gate must stay green for
  # 3 consecutive weeks before the CRG bridge may be decommissioned.
  crg-parity-gate:
    name: CRG parity gate (decommission soak signal)
    runs-on: ubuntu-latest
    needs: lint-workflows
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Run hermetic CRG parity harness
        run: go test -race -count=1 -run '^(TestPostprocessParity_TenCommitDualRead|TestPostprocessParity_CatchesDivergence|TestRegression_CrossPathParity_ClampsAreTheSameNumbers)$' ./internal/adapters/builtin/crg ./internal/graphstore

  # §11.4 criterion 2 — the behavior-preservation gate. Where crg-parity-gate
  # above is hermetic (synthetic 10-commit corpus, no Python), this job replays
  # a corpus of REAL review tasks pinned from this repository's history against
  # the LIVE legacy Python bridge and the kg-native adapter, under the same
  # structural oracles. It therefore needs the code-review-graph CLI AND a real
  # built graph, which is why it is slow and lives in its own job.
  #
  # continue-on-error: the gate is NON-REQUIRED until the §11.4 criterion-2
  # sign-off. At sign-off: drop continue-on-error, and (once the advisory
  # divergences recorded in testdata/crg-behavior/BEHAVIOR.md are resolved or
  # accepted) add -strict so those surfaces gate too.
  crg-behavior-gate:
    name: CRG behavior-preservation gate (§11.4 criterion 2, non-required)
    runs-on: ubuntu-latest
    needs: lint-workflows
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pinned corpus references real commits; the corpus builder and
          # the manifest's provenance need history, not a 1-commit clone.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      # Same install the per-OS test job uses for the KG CODE lane, so the
      # bridge is discovered at .venv/bin/code-review-graph.
      - name: Set up code-review-graph (.venv)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet code-review-graph
          .venv/bin/code-review-graph --help >/dev/null

      # The dual-read comparison reads the legacy bridge's OWN persisted
      # derived views (flows / communities / risk_index / FTS), so the graph
      # must be built with postprocess (no --skip-flows).
      - name: Build the legacy CRG graph
        run: .venv/bin/code-review-graph build --repo "${GITHUB_WORKSPACE}"

      - name: Run behavior-preservation gate over the pinned review-task corpus
        run: go run ./tools/crgbehaviorgate -repo . -graph-repo .

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint-workflows  # Only run tests if workflows are valid
    # SMOKE_HOME / SMOKE_AGENTS_HOME / DA_BIN are set by the "Configure smoke
    # environment" step so the paths are bash-normalized (cygpath on Windows)
    # and the binary name carries the .exe suffix on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the SonarQube Scan step in this job needs blame
          # / SCM data for new-code detection. A shallow clone makes
          # SonarCloud warn "shallow clone detected, no blame info".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      # ── Postgres for graphstore integration tests ───────────────────────
      # The graphstore postgres suite uses a shared singleton DSN. When
      # TEST_PG_URL is set, lazyPostgresDSN connects to it directly and never
      # touches Docker/testcontainers (postgres_container_test.go:48). We
      # provision a native Postgres per-OS so coverage of postgres.go is
      # uniform across the whole matrix — no Colima, no Docker-on-macOS.
      # OpenPostgres self-creates its schema via CREATE TABLE IF NOT EXISTS,
      # so an empty reachable database is all each runner needs.
      - name: Start Postgres (Linux — Docker)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=graphstore -p 5432:5432 postgres:16-alpine
          for _ in $(seq 1 30); do
            if docker exec pg pg_isready -U test -d graphstore >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "TEST_PG_URL=postgres://test:test@localhost:5432/graphstore?sslmode=disable" >> "$GITHUB_ENV"

      - name: Start Postgres (macOS — Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          pg_prefix="$(brew --prefix postgresql@16)"
          export PATH="${pg_prefix}/bin:$PATH"
          for _ in $(seq 1 30); do
            if pg_isready -h localhost >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          createuser -s test 2>/dev/null || true
          psql -d postgres -c "ALTER USER test WITH PASSWORD 'test';" 2>/dev/null || true
          createdb -O test graphstore 2>/dev/null || true
          echo "TEST_PG_URL=postgres://test:test@localhost:5432/graphstore?sslmode=disable" >> "$GITHUB_ENV"

      - name: Start Postgres (Windows — preinstalled service)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          # GitHub windows images ship PostgreSQL with the service set to
          # Disabled — Start-Service fails on a disabled service, so flip the
          # startup type to Manual first.
          Set-Service -Name $svc.Name -StartupType Manual
          if ($svc.Status -ne 'Running') {
            Start-Service -Name $svc.Name
          }
          # GitHub windows images document PGBIN; fall back to Get-Command.
          $pgbin = $env:PGBIN
          if (-not $pgbin) { $pgbin = Split-Path (Get-Command pg_isready).Source }
          for ($i = 0; $i -lt 30; $i++) {
            & "$pgbin\pg_isready.exe" -h localhost 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          # GitHub windows runners ship a `postgres` superuser with password `root`.
          $env:PGPASSWORD = 'root'
          & "$pgbin\createdb.exe" -U postgres -h localhost graphstore 2>$null
          "TEST_PG_URL=postgres://postgres:root@localhost:5432/graphstore?sslmode=disable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      # macOS and Windows GitHub-hosted images ship jq preinstalled; install
      # is only needed on Linux. The verify step below is the cross-OS guard.
      - name: Verify jq installed
        run: jq --version

      # Install the real code-review-graph Python CLI into a repo-root
      # .venv so internal/graphstore TestCRGBridgeFreshBuildRealCRG
      # actually runs (DiscoverCRGBin finds .venv/bin/code-review-graph
      # and pythonBin() resolves .venv/bin/python3 for site-packages).
      # Interim coverage until the in-process CRG graph adaptor lands.
      # Windows venv layout is .venv/Scripts/ (not .venv/bin/), which
      # DiscoverCRGBin does not probe, so the test skips there as before.
      - name: Set up code-review-graph (.venv)
        if: runner.os != 'Windows'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet code-review-graph
          .venv/bin/code-review-graph --help >/dev/null

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./commands ./internal)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      # Locks cross-leaf isolation between the four commands/internal/*
      # composition leaves established by plan root-command-decomposition
      # (t13a + t13a-pre + t13b + t15). Outsider-prevention is enforced by
      # Go's built-in internal/ rule at compile time, so this step only
      # fails if commands/internal/{lifecycle,mcp,settings,rules} start
      # importing each other. The check runs before the coverage gate so
      # the regression cannot ride a green test suite into master. See
      # tools/importguard/main.go for the exact policy and main_test.go
      # for the unit table that pins the decision matrix.
      - name: Import boundary guard (commands/internal/* cross-leaf)
        run: go run ./tools/importguard ./...

      # Mechanically enforces the leverage-cross-platform-fs-helpers lesson:
      # filesystem mutations (os.{Mkdir,MkdirAll,Remove,RemoveAll,Rename,
      # WriteFile}) must route through internal/fsops, which carries the
      # Windows PowerShell fallbacks a raw os.* call lacks. A raw os.Mkdir
      # against a missing parent is exactly the #148 Windows bug. Pre-existing
      # call sites are grandfathered with reasons in tools/fsguard/allowlist.go;
      # this gate ratchets so a NEW raw mutator in an un-grandfathered package
      # fails the build. Runs before the coverage gate so the regression can't
      # ride a green test suite into master.
      - name: FS-helpers guard (raw os.* fs-mutators outside fsops)
        run: go run ./tools/fsguard ./...

      - name: Go test
        run: go test $GO_TEST_FLAGS -covermode=atomic -coverprofile="coverage-${{ matrix.os }}.out" ./...

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage-${{ matrix.os }}.out
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup local coverage profile
        if: always()
        shell: bash
        run: rm -f "coverage-${{ matrix.os }}.out"

      # Coverage gating moved to the post-matrix `coverage-gate` job: it
      # merges every OS's uploaded profile so platform build-tagged files
      # (fsops_windows.go, inode_windows.go, *_unix.go) are credited from
      # their own OS run instead of false-failing per-OS. See
      # jobs.coverage-gate below.

      # Normalize the smoke env across OSes. RUNNER_TEMP on Windows is a
      # backslash path that breaks bash; cygpath -u converts it to a POSIX
      # path Git Bash can use. DA_BIN carries the .exe suffix on Windows so
      # every smoke step invokes the binary by the same variable.
      - name: Configure smoke environment
        run: |
          if command -v cygpath >/dev/null 2>&1; then
            base="$(cygpath -u "${RUNNER_TEMP}")"
          else
            base="${RUNNER_TEMP}"
          fi
          smoke="${base}/smoke-${GITHUB_RUN_ID}"
          {
            echo "SMOKE_HOME=${smoke}"
            echo "SMOKE_AGENTS_HOME=${smoke}/.agents"
          } >> "$GITHUB_ENV"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "DA_BIN=./bin/da.exe" >> "$GITHUB_ENV"
          else
            echo "DA_BIN=./bin/da" >> "$GITHUB_ENV"
          fi

      - name: Build CLI
        run: |
          mkdir -p ./bin
          go build -o "${DA_BIN}" ./cmd/da

      - name: Verify built binary is real Go binary (not a shim)
        run: |
          file "${DA_BIN}" | grep -qE "(ELF|Mach-O|PE32)"

      - name: Install GoReleaser (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: goreleaser check

      - name: Validate GoReleaser snapshot packaging (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOT_AGENTS_PAT: ${{ secrets.DOT_AGENTS_PAT }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_GPG_KEY_ID: ${{ secrets.HOMEBREW_TAP_GPG_KEY_ID }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        # Skip the cosign sign step in snapshot mode: snapshots run on PR
        # branches that do not have OIDC id-token: write permission, and
        # cosign is not installed in this validator job. The sign step is
        # exercised on the real release in auto-release.yml.
        run: goreleaser release --snapshot --clean --skip=sign

      # ── Smoke isolation ──────────────────────────────────────────────────
      # All smoke steps below override HOME and AGENTS_HOME so they cannot
      # inherit the runner's real ~/.agents config or links.
      #
      # Scenario families tracked here until .agents/workflow/testing-matrix.yaml
      # is introduced:
      # - built-binary-baseline
      # - isolated-home-bootstrap
      # - workflow-control-plane
      # - kg-bridge-surface
      # - managed-resource-listing
      # - release-packaging-parity
      # Smoke steps run on every OS including Windows (via Git Bash). The
      # built binary is resolved through the DA_BIN env (set by "Configure
      # smoke environment" to ./bin/da or ./bin/da.exe) and SMOKE_HOME is a
      # bash-normalized path (cygpath on Windows), so the harness is portable.
      - name: Test --version
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          output="$("${DA_BIN}" --version)"
          printf '%s\n' "$output"
          grep -q "^da " <<<"$output"

      - name: Test --help
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          output="$("${DA_BIN}" --help)"
          printf '%s\n' "$output"
          grep -q "Usage:" <<<"$output"

      - name: Test init --dry-run
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" init --dry-run

      - name: Test init (creates ~/.agents/)
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          # Remove if exists from previous run
          rm -rf "${HOME}/.agents"
          "${DA_BIN}" init --yes
          test -d "${HOME}/.agents"
          test -f "${HOME}/.agents/config.json"

      - name: Test status
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" status

      - name: Test doctor
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" doctor

      - name: Test add (with test project)
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          TEST_PROJECT="${SMOKE_HOME}/test-project"
          mkdir -p "${TEST_PROJECT}"
          "${DA_BIN}" add "${TEST_PROJECT}" --name ci-test --yes
          "${DA_BIN}" status > "${SMOKE_HOME}/status.txt"
          grep -q "ci-test" "${SMOKE_HOME}/status.txt"

      - name: Test status --audit
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" status --audit

      - name: Test remove --dry-run
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" remove ci-test --dry-run

      - name: Test sync status
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" sync status

      - name: Test skills list
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" skills list

      - name: Test workflow orient (no project context)
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" workflow orient 2>&1 || true

      - name: Test workflow help
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          "${DA_BIN}" workflow --help

      - name: Test kg help
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          ./bin/da kg --help

      # ── Config-v2 surface (config-distribution-model) ────────────────────
      # The full config-v2 + mutation + kg note-lane surface (with CONTENT
      # assertions, not just exit 0) is exercised by scripts/verify.sh against
      # the built ${DA_BIN}. verify.sh builds its OWN isolated HOME/AGENTS_HOME/
      # KG_HOME under a temp dir, so it is hermetic regardless of the runner
      # env. It discovers ./bin/da; on Windows DA_BIN is ./bin/da.exe, so a
      # ./bin/da copy is provided for the discovery probe (the underlying exe
      # is the same binary built above). Cross-OS: bash via the workflow shell.
      - name: Test config-v2 + kg surface (verify.sh, content assertions)
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
          KG_HOME: ${{ env.SMOKE_HOME }}/.kg
        run: |
          if [ ! -x ./bin/da ] && [ -x "${DA_BIN}" ]; then
            cp "${DA_BIN}" ./bin/da
          fi
          bash scripts/verify.sh

      # ── KG CODE lane (requires code-review-graph) ────────────────────────
      # The note lane (warm/query/bridge) above needs no crg. The CODE lane
      # (build → code-status → impact) needs the real code-review-graph CLI,
      # which the "Set up code-review-graph (.venv)" step installed earlier on
      # non-Windows runners (Windows venv layout is .venv/Scripts and is not
      # probed by DiscoverCRGBin, so the code lane is skipped there — same
      # condition as that setup step). Assertions are on CONTENT: a built graph
      # reports nodes>0 and `kg impact` returns real changed symbols.
      - name: Test kg CODE lane (crg build + content assertions)
        if: runner.os != 'Windows'
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
          KG_HOME: ${{ env.SMOKE_HOME }}/code-kg
        run: |
          "${DA_BIN}" init --yes
          "${DA_BIN}" kg setup
          "${DA_BIN}" kg build
          # code-status JSON must report a non-empty, ready graph.
          "${DA_BIN}" kg code-status --json > "${SMOKE_HOME}/code-status.json"
          cat "${SMOKE_HOME}/code-status.json"
          nodes="$(jq -r '.nodes' "${SMOKE_HOME}/code-status.json")"
          ready="$(jq -r '.ready' "${SMOKE_HOME}/code-status.json")"
          test "${ready}" = "true"
          test "${nodes}" -gt 0
          # kg impact on a real source file must return changed symbols.
          "${DA_BIN}" kg impact commands/config/sync.go --json > "${SMOKE_HOME}/impact.json"
          symbols="$(jq -r '.changed_nodes | length' "${SMOKE_HOME}/impact.json")"
          test "${symbols}" -gt 0

      - name: Cleanup
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
        run: |
          rm -rf "${HOME}/.agents"
          rm -rf "${SMOKE_HOME}"

  # SonarQube analysis moved out of the per-OS matrix (it ran 3x in
  # parallel on single-OS coverage, racing/clobbering the PR analysis)
  # into the post-matrix coverage-gate job, fed the MERGED multi-OS
  # profile for an accurate, deterministic single scan.
  coverage-gate:
    name: Coverage gate (merged multi-OS)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: SonarQube (run here now) needs blame/SCM for
          # new-code detection; a shallow clone re-triggers the
          # "shallow clone detected" warning fixed in #22.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Install gocovmerge
        # Pinned to a commit (gocovmerge has no semver tags) for a
        # reproducible, supply-chain-stable install (Sonar S8545).
        run: go install github.com/wadey/gocovmerge@b5bfa59ec0adc420475f97f89b58045c721d761c

      - name: Download coverage profiles (all OS)
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: covprofiles

      - name: Merge multi-OS coverage profiles
        run: |
          set -euo pipefail
          shopt -s nullglob
          profiles=(covprofiles/coverage-*/coverage-*.out)
          if [ ${#profiles[@]} -eq 0 ]; then
            echo "coverage-gate: no per-OS coverage profiles found" >&2
            exit 1
          fi
          echo "merging ${#profiles[@]} profile(s): ${profiles[*]}"
          # Merged file is named coverage.out so sonar-project.properties'
          # default sonar.go.coverage.reportPaths=coverage.out just works
          # (no scan-arg override needed).
          "$(go env GOPATH)/bin/gocovmerge" "${profiles[@]}" > coverage.out

      # Generate dashboard (React/TS) vitest coverage so Sonar gets an lcov
      # report for web/dashboard/src — without this the new TS lines land at
      # 0% covered and trigger the new_coverage gate. The lcov is output to
      # web/dashboard/coverage/lcov.info as configured in vite.config.ts and
      # referenced by sonar.javascript.lcov.reportPaths in sonar-project.properties.
      - name: Set up Node (dashboard vitest coverage)
        # SHA-pinned per Sonar S8543 (mutable tag refs are security-sensitive).
        # v6.4.0 is the same SHA used in deploy-docs.yml; node-version is set
        # below so the action version does not constrain the Node runtime.
        # Node 22: pnpm@11 uses node:sqlite (builtin from Node 22), so Node 20
        # crashes `pnpm install` with ERR_UNKNOWN_BUILTIN_MODULE.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        # Pin exact version (S8543: locked resolved versions) and pass
        # --ignore-scripts (S6505: lifecycle scripts). pnpm is pure JS so it
        # functions correctly without running its own postinstall scripts.
        run: npm install -g pnpm@11.9.0 --ignore-scripts

      - name: Install pnpm workspace dependencies
        # pnpm-lock.yaml lives at the repo root (workspace root).
        # --frozen-lockfile ensures the install matches the committed lock exactly.
        # --ignore-scripts per Sonar S6505. esbuild (in onlyBuiltDependencies)
        # is rebuilt explicitly in the next step so vite/vitest find the binary.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild binary
        # esbuild postinstall (binary download) was skipped by --ignore-scripts
        # above. pnpm rebuild runs only the named package's build scripts so the
        # vite and vitest invocations in the next step can locate the native binary.
        # Filter to the dashboard package: the repo root has no package.json, so a
        # bare `pnpm rebuild` errors ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND.
        run: pnpm --filter r2-observability-dashboard rebuild esbuild

      - name: Run dashboard vitest with lcov coverage
        # Produces web/dashboard/coverage/lcov.info consumed by sonar.javascript.lcov.reportPaths.
        run: pnpm --filter r2-observability-dashboard test:coverage

      - name: Install obs worker deps
        # obs is a standalone npm package (not in the pnpm workspace); its tests
        # emit c8 lcov consumed by sonar.javascript.lcov.reportPaths so obs/src
        # lines get a real coverage signal instead of reading 0% for lack of one.
        # --ignore-scripts per Sonar S6505; esbuild (tsx's native dep) is rebuilt
        # explicitly next so the tsx --test run can locate its binary.
        run: npm --prefix obs ci --ignore-scripts

      - name: Rebuild obs esbuild binary
        run: npm --prefix obs rebuild esbuild

      - name: Run obs worker tests with lcov coverage
        # Produces obs/coverage/lcov.info (SF: paths relative to obs/, matching the
        # dashboard pattern; Sonar resolves them against the report's package dir).
        run: npm --prefix obs run test:coverage

      # Provide the scanner's JRE on the runner so it does NOT download one from
      # Sonar's CDN mid-run (that download intermittently 403s and failed this
      # gate). Paired with sonar.scanner.skipJreProvisioning below.
      - name: Set up Java (Sonar scanner JRE)
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Scan (merged coverage)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # qualitygate.wait blocks until SonarCloud finishes ingesting the
          # analysis, so the new-issues gate below can query issues/search and
          # get the just-uploaded results (not a stale prior analysis).
          # skipJreProvisioning uses the runner's JAVA_HOME JRE instead of
          # provisioning one from the Sonar CDN (avoids the transient HTTP 403).
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.scanner.skipJreProvisioning=true

      # Free-tier replacement for the unassignable `dot-agents-strict` quality
      # gate: SonarCloud custom gates require a paid plan, so we enforce
      # new_violations=0 ourselves via the web API after the scan is ingested.
      # Hard-fails (no continue-on-error) if the PR/branch introduces ANY new
      # issue in the new-code period. Runs in the SAME job, AFTER the scan, so
      # the analysis is guaranteed ingested (qualitygate.wait above).
      - name: Enforce zero new Sonar issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash scripts/sonar-new-issues-gate.sh

      # Retain the former 95% hard floor before applying the 100% target.
      # Its narrower exceptions set prevents newly grandfathered target-debt
      # files from regressing below the floor that was enforced before #391.
      - name: Coverage floor (95% compatibility ratchet)
        env:
          COVERAGE_FILE: coverage.out
          COVERAGE_THRESHOLD: '95'
          COVERAGE_PKG_MODE: warn
          COVERAGE_FILE_MODE: enforce
          COVERAGE_EXCEPTIONS: scripts/coverage-floor-exceptions.txt
        run: bash scripts/coverage-gate.sh

      # Phase 2 (cg6) = PER-FILE ENFORCE via the 100% target ratchet.
      # The merged multi-OS profile is STRICTER than the old per-OS gate:
      # it surfaces *_windows.go statements Windows's POSIX-skipping suite
      # covers weakly. Rather than block on remediating the whole legacy
      # tail, known sub-100 files are seeded into the rationale'd
      # coverage-exceptions allowlist; per-file now ENFORCES, so the
      # already-clean files can never regress and every NEW file must hit
      # 100%. The cg6 side-loop raises allowlisted files and deletes their
      # entries — enforcement only tightens. Per-package stays warn until
      # its own baseline (cg5) is worked (separate from the per-file tail).
      - name: Coverage target (100% per-file ratchet)
        env:
          COVERAGE_FILE: coverage.out
          COVERAGE_THRESHOLD: '100'
          COVERAGE_PKG_MODE: warn
          COVERAGE_FILE_MODE: enforce
        run: bash scripts/coverage-gate.sh

      - name: Cleanup merged coverage profile
        if: always()
        run: rm -rf coverage.out covprofiles
