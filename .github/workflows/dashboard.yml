name: Dashboard

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  go-dashboard:
    name: Go dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Test dashboard packages
        run: go test -race -count=1 -covermode=atomic -coverprofile=dashboard-coverage.out ./internal/dashboard/...

      - name: Enforce dashboard package coverage floor
        env:
          COVERAGE_FILE: dashboard-coverage.out
          COVERAGE_THRESHOLD: '95'
          COVERAGE_PKG_MODE: enforce
          COVERAGE_FILE_MODE: off
        run: bash scripts/coverage-gate.sh

  web-dashboard:
    name: Web dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11.9.0 --ignore-scripts

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild esbuild binary
        run: pnpm --filter r2-observability-dashboard rebuild esbuild

      - name: Typecheck dashboard
        run: pnpm --filter r2-observability-dashboard typecheck

      - name: Test dashboard
        run: pnpm --filter r2-observability-dashboard test

      - name: Build dashboard
        run: pnpm --filter r2-observability-dashboard build
