name: Auto Release

on:
  push:
    branches: [master]
    paths:
      - 'VERSION'
  # Manual trigger so a release that failed on infra (e.g. a signing-tool
  # regression) can be re-run from master WITHOUT a version bump; honors the
  # 'Check if release exists' guard so it no-ops if the version already shipped.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # id-token: write is required for Cosign keyless signing via Sigstore.
  # GitHub mints a short-lived OIDC token that cosign exchanges for a
  # signing certificate from Fulcio; the signing event is logged to Rekor.
  id-token: write

env:
  GO_TEST_FLAGS: -race -count=1 -timeout=300s
  GO_COVERAGE_FILE: coverage.out

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # The OIDC federated credential for Trusted Signing is bound to the subject
    # repo:AGOrcha/dot-agents:environment:release, so the release job must run
    # under this environment for the minted token to be accepted. Until a
    # `release` environment with protection rules is configured, GitHub
    # auto-creates an unprotected one — no approval gate, no behavior change.
    environment: release
    env:
      SMOKE_HOME: /tmp/release-smoke-${{ github.run_id }}
      SMOKE_AGENTS_HOME: /tmp/release-smoke-${{ github.run_id }}/.agents

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for tagging

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if release exists
        id: check
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} does not exist, will create"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Build CLI
        if: steps.check.outputs.exists == 'false'
        run: |
          go build \
            -ldflags "-X github.com/AGOrcha/dot-agents/commands.Version=${{ steps.version.outputs.version }} -X github.com/AGOrcha/dot-agents/commands.Commit=${GITHUB_SHA} -X github.com/AGOrcha/dot-agents/commands.Describe=v${{ steps.version.outputs.version }}" \
            -o ./bin/da ./cmd/da

      - name: Verify CLI version matches
        if: steps.check.outputs.exists == 'false'
        run: |
          CLI_VERSION=$(./bin/da --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          FILE_VERSION="${{ steps.version.outputs.version }}"
          if [ "$CLI_VERSION" != "$FILE_VERSION" ]; then
            echo "CLI reports version $CLI_VERSION but VERSION file has $FILE_VERSION"
            exit 1
          fi
          echo "Version check: CLI=$CLI_VERSION, File=$FILE_VERSION"

      - name: Run Go tests
        if: steps.check.outputs.exists == 'false'
        run: go test $GO_TEST_FLAGS -covermode=atomic -coverprofile="${GO_COVERAGE_FILE}" ./...

      - name: Run built-binary smoke tests
        if: steps.check.outputs.exists == 'false'
        env:
          HOME: ${{ env.SMOKE_HOME }}
          AGENTS_HOME: ${{ env.SMOKE_AGENTS_HOME }}
          KG_HOME: ${{ env.SMOKE_HOME }}/.kg
        run: |
          ./bin/da --version
          ./bin/da --help
          ./bin/da init --yes
          test -d "${HOME}/.agents"
          # Reshaped read-only status/doctor surface.
          ./bin/da status
          ./bin/da status --json
          ./bin/da status --audit
          ./bin/da doctor
          ./bin/da doctor --json
          # Full config-v2 (layering/lock/dry-run/install) + kg NOTE-lane
          # surface with content assertions, against the built ./bin/da.
          # scripts/verify.sh builds its own isolated HOME/AGENTS_HOME/KG_HOME,
          # so a broken config-v2 or kg release binary is caught here. The
          # release path deliberately uses the NOTE lane only — it does NOT
          # install code-review-graph, so no flaky crg dependency is added to
          # releases (the crg CODE lane is exercised in test.yml).
          bash scripts/verify.sh

      # Provide the scanner's JRE on the runner so it does NOT download one from
      # Sonar's CDN mid-run (that download intermittently 403s and fails the
      # scan). Paired with sonar.scanner.skipJreProvisioning below.
      - name: Set up Java (Sonar scanner JRE)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Use the runner's JAVA_HOME JRE instead of provisioning one from the
          # Sonar CDN (avoids the transient HTTP 403 on the JRE download).
          args: -Dsonar.scanner.skipJreProvisioning=true

      - name: Install Cosign
        if: steps.check.outputs.exists == 'false'
        # Pinned to v4.1.2 commit SHA per supply-chain hardening (S7637-adjacent).
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install GoReleaser
        if: steps.check.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      # --- Windows Authenticode signing via Azure Trusted Signing (gated) ---
      # The whole signing path is gated on TRUSTED_SIGNING_PROFILE — the LAST
      # variable to be set (only after identity validation clears and the Public
      # Trust cert profile exists). The other AZURE_*/TRUSTED_SIGNING_* vars can
      # be populated ahead of time with zero effect: until a profile name is set
      # these steps skip and the GoReleaser sign-windows hook no-ops, so releases
      # ship unsigned Windows binaries exactly as today. Only variable NAMES are
      # referenced here — no credential values live in the workflow.
      - name: Azure login (OIDC, for Trusted Signing)
        if: steps.check.outputs.exists == 'false' && vars.TRUSTED_SIGNING_PROFILE != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install jsign (Windows Authenticode signing)
        if: steps.check.outputs.exists == 'false' && vars.TRUSTED_SIGNING_PROFILE != ''
        # jsign is a JVM tool (Linux-native, no .NET/kernel32 dependency) that
        # natively supports Azure Trusted Signing (--storetype TRUSTEDSIGNING),
        # replacing the dotnet `sign` tool that crashed on Linux with a
        # kernel32.dll DllNotFoundException (dotnet/sign#711) and broke 0.4.0.
        # The JRE is already on the runner (Set up Java, above). Pinned +
        # checksum-verified per supply-chain norm; bump both together to upgrade.
        env:
          JSIGN_VERSION: '7.4'
          JSIGN_SHA256: 2abf2ade9ea322acc2d60c24794eadc465ff9380938fca4c932d09e0b25f1c28
        run: |
          curl -sSL --proto '=https' --proto-redir '=https' -o /tmp/jsign.jar "https://github.com/ebourg/jsign/releases/download/${JSIGN_VERSION}/jsign-${JSIGN_VERSION}.jar"
          echo "${JSIGN_SHA256}  /tmp/jsign.jar" | sha256sum -c -
          echo "JSIGN_JAR=/tmp/jsign.jar" >> "${GITHUB_ENV}"

      - name: Acquire Trusted Signing access token
        if: steps.check.outputs.exists == 'false' && vars.TRUSTED_SIGNING_PROFILE != ''
        # jsign authenticates to Trusted Signing with an Azure access token for
        # the codesigning resource, passed as the keystore password. The az CLI
        # is already logged in via the OIDC step above. The token is masked and
        # exported for the GoReleaser hook (scripts/sign-windows.sh).
        run: |
          token="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::${token}"
          echo "TRUSTED_SIGNING_TOKEN=${token}" >> "${GITHUB_ENV}"

      # --- macOS Developer ID signing via quill (gated) ---
      # quill (https://github.com/anchore/quill) signs/notarizes Mach-O binaries
      # from Linux, so darwin binaries are Developer ID-signed on this ubuntu
      # runner — the macOS counterpart to the jsign path above. Gated on
      # MACOS_SIGNING_ENABLED so it stays dormant (and scripts/sign-macos.sh
      # no-ops on empty QUILL_SIGN_P12) until the cert + secrets are configured.
      - name: Install quill (macOS Developer ID signing)
        if: steps.check.outputs.exists == 'false' && vars.MACOS_SIGNING_ENABLED == 'true'
        # Pinned, checksum-verified release binary — reproducible (no @version
        # dependency resolution, no remote script piped to a shell). Bump both
        # QUILL_VERSION and QUILL_SHA256 together to adopt a newer quill.
        env:
          QUILL_VERSION: 0.7.1
          QUILL_SHA256: e58c6f86378a22507c1123e24412afd4ee2d3bb32ebd94d6059827dc0c1b3fbf
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL --proto '=https' --proto-redir '=https' -o /tmp/quill.tar.gz "https://github.com/anchore/quill/releases/download/v${QUILL_VERSION}/quill_${QUILL_VERSION}_linux_amd64.tar.gz"
          echo "${QUILL_SHA256}  /tmp/quill.tar.gz" | sha256sum -c -
          tar -C "$HOME/.local/bin" -xzf /tmp/quill.tar.gz quill
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/quill" version

      - name: Import Homebrew tap signing key
        if: steps.check.outputs.exists == 'false'
        env:
          HOMEBREW_TAP_GPG_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg-homebrew-tap"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"
          printf '%s' "${HOMEBREW_TAP_GPG_PRIVATE_KEY}" | gpg --batch --yes --import

      - name: Run GoReleaser
        if: steps.check.outputs.exists == 'false'
        env:
          GORELEASER_CURRENT_TAG: v${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOT_AGENTS_PAT: ${{ secrets.DOT_AGENTS_PAT }}
          AGORCHA_PAT: ${{ secrets.AGORCHA_PAT }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_GPG_KEY_ID: ${{ secrets.HOMEBREW_TAP_GPG_KEY_ID }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          # Trusted Signing (gated): empty until the repo variables are set, which
          # makes scripts/sign-windows.sh a no-op. NAMES referenced, not values.
          # jsign signs against these via the TRUSTEDSIGNING storetype, using
          # TRUSTED_SIGNING_TOKEN (set by the "Acquire Trusted Signing access
          # token" step) as the keystore password and JSIGN_JAR as the pinned jar.
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          TRUSTED_SIGNING_TSA: ${{ vars.TRUSTED_SIGNING_TSA }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # macOS Developer ID signing/notarization via quill (gated): these are
          # empty until the QUILL_* secrets are set, which makes
          # scripts/sign-macos.sh a no-op. quill reads them from the environment.
          QUILL_SIGN_P12: ${{ secrets.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
        run: |
          # Ensure an annotated tag for this version exists
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

          # Let GoReleaser handle GitHub release + archives + Homebrew
          goreleaser release --clean --verbose

      - name: Verify Cosign signature on checksums.txt
        if: steps.check.outputs.exists == 'false'
        # Catches sign-then-fail-to-verify drift: re-runs the exact verification
        # recipe documented in docs/RELEASE_VERIFICATION.md against the just-built
        # artifacts in dist/. Fails the release if the consumer-facing recipe is broken.
        env:
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          ls -la checksums.txt*
          cosign verify-blob \
            --bundle checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/auto-release.yml@${REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt

      - name: Cleanup smoke home
        if: always()
        run: rm -rf "${SMOKE_HOME}"
