# dot-agents pre-commit mandate, managed by prek (https://prek.j178.dev).
#
# Install once (idempotent):   prek install
#   → installs the pre-commit AND pre-push git hooks.
# Update hook versions:        prek autoupdate
# Run manually:                prek run --all-files
#                              prek run --all-files --hook-stage pre-push
#
# Design: the pre-commit stage is fast (formatting only) so every commit
# stays cheap. The heavy mandate runs at the pre-push stage in two hooks:
#   1. `make gate` — the SINGLE SOURCE OF TRUTH for the fast merge-blocking
#      mandate: build + vet (POSIX + windows cross-compile) + gofmt + per-file
#      coverage ENFORCE scoped to changed .go files (matches CI's per-file
#      contract for new code). This replaced the separate go-build-vet +
#      per-PACKAGE coverage hooks, which drifted from CI (per-package passed
#      locally, per-file failed CI). One definition: scripts/gate.sh.
#   2. sonar — the native SonarCloud quality gate (unchanged here).
# (Running the suite per commit previously corrupted the shared git config via
# leaked GIT_DIR; scripts/gate.sh + precommit-mandate.sh strip that env and
# prek isolates hook exec.)
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # ---- fast, every commit -------------------------------------
      - id: gofmt
        name: gofmt
        entry: bash scripts/precommit-mandate.sh fmt
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      # ---- heavy, on push -----------------------------------------
      # `make gate` is the single source of truth for the fast merge-blocking
      # mandate: build + vet (POSIX + windows cross-compile) + gofmt + per-file
      # coverage ENFORCE scoped to changed .go files. It replaces the old
      # go-build-vet + per-package coverage hooks (which drifted from CI).
      - id: gate
        name: make gate (build+vet+cross+per-file coverage of changed files)
        entry: make gate
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: sonar-scanner
        name: sonar-scanner (containerized)
        entry: bash scripts/precommit-mandate.sh sonar
        language: system
        pass_filenames: false
        stages: [pre-push]
