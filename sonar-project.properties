sonar.projectKey=NikashPrakash_dot-agents
sonar.organization=npk-aorcha

sonar.go.coverage.reportPaths=coverage.out

# Source vs test classification (Go convention: *_test.go is test code)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/testutil/**

# Don't measure coverage of test code, generated schemas, embedded templates, or migrations
sonar.coverage.exclusions=**/*_test.go,**/testutil/**,**/schemas/**,**/internal/scaffold/templates/**,**/internal/graphstore/migrations.go

# Don't flag duplicated patterns inside test fixtures/boilerplate
sonar.cpd.exclusions=**/*_test.go,**/testutil/**

# Standard exclusions: vendor, build artifacts, agent workflow state
sonar.exclusions=**/vendor/**,**/node_modules/**,**/.agents/**,**/.claude/**,**/dot-agents,**/bin/da
