sonar.projectKey=AGOrcha_dot-agents
sonar.organization=agorcha

sonar.go.coverage.reportPaths=coverage.out
# TS/JS lcov coverage — generated by the coverage-gate CI job before the Sonar
# scan: the dashboard via `pnpm --filter r2-observability-dashboard test:coverage`,
# and the obs Cloudflare worker via `npm --prefix obs run test:coverage` (c8).
sonar.javascript.lcov.reportPaths=web/dashboard/coverage/lcov.info,obs/coverage/lcov.info

# Source vs test classification (Go convention: *_test.go is test code)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/testutil/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Coverage scope MUST mirror the authoritative Go gate's EXCLUDE_RE
# (scripts/coverage-gate.sh): cmd/* entrypoints (no business logic),
# storetest/testutil/linktest scaffolding, scaffold embed asset dirs,
# scripts/cov*.go dev tools — plus generated schemas/migrations. Keeping
# the two lenses aligned prevents Sonar new_coverage false-fails on code
# the ratified per-file gate already excludes (e.g. cmd/*/main.go at 0%).
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/testutil/**,\
  **/internal/storetest/**,\
  **/internal/linktest/**,\
  **/schemas/**,\
  **/cmd/*/**,\
  **/internal/scaffold/home/**,\
  **/internal/scaffold/hooks/**,\
  **/internal/scaffold/templates/**,\
  **/internal/graphstore/migrations.go,\
  **/scripts/cov*.go,\
  web/dashboard/src/main.tsx,\
  web/dashboard/*.config.*,\
  web/dashboard/scripts/**,\
  web/dashboard/src/api/types.gen.ts

# Standard exclusions: vendor, build artifacts, agent workflow state.
# docs/web/ is an Astro static-site scaffold (TS/Astro/JSON, no Go code, no
# Go-style test gate); packaging/ holds Homebrew formula/cask drafts (Ruby,
# untested by design). Exclude both from analysis so new_coverage isn't computed
# against files the Go coverage gate doesn't cover by design.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/.agents/**,**/.claude/**,**/dot-agents,**/bin/da,**/docs/web/**,**/packaging/**,**/internal/scaffold/home/starter/**,**/dist/**,**/.scannerwork/**,web/dashboard/src/api/types.gen.ts

# Pin the TS tsconfig so the JS/TS analyzer does NOT auto-discover tsconfig.json
# files across local git worktrees (.agents/worktrees, .claude/worktrees). That
# auto-discovery ignores sonar.exclusions and, with many worktrees present, floods
# and crashes the containerized scanner. docs/web is excluded from analysis anyway;
# web/dashboard is the active TS project under analysis.
sonar.typescript.tsconfigPaths=docs/web/tsconfig.json,web/dashboard/tsconfig.json

# Playwright e2e specs (web/dashboard/e2e/**) use env-gated
# test.skip(condition, reason) — the official Playwright API — to no-op when no
# live backend/browser is wired, and they run under `playwright test`, not any
# test.yml CI job. S1607 ("remove this skipped test or explain why") misreads
# those runtime guards as disabled tests, so suppress it for that path only.
# The graph merge (internal/graphstore/merge.go) assembles its INSERT/DELETE/
# probe statements from identifiers rather than a fixed string: the table is one
# of two package constants (`nodes`, `edges`), the schema one of two (`main`,
# `src`), and the column list is read back from the databases' OWN schema via
# `SELECT * ... LIMIT 0` and double-quote-escaped through quoteIdent. No caller
# input reaches the statement text — every value, including the repository scope
# and the source database path, is a bound parameter. S2077 cannot see that the
# interpolated parts are schema-derived, so suppress it for that one file.
sonar.issue.ignore.multicriteria=e2eskip,mergesql
sonar.issue.ignore.multicriteria.e2eskip.ruleKey=typescript:S1607
sonar.issue.ignore.multicriteria.e2eskip.resourceKey=web/dashboard/e2e/**
sonar.issue.ignore.multicriteria.mergesql.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.mergesql.resourceKey=internal/graphstore/merge.go
