sonar.projectKey=AGOrcha_dot-agents
sonar.organization=agorcha

sonar.go.coverage.reportPaths=coverage.out
# Dashboard (React/TS) vitest coverage — generated by the coverage-gate CI job
# before the Sonar scan via `pnpm --filter r2-observability-dashboard test:coverage`.
sonar.javascript.lcov.reportPaths=web/dashboard/coverage/lcov.info

# Source vs test classification (Go convention: *_test.go is test code)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/testutil/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Coverage scope MUST mirror the authoritative Go gate's EXCLUDE_RE
# (scripts/coverage-gate.sh): cmd/* entrypoints (no business logic),
# storetest/testutil/linktest scaffolding, scaffold embed asset dirs,
# scripts/cov*.go dev tools — plus generated schemas/migrations. Keeping
# the two lenses aligned prevents Sonar new_coverage false-fails on code
# the ratified per-file gate already excludes (e.g. cmd/*/main.go at 0%).
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/testutil/**,\
  **/internal/storetest/**,\
  **/internal/linktest/**,\
  **/schemas/**,\
  **/cmd/*/**,\
  **/internal/scaffold/home/**,\
  **/internal/scaffold/hooks/**,\
  **/internal/scaffold/templates/**,\
  **/internal/graphstore/migrations.go,\
  **/scripts/cov*.go,\
  web/dashboard/src/main.tsx,\
  web/dashboard/*.config.*,\
  web/dashboard/scripts/**,\
  web/dashboard/src/api/types.gen.ts

# Standard exclusions: vendor, build artifacts, agent workflow state.
# docs/web/ is an Astro static-site scaffold (TS/Astro/JSON, no Go code, no
# Go-style test gate); packaging/ holds Homebrew formula/cask drafts (Ruby,
# untested by design). Exclude both from analysis so new_coverage isn't computed
# against files the Go coverage gate doesn't cover by design.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/.agents/**,**/.claude/**,**/dot-agents,**/bin/da,**/docs/web/**,**/packaging/**,**/internal/scaffold/home/starter/**,**/dist/**,**/.scannerwork/**

# Pin the TS tsconfig so the JS/TS analyzer does NOT auto-discover tsconfig.json
# files across local git worktrees (.agents/worktrees, .claude/worktrees). That
# auto-discovery ignores sonar.exclusions and, with many worktrees present, floods
# and crashes the containerized scanner. docs/web is excluded from analysis anyway;
# web/dashboard is the active TS project under analysis.
sonar.typescript.tsconfigPaths=docs/web/tsconfig.json,web/dashboard/tsconfig.json
