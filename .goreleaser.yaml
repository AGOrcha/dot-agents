version: 2

project_name: dot-agents

before:
  hooks:
    - go mod tidy

builds:
  - id: dot-agents-unix
    main: ./cmd/da
    binary: da
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/NikashPrakash/dot-agents/commands.Version={{.Version}}
      - -X github.com/NikashPrakash/dot-agents/commands.Commit={{.Commit}}
      - -X github.com/NikashPrakash/dot-agents/commands.Describe={{.Tag}}

  - id: dot-agents-windows
    main: ./cmd/da
    binary: da
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/NikashPrakash/dot-agents/commands.Version={{.Version}}
      - -X github.com/NikashPrakash/dot-agents/commands.Commit={{.Commit}}
      - -X github.com/NikashPrakash/dot-agents/commands.Describe={{.Tag}}

archives:
  - id: unix
    ids:
      - dot-agents-unix
    name_template: "dot-agents_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

  - id: windows
    ids:
      - dot-agents-windows
    name_template: "dot-agents_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: 
      - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# Cosign keyless signing via Sigstore + GitHub OIDC.
# Emits a single Sigstore bundle (checksums.txt.bundle) carrying both the
# signature and the Fulcio certificate. cosign v4 makes the new bundle format the
# default and ignores the legacy --output-signature/--output-certificate flags
# (they error out with an empty bundle path), so we sign with --bundle.
# Consumers verify the checksum file with cosign, then use
# `sha256sum -c checksums.txt` to verify any individual binary.
# Verification recipe: docs/RELEASE_VERIFICATION.md.
signs:
  - id: cosign-keyless
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true

release:
  github:
    owner: NikashPrakash
    name: dot-agents

# Dual-cask emit:
#   - dot-agents.rb            — unversioned "latest" pointer (overwritten each release)
#   - dot-agents@{version}.rb  — version-pinned (new file per release, never deleted)
# Both casks land in the same PR per release via the shared `goreleaser-cask-<v>`
# branch. Binary name stays `da` either way; only the cask identifier differs.
homebrew_casks:
  - name: dot-agents
    ids: &cask_ids
      - unix
    binaries: &cask_binaries
      - da
    # INTERIM Gatekeeper workaround: the darwin binaries are not yet Apple
    # Developer ID-signed/notarized, so Homebrew's quarantine attribute would make
    # macOS block `da` on first run ("cannot be opened / developer cannot be
    # verified"). Strip com.apple.quarantine on install until notarization lands.
    # Remove this hook once `notarize:` signing is wired (tracked for the AGOrcha
    # cutover; Homebrew drops support for Gatekeeper-failing casks 2026-09-01).
    hooks: &cask_hooks
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/da"]
          end
    commit_author: &cask_commit_author
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
      signing:
        enabled: true
        key: "{{ .Env.HOMEBREW_TAP_GPG_KEY_ID }}"
    url: &cask_url
      verified: "github.com/NikashPrakash/dot-agents/"
    repository: &cask_repository
      owner: AGOrcha
      name: homebrew-tap
      branch: "goreleaser-cask-{{ .Version }}"
      token: "{{ .Env.AGORCHA_PAT }}"
      pull_request:
        enabled: true
        draft: false
        base:
          branch: main
    description: "Manage AI agent configurations across projects"
    homepage: &cask_homepage "https://github.com/NikashPrakash/dot-agents"

  - name: "dot-agents@{{ .Version }}"
    ids: *cask_ids
    binaries: *cask_binaries
    hooks: *cask_hooks
    commit_author: *cask_commit_author
    url: *cask_url
    repository: *cask_repository
    description: "Manage AI agent configurations across projects (v{{ .Version }} pinned)"
    homepage: *cask_homepage
