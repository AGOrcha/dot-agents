version: 2

project_name: dot-agents

before:
  hooks:
    - go mod tidy

builds:
  - id: dot-agents-unix
    main: ./cmd/dot-agents
    binary: da
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/NikashPrakash/dot-agents/commands.Version={{.Version}}
      - -X github.com/NikashPrakash/dot-agents/commands.Commit={{.Commit}}
      - -X github.com/NikashPrakash/dot-agents/commands.Describe={{.Tag}}

  - id: dot-agents-windows
    main: ./cmd/dot-agents
    binary: da
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/NikashPrakash/dot-agents/commands.Version={{.Version}}
      - -X github.com/NikashPrakash/dot-agents/commands.Commit={{.Commit}}
      - -X github.com/NikashPrakash/dot-agents/commands.Describe={{.Tag}}

archives:
  - id: unix
    ids:
      - dot-agents-unix
    name_template: "dot-agents_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

  - id: windows
    ids:
      - dot-agents-windows
    name_template: "dot-agents_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: 
      - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: NikashPrakash
    name: dot-agents

homebrew_casks:
  - name: dot-agents
    ids:
      - unix
    binaries:
      - da
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
      signing:
        enabled: true
        key: "{{ .Env.HOMEBREW_TAP_GPG_KEY_ID }}"
    url:
      verified: "github.com/NikashPrakash/dot-agents/"
    repository:
      owner: NikashPrakash
      name: dot-agents
      branch: "goreleaser-cask-{{ .Version }}"
      token: "{{ .Env.DOT_AGENTS_PAT }}"
      pull_request:
        enabled: true
        draft: false
        base:
          branch: master
      git:
        url: "git@github.com:NikashPrakash/dot-agents.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    description: "Manage AI agent configurations across projects"
    homepage: "https://github.com/NikashPrakash/dot-agents"
