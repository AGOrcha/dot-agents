version: 2

project_name: dot-agents

before:
  hooks:
    - go mod tidy

builds:
  - id: dot-agents-unix
    main: ./cmd/da
    binary: da
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      # Developer ID-sign (+ notarize) each darwin `da` binary before it is
      # archived, so the tarball carries the signature. Gated: sign-macos.sh is a
      # no-op until QUILL_SIGN_P12 is set, and it skips non-darwin binaries — so
      # linux and (for now) unsigned darwin keep shipping exactly as today until
      # the Developer ID cert + secrets exist. quill signs Mach-O from Linux, so
      # this runs on the same ubuntu runner as the Windows/dotnet-sign path.
      post:
        - cmd: ./scripts/sign-macos.sh "{{ .Path }}" "{{ .Os }}"
          output: true
    ldflags:
      - -s -w
      - -X github.com/AGOrcha/dot-agents/commands.Version={{.Version}}
      - -X github.com/AGOrcha/dot-agents/commands.Commit={{.Commit}}
      - -X github.com/AGOrcha/dot-agents/commands.Describe={{.Tag}}

  - id: dot-agents-windows
    main: ./cmd/da
    binary: da
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    hooks:
      # Authenticode-sign each built da.exe before it is archived, so the zipped
      # binary carries the Trusted Signing signature. Gated: sign-windows.sh is a
      # no-op until TRUSTED_SIGNING_PROFILE is set, so releases keep shipping
      # (unsigned Windows binaries) until the Public Trust cert profile exists.
      post:
        - cmd: ./scripts/sign-windows.sh "{{ .Path }}"
          output: true
    ldflags:
      - -s -w
      - -X github.com/AGOrcha/dot-agents/commands.Version={{.Version}}
      - -X github.com/AGOrcha/dot-agents/commands.Commit={{.Commit}}
      - -X github.com/AGOrcha/dot-agents/commands.Describe={{.Tag}}

archives:
  - id: unix
    ids:
      - dot-agents-unix
    name_template: "dot-agents_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

  - id: windows
    ids:
      - dot-agents-windows
    name_template: "dot-agents_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: 
      - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# Cosign keyless signing via Sigstore + GitHub OIDC.
# Emits a single Sigstore bundle (checksums.txt.bundle) carrying both the
# signature and the Fulcio certificate. cosign v4 makes the new bundle format the
# default and ignores the legacy --output-signature/--output-certificate flags
# (they error out with an empty bundle path), so we sign with --bundle.
# Consumers verify the checksum file with cosign, then use
# `sha256sum -c checksums.txt` to verify any individual binary.
# Verification recipe: docs/RELEASE_VERIFICATION.md.
signs:
  - id: cosign-keyless
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true

release:
  github:
    owner: AGOrcha
    name: dot-agents

# Dual-cask emit (cask name == binary name == `da`):
#   - da.rb            — unversioned "latest" pointer (overwritten each release)
#   - da@{version}.rb  — version-pinned (new file per release, never deleted)
# Both casks land in the same PR per release via the shared `goreleaser-cask-<v>`
# branch. Install: `brew install agorcha/tap/da`.
homebrew_casks:
  - name: da
    ids: &cask_ids
      - unix
    binaries: &cask_binaries
      - da
    # Homebrew's :cobra format already injects `completion <shell>`
    # (pwsh → powershell). Do not also pass args: [completion] — that doubles
    # the subcommand and install-time generation fails.
    generate_completions_from_executable: &cask_completions
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
        - pwsh
    # The darwin binaries are Apple Developer ID-signed and notarized (via quill)
    # as of v0.4.0, so notarized binaries clear Gatekeeper on first run without
    # stripping the com.apple.quarantine attribute. The former quarantine-strip
    # postflight hook was an until-notarization stopgap and is no longer needed.
    commit_author: &cask_commit_author
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
      signing:
        enabled: true
        key: "{{ .Env.HOMEBREW_TAP_GPG_KEY_ID }}"
    url: &cask_url
      verified: "github.com/AGOrcha/dot-agents/"
    repository: &cask_repository
      owner: AGOrcha
      name: homebrew-tap
      branch: "goreleaser-cask-{{ .Version }}"
      token: "{{ .Env.AGORCHA_PAT }}"
      pull_request:
        enabled: true
        draft: false
        base:
          branch: main
    description: "Manage AI agent configurations across projects"
    homepage: &cask_homepage "https://github.com/AGOrcha/dot-agents"

  - name: "da@{{ .Version }}"
    ids: *cask_ids
    binaries: *cask_binaries
    generate_completions_from_executable: *cask_completions
    commit_author: *cask_commit_author
    url: *cask_url
    repository: *cask_repository
    description: "Manage AI agent configurations across projects (v{{ .Version }} pinned)"
    homepage: *cask_homepage
